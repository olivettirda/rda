<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세션 리플레이 — 프롬프트로 웹앱 만들기 (AI 아이디어톤)</title>
<!--
  단일 자기완결 HTML. 외부 호출 0건(시스템 폰트). 더블클릭으로 열림.
  Claude Code 세션을 간소화 재현한 "대화 리플레이" — 화면 녹화하면 그대로 영상.
  내용 근거: prompt_logic_3.md/4.md, PR #244·#245·#272, CLAUDE.md (레포 실제 흔적).
  자동 재생 / Space·→ 다음 / R 재시작 / F 전체화면.
-->
<style>
:root{
  /* Apple tokens (DESIGN.md) */
  --blue:#0066cc; --blue-dark:#2997ff;
  --ink:#1d1d1f; --ink-80:#333333; --ink-48:#7a7a7a;
  --white:#ffffff; --parch:#f5f5f7; --pearl:#fafafc;
  --tile:#272729; --black:#000000; --hairline:#e0e0e0; --muted-dark:#cccccc;
  --f:"SF Pro Text","SF Pro Display",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"SF Mono","Consolas","D2Coding",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--black); font-family:var(--f); color:var(--ink); overflow:hidden;
  letter-spacing:-0.3px; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
}
#stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#screen{
  width:1280px; height:720px; transform-origin:center center;
  background:var(--white); border-radius:22px; overflow:hidden;
  box-shadow:0 26px 80px rgba(0,0,0,.5);
  display:flex; flex-direction:column;
}
/* 타이틀 바 (검정) */
.titlebar{
  height:74px; flex:0 0 74px; background:var(--black);
  display:flex; align-items:center; gap:16px; padding:0 28px;
}
.logo-pill{
  background:transparent; color:#fff; font-weight:600; font-size:28px; letter-spacing:-0.5px; padding:0;
}
.logo-pill::after{content:"."; color:var(--blue-dark);}
.title-txt{color:#fff; font-weight:600; font-size:24px; letter-spacing:-0.4px;}
.title-sub{color:#8a8a8e; font-size:18px; letter-spacing:-0.3px;}
.rec{ margin-left:auto; display:flex; align-items:center; gap:9px; color:#fff; font-size:19px; font-weight:400;}
.rec .led{width:13px;height:13px;border-radius:50%;background:var(--blue-dark);animation:blink 1s steps(2,end) infinite;}
@keyframes blink{50%{opacity:.25;}}

/* 진행 바 */
.progress{height:5px;flex:0 0 5px;background:var(--hairline);}
.progress > i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s;}

/* 대화 영역 */
.chat{flex:1 1 auto; overflow:hidden; position:relative; padding:24px 34px;}
.chat-scroll{position:absolute; left:34px; right:34px; bottom:22px; display:flex; flex-direction:column; gap:18px;}
.msg{display:flex; gap:16px; max-width:90%; opacity:0; transform:translateY(10px); transition:.25s;}
.msg.show{opacity:1; transform:none;}
.msg .av{
  flex:0 0 52px; width:52px; height:52px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:26px; background:var(--parch); border:1px solid var(--hairline);
}
.msg.user{align-self:flex-end; flex-direction:row-reverse;}
.msg.user .av{background:var(--blue); color:#fff;}
.bubble{
  background:var(--white); border:1px solid var(--hairline); border-radius:20px;
  padding:18px 24px; font-size:26px; line-height:1.42; color:var(--ink); letter-spacing:-0.3px;
}
.msg.user .bubble{background:var(--parch); border-color:var(--parch);}
.bubble b{font-weight:600;}
.bubble .who{font-size:18px; font-weight:600; letter-spacing:-0.2px; color:var(--blue); margin-bottom:7px;}
.bubble.trouble{border-color:#f1b4b6; background:#fdeced;}
.cursor::after{content:"▋"; color:var(--blue); animation:blink .8s steps(2,end) infinite;}

/* 재생 오버레이 (시작 전) */
.playov{
  position:absolute; inset:0; z-index:5; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:rgba(245,245,247,.72); backdrop-filter:saturate(180%) blur(3px);
}
.playov .pbtn{
  width:108px; height:108px; border-radius:50%; background:var(--blue); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:46px; padding-left:8px;
}
.playov .ptext{font-size:28px; font-weight:600; color:var(--ink); letter-spacing:-0.4px;}
.playov .phint{font-size:19px; color:var(--ink-48); letter-spacing:-0.3px;}

/* Claude 액션 카드 */
.card{
  background:var(--parch); border-radius:14px;
  padding:15px 20px; margin-top:12px; font-size:23px; color:var(--ink); display:flex; gap:14px; align-items:center; letter-spacing:-0.3px;
}
.card b{font-weight:600;}
.card .ic{font-size:24px; line-height:1;}
.card .tag{
  margin-left:auto; flex:0 0 auto; background:var(--ink); color:#fff; font-weight:600;
  font-size:18px; padding:6px 13px; border-radius:9999px; white-space:nowrap;
}
.card.ok{background:#e9f5ee; color:#1a7a43;}
.card.ok .ic{color:#1a7a43;}
.card.rule{background:#eaf2fc;}
.code{
  background:#1d1d1f; color:#e8e8ed; font-family:var(--f-mono); font-size:20px; line-height:1.5;
  border-radius:14px; padding:16px 20px; margin-top:12px; white-space:pre; overflow:hidden; letter-spacing:0;
}
.code .c{color:#8a8a8e;} .code .k{color:#2997ff;} .code .s{color:#6abf69;} .code .v{color:#d6a85a;}

/* 엔드 카드 */
.endcard{
  align-self:center; text-align:center; background:var(--tile); color:#fff;
  border-radius:20px; padding:30px 46px; max-width:96%;
}
.endcard .big{font-weight:600; font-size:46px; color:#fff; letter-spacing:-1.5px; line-height:1.08;}
.endcard .sub{font-size:26px; color:var(--muted-dark); font-weight:400; margin-top:12px; letter-spacing:-0.4px;}

/* 푸터 컨트롤 */
.footbar{
  height:66px; flex:0 0 66px; background:var(--white);
  display:flex; align-items:center; gap:12px; padding:0 26px; border-top:1px solid var(--hairline);
}
.footbar .step{color:var(--ink-48); font-size:21px; font-weight:600; letter-spacing:-0.3px;}
.footbar .grow{margin-left:auto;}
.btn{
  cursor:pointer; border:none; font-family:var(--f); font-weight:400; font-size:20px;
  letter-spacing:-0.3px; padding:12px 22px; border-radius:9999px; transition:transform .08s;
}
.btn:active{transform:scale(0.96);}
.btn-s{background:var(--blue); color:#fff;}
.btn-a{background:transparent; color:var(--blue); border:1.5px solid var(--blue);}
.btn-d{background:var(--ink); color:#fff;}
.hint{position:fixed; bottom:12px; left:50%; transform:translateX(-50%); color:#8a8a8e; font-size:18px; letter-spacing:-0.3px;}
</style>
</head>
<body>
<div id="stage">
  <div id="screen">
    <div class="titlebar">
      <div class="logo-pill">RDA</div>
      <div>
        <div class="title-txt">Claude Code — 세션 리플레이</div>
        <div class="title-sub">프롬프트 한 줄로 작동하는 웹앱 만들기 (간소화 재현)</div>
      </div>
      <div class="rec"><span class="led"></span> REC · 화면 녹화용</div>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="chat">
      <div class="chat-scroll" id="scroll"></div>
      <div class="playov" id="playov" onclick="player.play()">
        <div class="pbtn">▶</div>
        <div class="ptext">재생</div>
        <div class="phint">눌러서 대화 재생 시작</div>
      </div>
    </div>
    <div class="footbar">
      <span class="step" id="stepTxt">단계 0 / 0</span>
      <span class="grow"></span>
      <button class="btn btn-d" onclick="player.prev()">◀ 이전</button>
      <button class="btn btn-s" id="playBtn" onclick="player.toggleAuto()">⏸ 자동재생</button>
      <button class="btn btn-d" onclick="player.next()">다음 ▶</button>
      <button class="btn btn-a" onclick="player.restart()">↻ 다시</button>
      <button class="btn btn-a" onclick="toggleFS()">전체화면</button>
    </div>
  </div>
</div>
<div class="hint">Space / → 다음 · ← 이전 · R 다시재생 · F 전체화면</div>

<script>
/* ===== 시나리오 (레포 실제 흔적 기반: PR #244→#245, CLAUDE.md) ===== */
var STEPS = [
  {role:'user', text:'현장 조사 양식을 매번 엑셀로 새로 만들어요. 이걸 웹앱으로 만들어줘. 우리 PC는 망분리라 설치 없이 <b>HTML 파일 더블클릭</b>만으로 열려야 해요.'},
  {role:'claude', text:'네. 프레임워크 없이 순수 HTML·CSS·JS로 만들고, 라이브러리는 파일 안에 인라인할게요.',
   cards:[
     {ic:'📄', cls:'', html:'<b>createphenotypingform.html</b> 생성 — 조사 양식 생성 · 라벨 인쇄 · DMRT 통계', tag:'+7,400줄'},
     {ic:'✅', cls:'ok', html:'더블클릭 → 브라우저에서 바로 실행. 서버·설치 불필요'}
   ]},
  {role:'user', text:'육종 시뮬레이터 통계 코드가 너무 복잡해. <b>부품(모듈)로 깔끔하게 쪼개줄래?</b>'},
  {role:'claude', text:'좋습니다. 계산 엔진을 역할별 모듈로 분리하겠습니다.',
   cards:[
     {ic:'📦', cls:'', html:'<b>bdss_core/</b> 모듈 9개로 분리 — BLUP · WAASB · MTSI · NSGA-II 최적화', tag:'#244 · +4,783줄'},
     {ic:'✅', cls:'ok', html:'구조는 깔끔. 모듈 import로 정상 동작'}
   ]},
  {role:'user', trouble:true, text:'어… 그 파일만 연구원한테 메일로 보냈더니 <b>안 열려요</b> 😟 우린 폴더가 아니라 파일 하나로 주고받아요.'},
  {role:'claude', text:'원인 파악했습니다 — 쪼갠 모듈이 같이 없으면 import가 깨집니다. <b>전부 한 파일로 다시 합치겠습니다.</b>',
   code:'<span class="c">// 분리한 모듈 + Python 통계 엔진을 HTML 한 장에 인라인</span>\n<span class="k">import</span> bdss_core   <span class="c">// ✗ 폴더 없으면 깨짐</span>\n   ↓\n&lt;<span class="k">script</span>&gt; <span class="c">/* BLUP·WAASB·NSGA-II 전부 내장 */</span> &lt;/<span class="k">script</span>&gt;  <span class="c">// ✓</span>',
   cards:[
     {ic:'📄', cls:'', html:'모든 모듈 + Python 엔진을 <b>HTML 한 장에 인라인</b> 통합', tag:'#245 · 46분 뒤'},
     {ic:'✅', cls:'ok', html:'이제 <b>HTML 1개만으로 작동</b> — 더블클릭 OK, 메일 첨부 1개'}
   ]},
  {role:'user', text:'완벽해. 앞으로 <b>항상 이렇게</b> 해줘. 매번 설명하기 번거로운데 기억해둘 방법 있어?'},
  {role:'claude', text:'규칙 파일 <b>CLAUDE.md</b>에 박제하겠습니다. 다음부터는 제가 알아서 같은 규칙으로 만듭니다.',
   cards:[
     {ic:'📌', cls:'rule', html:"CLAUDE.md ← <b>'단일 HTML · 외부 호출 0 · 디버깅 로그 필수 · IRGSP-1.0 기준'</b>"},
     {ic:'✅', cls:'ok', html:'이후 모든 작업에 자동 적용 — 사람은 규칙·검증, AI는 코드'}
   ]},
  {role:'end', big:'프롬프트 한 줄 → 작동하는 도구', sub:'설명이 아니라, 더블클릭되는 결과물로 증명한다'}
];

var WHO = {user:'연구사 (프롬프트)', claude:'Claude Code', end:''};
var AV  = {user:'🧑', claude:'🤖'};

/* ===== 플레이어 ===== */
var player = (function(){
  var scroll = document.getElementById('scroll');
  var bar = document.getElementById('bar');
  var stepTxt = document.getElementById('stepTxt');
  var playBtn = document.getElementById('playBtn');
  var i = 0;          // 완전히 렌더된 단계 수
  var busy = false;   // 단계 렌더 진행 중
  var auto = true;    // 자동 재생
  var skip = false;   // 현재 단계 빨리감기(타이핑 즉시 완료)
  var gen = 0;        // 전체 리셋 토큰

  // skip이 켜지면 즉시 깨어나는 sleep
  function sleep(ms){
    return new Promise(function(res){
      var start=Date.now();
      (function chk(){
        if(skip || Date.now()-start>=ms) return res();
        setTimeout(chk, 20);
      })();
    });
  }
  function autoscroll(){ var c=scroll.parentElement; c.scrollTop=c.scrollHeight; }

  function showOverlay(on){ var o=document.getElementById('playov'); if(o) o.style.display = on ? 'flex' : 'none'; }

  // 한 단계(메시지) 전체를 한 번에 렌더 — 타이핑 없음, 부드러운 페이드만
  function renderStep(idx){
    var s = STEPS[idx];
    if(s.role==='end'){
      var e=document.createElement('div'); e.className='msg'; e.style.alignSelf='center';
      e.innerHTML='<div class="endcard"><div class="big">'+s.big+'</div><div class="sub">'+s.sub+'</div></div>';
      scroll.appendChild(e); requestAnimationFrame(function(){ e.classList.add('show'); }); autoscroll(); return;
    }
    var html='<div class="av">'+AV[s.role]+'</div><div class="bubble'+(s.trouble?' trouble':'')+'">'
      +'<div class="who">'+WHO[s.role]+'</div><span class="body">'+s.text+'</span>';
    if(s.code){ html+='<div class="code">'+s.code+'</div>'; }
    if(s.cards){ s.cards.forEach(function(cd){
      html+='<div class="card '+(cd.cls||'')+'"><span class="ic">'+cd.ic+'</span><span>'+cd.html+'</span>'
        +(cd.tag?'<span class="tag">'+cd.tag+'</span>':'')+'</div>';
    }); }
    html+='</div>';
    var m=document.createElement('div'); m.className='msg '+s.role; m.innerHTML=html;
    scroll.appendChild(m);
    requestAnimationFrame(function(){ m.classList.add('show'); });
    autoscroll();
  }

  function updateMeta(){
    bar.style.width = (i/(STEPS.length))*100 + '%';
    stepTxt.textContent = '단계 '+Math.min(i,STEPS.length)+' / '+STEPS.length;
  }
  function setAutoUI(on){ playBtn.textContent = on ? '⏸ 일시정지' : '▶ 재생'; }

  // 다음 단계 1개 렌더 (동시 실행 방지)
  async function advance(){
    if(busy || i>=STEPS.length) return;
    busy=true; skip=false;
    var myGen=gen;
    renderStep(i);
    if(gen!==myGen){ busy=false; return; }   // 도중 리셋됨
    i++; updateMeta(); busy=false;
    if(i>=STEPS.length){ auto=false; setAutoUI(false); return; }
    if(auto){ await sleep(STEPS[i-1].trouble?1100:850); if(auto && gen===myGen) advance(); }
  }

  // 0..target-1 을 즉시 다시 그림
  function redrawTo(target){
    gen++; var myGen=gen;
    scroll.innerHTML=''; i=0; busy=false; auto=false; setAutoUI(false); updateMeta();
    for(var k=0;k<target;k++){ if(gen!==myGen) return; renderStep(k); i=k+1; updateMeta(); }
  }

  return {
    // 시작 시 자동재생하지 않고, 재생 오버레이만 표시 (사용자가 ▶ 눌러야 시작)
    start:function(){ updateMeta(); setAutoUI(false); showOverlay(true); },
    play:function(){ showOverlay(false); auto=true; setAutoUI(true); if(!busy) advance(); },
    // 수동 다음: 자동재생 중이면 대기시간만 건너뛰고, 아니면 다음 단계
    next:function(){ showOverlay(false); auto=false; setAutoUI(false); if(busy){ skip=true; } else { advance(); } },
    prev:function(){ showOverlay(false); redrawTo(Math.max(0, i-1)); },
    restart:function(){ gen++; scroll.innerHTML=''; i=0; busy=false; skip=false; auto=true; setAutoUI(true); showOverlay(false); updateMeta(); advance(); },
    toggleAuto:function(){ showOverlay(false); auto=!auto; setAutoUI(auto); if(auto && !busy) advance(); }
  };
})();

/* ===== scale-to-fit ===== */
function scaleScreen(){
  var s=Math.min(window.innerWidth/1280, window.innerHeight/720);
  document.getElementById('screen').style.transform='scale('+s+')';
}
window.addEventListener('resize', scaleScreen);
document.addEventListener('fullscreenchange', scaleScreen);

/* ===== 키보드 ===== */
window.addEventListener('keydown', function(e){
  if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); player.next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); player.prev(); }
  else if(e.key==='r'||e.key==='R'){ player.restart(); }
  else if(e.key==='f'||e.key==='F'){ toggleFS(); }
});
function toggleFS(){
  if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement); }
  else{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
}

scaleScreen();
player.start();
</script>
</body>
</html>
