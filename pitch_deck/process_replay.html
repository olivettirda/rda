<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세션 리플레이 — 프롬프트로 웹앱 만들기 (AI 아이디어톤)</title>
<!--
  단일 자기완결 HTML. 외부 호출 0건(시스템 폰트). 더블클릭으로 열림.
  Claude Code 세션을 간소화 재현한 "대화 리플레이" — 화면 녹화하면 그대로 영상.
  내용 근거: prompt_logic_3.md/4.md, PR #244·#245·#272, CLAUDE.md (레포 실제 흔적).
  자동 재생 / Space·→ 다음 / R 재시작 / F 전체화면.
-->
<style>
:root{
  --primary:#e60012; --signal:#f68d1f; --amber:#ecab37; --nav-gold:#e48600;
  --canvas:#7a8aba; --canvas-soft:#9fbee7; --lavender:#acace7; --periwinkle:#8ba1d4;
  --chrome-indigo:#3d4f97; --muted-indigo:#60619c; --platinum:#dedede; --surface:#ffffff;
  --carbon:#21242e; --hairline:#5a5f8c; --ink:#21242e; --ink-soft:#3d4f97; --on:#fff;
  --f-ui:Arial,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-disp:"Arial Black",Arial,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"Consolas","D2Coding",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/4px 4px,var(--carbon);
  font-family:var(--f-ui); color:var(--ink); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
#stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#screen{
  width:1280px; height:720px; transform-origin:center center;
  background:var(--canvas);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.30),inset 0 -5px 0 rgba(0,0,0,.22),
             0 0 0 2px var(--chrome-indigo),0 26px 70px rgba(0,0,0,.55);
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
  display:flex; flex-direction:column; overflow:hidden;
}
/* 타이틀 바 (carbon, 하프톤) */
.titlebar{
  height:56px; flex:0 0 56px;
  background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/4px 4px,var(--carbon);
  display:flex; align-items:center; gap:14px; padding:0 20px;
  border-bottom:2px solid var(--chrome-indigo);
}
.logo-pill{
  background:var(--surface); color:var(--primary); font-family:var(--f-disp); font-weight:900;
  font-size:18px; letter-spacing:.5px; border-radius:9999px; padding:5px 16px;
  border:2px solid var(--chrome-indigo);
}
.title-txt{color:var(--amber); font-weight:700; font-size:15px; letter-spacing:.5px; text-transform:uppercase;}
.title-sub{color:var(--canvas-soft); font-size:12px;}
.rec{ margin-left:auto; display:flex; align-items:center; gap:7px; color:#fff; font-size:12px; font-weight:700;}
.rec .led{width:11px;height:11px;border-radius:50%;background:var(--primary);box-shadow:0 0 9px var(--primary);animation:blink 1s steps(2,end) infinite;}
@keyframes blink{50%{opacity:.25;}}

/* 진행 바 */
.progress{height:5px;flex:0 0 5px;background:var(--muted-indigo);}
.progress > i{display:block;height:100%;width:0;background:var(--signal);transition:width .4s;}

/* 대화 영역 */
.chat{flex:1 1 auto; overflow:hidden; position:relative; padding:18px 26px;}
.chat-scroll{position:absolute; left:26px; right:26px; bottom:18px; display:flex; flex-direction:column; gap:14px;}
.msg{display:flex; gap:12px; max-width:88%; opacity:0; transform:translateY(10px); transition:.25s;}
.msg.show{opacity:1; transform:none;}
.msg .av{
  flex:0 0 40px; width:40px; height:40px; border-radius:9999px; display:flex; align-items:center;
  justify-content:center; font-size:20px; border:2px solid var(--chrome-indigo);
  box-shadow:0 2px 0 rgba(0,0,0,.3);
}
.msg.user{align-self:flex-end; flex-direction:row-reverse;}
.msg.user .av{background:var(--amber);}
.msg.claude .av{background:var(--surface);}
.bubble{
  background:var(--surface); border:1px solid var(--chrome-indigo); border-radius:10px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 2px 0 var(--chrome-indigo);
  padding:13px 16px; font-size:17px; line-height:1.5; color:var(--ink);
}
.msg.user .bubble{background:var(--lavender);}
.bubble .who{font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:5px;}
.msg.user .bubble .who{color:var(--chrome-indigo);}
.bubble.trouble{border-color:var(--primary); background:#fbe3e4;}
.cursor::after{content:"▋"; color:var(--signal); animation:blink .8s steps(2,end) infinite;}

/* Claude 액션 카드 */
.card{
  background:var(--platinum); border-left:5px solid var(--signal); border-radius:6px;
  padding:11px 14px; margin-top:9px; font-size:15px; color:var(--ink); display:flex; gap:10px; align-items:flex-start;
}
.card .ic{font-size:18px; line-height:1;}
.card .tag{
  margin-left:auto; flex:0 0 auto; background:var(--carbon); color:var(--amber); font-weight:700;
  font-size:12px; padding:3px 8px; border-radius:3px; white-space:nowrap;
}
.card.ok{border-left-color:#2e8b57; background:#e2efe8;}
.card.rule{border-left-color:var(--amber); background:#fbf3df;}
.code{
  background:#1b1e27; color:#cdd3e8; font-family:var(--f-mono); font-size:13.5px; line-height:1.55;
  border-radius:6px; padding:12px 14px; margin-top:9px; white-space:pre; overflow:hidden;
}
.code .c{color:#7f8aa8;} .code .k{color:#f68d1f;} .code .s{color:#9fd0a0;} .code .v{color:#ecab37;}

/* 엔드 카드 */
.endcard{
  align-self:center; text-align:center; background:var(--periwinkle);
  border:2px solid var(--chrome-indigo); border-radius:10px; padding:18px 28px; max-width:96%;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 var(--chrome-indigo);
}
.endcard .big{font-family:var(--f-disp); font-weight:900; font-size:34px; color:#fff;
  -webkit-text-stroke:1.5px var(--carbon); text-shadow:3px 3px 0 var(--chrome-indigo);}
.endcard .sub{font-size:16px; color:var(--carbon); font-weight:700; margin-top:8px;}

/* 푸터 컨트롤 */
.footbar{
  height:50px; flex:0 0 50px; background:var(--carbon);
  display:flex; align-items:center; gap:10px; padding:0 18px; border-top:2px solid var(--chrome-indigo);
}
.footbar .step{color:var(--canvas-soft); font-size:13px; font-weight:700;}
.footbar .grow{margin-left:auto;}
.btn{
  cursor:pointer; border:none; font-family:var(--f-ui); font-weight:700; font-size:12px;
  letter-spacing:.5px; text-transform:uppercase; padding:9px 14px; border-radius:3px;
  border-top:1px solid rgba(255,255,255,.4); border-bottom:2px solid rgba(0,0,0,.35);
}
.btn-s{background:var(--signal); color:#fff;} .btn-a{background:var(--amber); color:var(--carbon);}
.btn-d{background:var(--chrome-indigo); color:#fff;}
.hint{position:fixed; bottom:10px; left:50%; transform:translateX(-50%); color:#9fbee7; font-size:12px;}
</style>
</head>
<body>
<div id="stage">
  <div id="screen">
    <div class="titlebar">
      <div class="logo-pill">RDA</div>
      <div>
        <div class="title-txt">Claude Code — 세션 리플레이</div>
        <div class="title-sub">프롬프트 한 줄로 작동하는 웹앱 만들기 (간소화 재현)</div>
      </div>
      <div class="rec"><span class="led"></span> REC · 화면 녹화용</div>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="chat"><div class="chat-scroll" id="scroll"></div></div>
    <div class="footbar">
      <span class="step" id="stepTxt">단계 0 / 0</span>
      <span class="grow"></span>
      <button class="btn btn-d" onclick="player.prev()">◀ 이전</button>
      <button class="btn btn-s" id="playBtn" onclick="player.toggleAuto()">⏸ 자동재생</button>
      <button class="btn btn-d" onclick="player.next()">다음 ▶</button>
      <button class="btn btn-a" onclick="player.restart()">↻ 다시</button>
      <button class="btn btn-a" onclick="toggleFS()">전체화면</button>
    </div>
  </div>
</div>
<div class="hint">Space / → 다음 · ← 이전 · R 다시재생 · F 전체화면</div>

<script>
/* ===== 시나리오 (레포 실제 흔적 기반: PR #244→#245, CLAUDE.md) ===== */
var STEPS = [
  {role:'user', text:'현장 조사 양식을 매번 엑셀로 새로 만들어요. 이걸 웹앱으로 만들어줘. 우리 PC는 망분리라 설치 없이 <b>HTML 파일 더블클릭</b>만으로 열려야 해요.'},
  {role:'claude', text:'네. 프레임워크 없이 순수 HTML·CSS·JS로 만들고, 라이브러리는 파일 안에 인라인할게요.',
   cards:[
     {ic:'📄', cls:'', html:'<b>createphenotypingform.html</b> 생성 — 조사 양식 생성 · 라벨 인쇄 · DMRT 통계', tag:'+7,400줄'},
     {ic:'✅', cls:'ok', html:'더블클릭 → 브라우저에서 바로 실행. 서버·설치 불필요'}
   ]},
  {role:'user', text:'육종 시뮬레이터 통계 코드가 너무 복잡해. <b>부품(모듈)로 깔끔하게 쪼개줄래?</b>'},
  {role:'claude', text:'좋습니다. 계산 엔진을 역할별 모듈로 분리하겠습니다.',
   cards:[
     {ic:'📦', cls:'', html:'<b>bdss_core/</b> 모듈 9개로 분리 — BLUP · WAASB · MTSI · NSGA-II 최적화', tag:'#244 · +4,783줄'},
     {ic:'✅', cls:'ok', html:'구조는 깔끔. 모듈 import로 정상 동작'}
   ]},
  {role:'user', trouble:true, text:'어… 그 파일만 연구원한테 메일로 보냈더니 <b>안 열려요</b> 😟 우린 폴더가 아니라 파일 하나로 주고받아요.'},
  {role:'claude', text:'원인 파악했습니다 — 쪼갠 모듈이 같이 없으면 import가 깨집니다. <b>전부 한 파일로 다시 합치겠습니다.</b>',
   code:'<span class="c">// 분리한 모듈 + Python 통계 엔진을 HTML 한 장에 인라인</span>\n<span class="k">import</span> bdss_core   <span class="c">// ✗ 폴더 없으면 깨짐</span>\n   ↓\n&lt;<span class="k">script</span>&gt; <span class="c">/* BLUP·WAASB·NSGA-II 전부 내장 */</span> &lt;/<span class="k">script</span>&gt;  <span class="c">// ✓</span>',
   cards:[
     {ic:'📄', cls:'', html:'모든 모듈 + Python 엔진을 <b>HTML 한 장에 인라인</b> 통합', tag:'#245 · 46분 뒤'},
     {ic:'✅', cls:'ok', html:'이제 <b>HTML 1개만으로 작동</b> — 더블클릭 OK, 메일 첨부 1개'}
   ]},
  {role:'user', text:'완벽해. 앞으로 <b>항상 이렇게</b> 해줘. 매번 설명하기 번거로운데 기억해둘 방법 있어?'},
  {role:'claude', text:'규칙 파일 <b>CLAUDE.md</b>에 박제하겠습니다. 다음부터는 제가 알아서 같은 규칙으로 만듭니다.',
   cards:[
     {ic:'📌', cls:'rule', html:"CLAUDE.md ← <b>'단일 HTML · 외부 호출 0 · 디버깅 로그 필수 · IRGSP-1.0 기준'</b>"},
     {ic:'✅', cls:'ok', html:'이후 모든 작업에 자동 적용 — 사람은 규칙·검증, AI는 코드'}
   ]},
  {role:'end', big:'프롬프트 한 줄 → 작동하는 도구', sub:'설명이 아니라, 더블클릭되는 결과물로 증명한다'}
];

var WHO = {user:'연구사 (프롬프트)', claude:'Claude Code', end:''};
var AV  = {user:'🧑', claude:'🤖'};

/* ===== 플레이어 ===== */
var player = (function(){
  var scroll = document.getElementById('scroll');
  var bar = document.getElementById('bar');
  var stepTxt = document.getElementById('stepTxt');
  var playBtn = document.getElementById('playBtn');
  var i = 0;          // 완전히 렌더된 단계 수
  var busy = false;   // 단계 렌더 진행 중
  var auto = true;    // 자동 재생
  var skip = false;   // 현재 단계 빨리감기(타이핑 즉시 완료)
  var gen = 0;        // 전체 리셋 토큰

  // skip이 켜지면 즉시 깨어나는 sleep
  function sleep(ms){
    return new Promise(function(res){
      var start=Date.now();
      (function chk(){
        if(skip || Date.now()-start>=ms) return res();
        setTimeout(chk, 20);
      })();
    });
  }
  function autoscroll(){ var c=scroll.parentElement; c.scrollTop=c.scrollHeight; }

  // 타이핑 효과 (HTML 안전: 태그는 즉시, 텍스트만 한 글자씩). skip이면 즉시 완성.
  async function typeHTML(el, html, cancelled){
    el.classList.add('cursor');
    var n=0, out='', tag=false;
    for(var k=0;k<html.length;k++){
      if(cancelled()){ break; }
      if(skip){ break; }
      var ch=html[k];
      if(ch==='<') tag=true;
      out+=ch;
      if(ch==='>') tag=false;
      el.innerHTML=out;
      autoscroll();
      if(!tag){ n++; if(n%2===0) await sleep(11); }
    }
    el.innerHTML=html;            // 항상 완성본으로 마감
    el.classList.remove('cursor');
    autoscroll();
  }

  async function renderStep(idx, cancelled){
    var s = STEPS[idx];
    if(s.role==='end'){
      var e=document.createElement('div'); e.className='msg show'; e.style.alignSelf='center';
      e.innerHTML='<div class="endcard"><div class="big"></div><div class="sub"></div></div>';
      scroll.appendChild(e); autoscroll();
      await typeHTML(e.querySelector('.big'), s.big, cancelled);
      e.querySelector('.sub').textContent = s.sub;
      autoscroll(); return;
    }
    var m=document.createElement('div'); m.className='msg '+s.role;
    m.innerHTML='<div class="av">'+AV[s.role]+'</div><div class="bubble'+(s.trouble?' trouble':'')+'">'
      +'<div class="who">'+WHO[s.role]+'</div><span class="body"></span></div>';
    scroll.appendChild(m);
    requestAnimationFrame(function(){ m.classList.add('show'); });
    autoscroll();
    await typeHTML(m.querySelector('.body'), s.text, cancelled);

    if(s.code){
      var pre=document.createElement('div'); pre.className='code'; pre.innerHTML=s.code;
      m.querySelector('.bubble').appendChild(pre); autoscroll();
      if(!cancelled()) await sleep(450);
    }
    if(s.cards){
      for(var c=0;c<s.cards.length;c++){
        if(cancelled()) break;
        var cd=s.cards[c];
        var div=document.createElement('div'); div.className='card '+(cd.cls||'');
        div.innerHTML='<span class="ic">'+cd.ic+'</span><span>'+cd.html+'</span>'+(cd.tag?'<span class="tag">'+cd.tag+'</span>':'');
        m.querySelector('.bubble').appendChild(div); autoscroll();
        await sleep(380);
      }
    }
  }

  function updateMeta(){
    bar.style.width = (i/(STEPS.length))*100 + '%';
    stepTxt.textContent = '단계 '+Math.min(i,STEPS.length)+' / '+STEPS.length;
  }
  function setAutoUI(on){ playBtn.textContent = on?'⏸ 자동재생':'▶ 자동재생'; }

  // 다음 단계 1개를 끝까지 렌더 (동시 실행 방지)
  async function advance(){
    if(busy || i>=STEPS.length) return;
    busy=true; skip=false;
    var myGen=gen;
    await renderStep(i, function(){ return gen!==myGen; });
    if(gen!==myGen){ busy=false; return; }   // 도중 리셋됨
    i++; updateMeta(); busy=false;
    if(i>=STEPS.length){ auto=false; setAutoUI(false); return; }
    if(auto){ await sleep(STEPS[i-1].trouble?1100:850); if(auto && gen===myGen) advance(); }
  }

  // 0..target-1 을 즉시(스킵) 다시 그림
  async function redrawTo(target){
    gen++; var myGen=gen;
    scroll.innerHTML=''; i=0; busy=true; auto=false; setAutoUI(false);
    skip=true; updateMeta();
    for(var k=0;k<target;k++){
      if(gen!==myGen){ busy=false; return; }
      await renderStep(k, function(){ return gen!==myGen; });
      i=k+1; updateMeta();
    }
    skip=false; busy=false;
  }

  return {
    start:function(){ updateMeta(); advance(); },
    // 수동 다음: 진행 중이면 현재 단계 빨리감기, 아니면 다음 단계
    next:function(){ auto=false; setAutoUI(false); if(busy){ skip=true; } else { advance(); } },
    prev:function(){ var target=Math.max(0, i-1); redrawTo(target); },
    restart:function(){ gen++; scroll.innerHTML=''; i=0; busy=false; skip=false; auto=true; setAutoUI(true); updateMeta(); advance(); },
    toggleAuto:function(){ auto=!auto; setAutoUI(auto); if(auto && !busy) advance(); }
  };
})();

/* ===== scale-to-fit ===== */
function scaleScreen(){
  var s=Math.min(window.innerWidth/1280, window.innerHeight/720);
  document.getElementById('screen').style.transform='scale('+s+')';
}
window.addEventListener('resize', scaleScreen);
document.addEventListener('fullscreenchange', scaleScreen);

/* ===== 키보드 ===== */
window.addEventListener('keydown', function(e){
  if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); player.next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); player.prev(); }
  else if(e.key==='r'||e.key==='R'){ player.restart(); }
  else if(e.key==='f'||e.key==='F'){ toggleFS(); }
});
function toggleFS(){
  if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement); }
  else{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
}

scaleScreen();
player.start();
</script>
</body>
</html>
