<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앱 제목 - 육종 도구 모음</title>
    <link rel="icon" type="image/png" href="ssallogo.png">
    <link rel="apple-touch-icon" href="ssallogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========================================
           CSS 변수 정의 (DESIGN_SYSTEM.md 기반)
           ======================================== */
        :root {
            /* 주요 색상 */
            --primary-dark: #0c3026;
            --primary-main: #017f97;
            --primary-light: #e8f4f8;

            /* 배경 색상 */
            --bg-page: #ffffff;
            --bg-card: #f8f9fa;
            --bg-input: #ffffff;

            /* 텍스트 색상 */
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --text-placeholder: #adb5bd;
            --text-disabled: #ced4da;

            /* 상태 색상 */
            --success: #28a745;
            --warning: #ffc107;
            --error: #dc3545;
            --info: #17a2b8;

            /* 테두리 */
            --border-default: #dee2e6;
            --border-focus: #017f97;
            --border-error: #dc3545;

            /* 간격 시스템 (8px 기반) */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
            --space-16: 4rem;

            /* 타이포그래피 */
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 1.875rem;

            --font-light: 300;
            --font-regular: 400;
            --font-medium: 500;
            --font-bold: 700;

            /* 그림자 */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);

            /* 전환 효과 */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.2s ease;
            --transition-slow: 0.3s ease;

            /* 레이아웃 */
            --header-height: 64px;
            --border-radius-sm: 4px;
            --border-radius-md: 6px;
            --border-radius-lg: 8px;
        }

        /* ========================================
           기본 스타일
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ========================================
           헤더
           ======================================== */
        .header {
            position: sticky;
            top: 0;
            height: var(--header-height);
            background: var(--primary-dark);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 var(--space-6);
            z-index: 1000;
            box-shadow: var(--shadow-md);
        }

        .header-title {
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
        }

        .header-subtitle {
            font-size: var(--text-sm);
            opacity: 0.8;
            margin-left: var(--space-4);
        }

        /* ========================================
           컨테이너
           ======================================== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-6);
        }

        /* ========================================
           카드
           ======================================== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--border-radius-lg);
            padding: var(--space-6);
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition-normal);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-title {
            font-size: var(--text-lg);
            font-weight: var(--font-medium);
            color: var(--primary-dark);
            margin-bottom: var(--space-4);
            padding-bottom: var(--space-3);
            border-bottom: 2px solid var(--primary-main);
        }

        /* ========================================
           폼 요소
           ======================================== */
        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-label {
            display: block;
            margin-bottom: var(--space-2);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--text-primary);
        }

        .form-label .required {
            color: var(--error);
            margin-left: 2px;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: var(--space-3) var(--space-4);
            font-size: var(--text-base);
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-input);
            border: 1px solid var(--border-default);
            border-radius: var(--border-radius-md);
            transition: all var(--transition-normal);
        }

        .form-input::placeholder {
            color: var(--text-placeholder);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(1, 127, 151, 0.15);
        }

        .form-input.is-invalid {
            border-color: var(--error);
            background: #fff5f5;
        }

        .form-input:disabled {
            background: #f1f3f4;
            color: var(--text-disabled);
            cursor: not-allowed;
        }

        textarea.form-input {
            height: auto;
            min-height: 100px;
            resize: vertical;
        }

        .form-hint {
            margin-top: var(--space-1);
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }

        .form-error {
            margin-top: var(--space-1);
            font-size: var(--text-xs);
            color: var(--error);
            display: none;
        }

        .form-input.is-invalid ~ .form-error {
            display: block;
        }

        /* ========================================
           버튼
           ======================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            min-height: 44px;
            padding: var(--space-3) var(--space-6);
            font-size: var(--text-base);
            font-weight: var(--font-medium);
            font-family: inherit;
            border-radius: var(--border-radius-md);
            border: none;
            cursor: pointer;
            transition: all var(--transition-normal);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-dark);
            color: white;
        }

        .btn-primary:hover {
            background: #0a2820;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(12, 48, 38, 0.3);
        }

        .btn-secondary {
            background: var(--primary-main);
            color: white;
        }

        .btn-secondary:hover {
            background: #016a7e;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary-main);
            color: var(--primary-main);
        }

        .btn-outline:hover {
            background: var(--primary-light);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-group {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        /* ========================================
           탭 네비게이션
           ======================================== */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-default);
            gap: var(--space-1);
            margin-bottom: var(--space-6);
        }

        .tab {
            padding: var(--space-3) var(--space-5);
            color: var(--text-secondary);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all var(--transition-normal);
            font-size: var(--text-base);
            font-family: inherit;
        }

        .tab:hover {
            color: var(--primary-main);
        }

        .tab.active {
            color: var(--primary-main);
            border-bottom-color: var(--primary-main);
            font-weight: var(--font-medium);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ========================================
           테이블
           ======================================== */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border-default);
            border-radius: var(--border-radius-lg);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--text-sm);
        }

        .table th,
        .table td {
            padding: var(--space-3) var(--space-4);
            text-align: left;
            border-bottom: 1px solid var(--border-default);
        }

        .table th {
            background: var(--bg-card);
            font-weight: var(--font-medium);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .table tbody tr:hover {
            background: var(--bg-card);
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        /* ========================================
           알림 (Alert)
           ======================================== */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: var(--space-3);
            padding: var(--space-4);
            border-radius: var(--border-radius-md);
            margin-bottom: var(--space-4);
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* ========================================
           토스트 알림
           ======================================== */
        .toast-container {
            position: fixed;
            top: var(--space-4);
            right: var(--space-4);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: var(--space-3);
            min-width: 300px;
            max-width: 450px;
            padding: var(--space-4);
            background: white;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast-success { border-left: 4px solid var(--success); }
        .toast-error { border-left: 4px solid var(--error); }
        .toast-warning { border-left: 4px solid var(--warning); }
        .toast-info { border-left: 4px solid var(--info); }

        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.5;
            font-size: var(--text-lg);
        }

        .toast-close:hover {
            opacity: 1;
        }

        /* ========================================
           모달
           ======================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-slow);
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: var(--border-radius-xl);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform var(--transition-slow);
        }

        .modal-overlay.open .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-4) var(--space-6);
            border-bottom: 1px solid var(--border-default);
        }

        .modal-title {
            font-size: var(--text-xl);
            font-weight: var(--font-medium);
            margin: 0;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            font-size: var(--text-xl);
            transition: background var(--transition-normal);
        }

        .modal-close:hover {
            background: var(--bg-card);
        }

        .modal-body {
            padding: var(--space-6);
            overflow-y: auto;
            max-height: 60vh;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-6);
            border-top: 1px solid var(--border-default);
            background: var(--bg-card);
        }

        /* ========================================
           뱃지
           ======================================== */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: var(--space-1) var(--space-2);
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            border-radius: var(--border-radius-sm);
        }

        .badge-primary { background: var(--primary-light); color: var(--primary-main); }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #f8d7da; color: #721c24; }

        /* ========================================
           로딩 스피너
           ======================================== */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-default);
            border-top-color: var(--primary-main);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-4);
            z-index: 9999;
        }

        /* ========================================
           스켈레톤 로딩
           ======================================== */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--border-radius-sm);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ========================================
           Empty State
           ======================================== */
        .empty-state {
            text-align: center;
            padding: var(--space-16) var(--space-6);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: var(--space-6);
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: var(--text-xl);
            font-weight: var(--font-medium);
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .empty-state-description {
            font-size: var(--text-base);
            color: var(--text-secondary);
            margin-bottom: var(--space-6);
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ========================================
           유틸리티 클래스
           ======================================== */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-error { color: var(--error); }
        .text-muted { color: var(--text-secondary); }

        .mt-2 { margin-top: var(--space-2); }
        .mt-4 { margin-top: var(--space-4); }
        .mt-6 { margin-top: var(--space-6); }
        .mb-2 { margin-bottom: var(--space-2); }
        .mb-4 { margin-bottom: var(--space-4); }
        .mb-6 { margin-bottom: var(--space-6); }

        .gap-2 { gap: var(--space-2); }
        .gap-4 { gap: var(--space-4); }

        .flex { display: flex; }
        .flex-wrap { flex-wrap: wrap; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-end { justify-content: flex-end; }

        .grid { display: grid; gap: var(--space-4); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }

        .hidden { display: none !important; }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ========================================
           접근성
           ======================================== */
        :focus-visible {
            outline: 2px solid var(--primary-main);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ========================================
           반응형
           ======================================== */
        @media (max-width: 768px) {
            .container {
                padding: var(--space-4);
            }

            .header {
                padding: 0 var(--space-4);
            }

            .header-title {
                font-size: var(--text-lg);
            }

            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .tab {
                white-space: nowrap;
                padding: var(--space-3) var(--space-4);
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-group .btn {
                width: 100%;
            }
        }

        /* ========================================
           인쇄
           ======================================== */
        @media print {
            .no-print,
            .header,
            .btn,
            .modal-overlay,
            .toast-container {
                display: none !important;
            }

            body {
                background: white;
                color: black;
            }

            .card {
                box-shadow: none;
                border: 1px solid #ccc;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <h1 class="header-title">앱 제목</h1>
        <span class="header-subtitle">설명 텍스트</span>
    </header>

    <!-- 메인 컨테이너 -->
    <div class="container">
        <!-- 탭 네비게이션 예시 -->
        <div class="tabs" role="tablist">
            <button class="tab active" role="tab" aria-selected="true" data-tab="tab1">탭 1</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="tab2">탭 2</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="tab3">탭 3</button>
        </div>

        <!-- 탭 콘텐츠 -->
        <div id="tab1" class="tab-content active" role="tabpanel">
            <div class="card">
                <h2 class="card-title">카드 제목</h2>

                <!-- 폼 예시 -->
                <div class="form-group">
                    <label for="input1" class="form-label">
                        입력 필드 <span class="required">*</span>
                    </label>
                    <input type="text" id="input1" class="form-input" placeholder="예: 값을 입력하세요">
                    <p class="form-hint">입력에 대한 도움말</p>
                </div>

                <div class="form-group">
                    <label for="select1" class="form-label">선택</label>
                    <select id="select1" class="form-input">
                        <option value="">선택하세요</option>
                        <option value="1">옵션 1</option>
                        <option value="2">옵션 2</option>
                    </select>
                </div>

                <div class="btn-group mt-4">
                    <button class="btn btn-primary">저장</button>
                    <button class="btn btn-outline">취소</button>
                </div>
            </div>
        </div>

        <div id="tab2" class="tab-content" role="tabpanel">
            <!-- 테이블 예시 -->
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>컬럼 1</th>
                            <th>컬럼 2</th>
                            <th>컬럼 3</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>데이터 1</td>
                            <td>데이터 2</td>
                            <td>데이터 3</td>
                            <td><span class="badge badge-success">완료</span></td>
                        </tr>
                        <tr>
                            <td>데이터 4</td>
                            <td>데이터 5</td>
                            <td>데이터 6</td>
                            <td><span class="badge badge-warning">진행중</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tab3" class="tab-content" role="tabpanel">
            <!-- Empty State 예시 -->
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <h3 class="empty-state-title">데이터가 없습니다</h3>
                <p class="empty-state-description">
                    아직 등록된 데이터가 없습니다. 새 데이터를 추가해보세요.
                </p>
                <button class="btn btn-primary">데이터 추가</button>
            </div>
        </div>
    </div>

    <!-- 토스트 컨테이너 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 모달 예시 -->
    <div class="modal-overlay" id="exampleModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">모달 제목</h3>
                <button class="modal-close" aria-label="닫기" onclick="closeModal('exampleModal')">&times;</button>
            </div>
            <div class="modal-body">
                <p>모달 내용이 여기에 표시됩니다.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('exampleModal')">취소</button>
                <button class="btn btn-primary">확인</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // 탭 네비게이션
        // ========================================
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const tabId = this.dataset.tab;

                // 모든 탭 비활성화
                document.querySelectorAll('.tab').forEach(t => {
                    t.classList.remove('active');
                    t.setAttribute('aria-selected', 'false');
                });
                document.querySelectorAll('.tab-content').forEach(c => {
                    c.classList.remove('active');
                });

                // 선택된 탭 활성화
                this.classList.add('active');
                this.setAttribute('aria-selected', 'true');
                document.getElementById(tabId).classList.add('active');
            });
        });

        // ========================================
        // 토스트 알림
        // ========================================
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ========================================
        // 모달
        // ========================================
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('open');
            document.body.style.overflow = '';
        }

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.open').forEach(modal => {
                    modal.classList.remove('open');
                });
                document.body.style.overflow = '';
            }
        });

        // 모달 오버레이 클릭으로 닫기
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('open');
                    document.body.style.overflow = '';
                }
            });
        });

        // ========================================
        // 폼 유효성 검사
        // ========================================
        function validateInput(input) {
            if (input.required && !input.value.trim()) {
                input.classList.add('is-invalid');
                return false;
            }
            input.classList.remove('is-invalid');
            return true;
        }

        // ========================================
        // 초기화
        // ========================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('앱이 초기화되었습니다.');
            // showToast('환영합니다!', 'success');
        });
    </script>
</body>
</html>
