<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMRT 분석기 v3 | 다중 형질 분석</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f7f6;
            --bg-card: #ffffff;
            --accent-1: #cce3dd;
            --accent-2: #b2d9d8;
            --accent-3: #8dccd3;
            --accent-4: #54b7c6;
            --accent-5: #00a1b8;
            --accent-6: #017f97;
            --accent-7: #0c3026;
            --text-primary: #1a1a1a;
            --text-secondary: #5a6a62;
            --border-color: #d0d8d4;
            --error: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 1.5rem; }
        header { text-align: center; margin-bottom: 2rem; padding: 1.5rem 0; }
        h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-5), var(--accent-7)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { color: var(--text-secondary); font-size: 1rem; margin-top: 0.25rem; }
        .main-grid { display: grid; grid-template-columns: 420px 1fr; gap: 1.5rem; }
        @media (max-width: 1200px) { .main-grid { grid-template-columns: 1fr; } }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: var(--accent-6); display: flex; align-items: center; gap: 0.5rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tab-btn { flex: 1; padding: 0.6rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-secondary); font-family: inherit; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { border-color: var(--accent-5); }
        .tab-btn.active { background: var(--accent-5); border-color: var(--accent-5); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .table-wrapper { max-height: 350px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th { background: var(--bg-secondary); padding: 0.6rem 0.5rem; text-align: left; font-weight: 500; color: var(--accent-6); position: sticky; top: 0; }
        .data-table td { padding: 0.35rem; border-top: 1px solid var(--border-color); }
        .data-table input { width: 100%; padding: 0.4rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); font-family: inherit; font-size: 0.85rem; }
        .data-table input:focus { outline: none; border-color: var(--accent-5); }
        .data-table input[type="number"] { font-family: 'JetBrains Mono', monospace; }
        .row-num { width: 30px; text-align: center; color: var(--text-secondary); font-size: 0.75rem; }
        .del-btn { background: none; border: none; color: var(--error); cursor: pointer; opacity: 0.5; font-size: 1rem; }
        .del-btn:hover { opacity: 1; }
        .btn { padding: 0.6rem 1rem; border: none; border-radius: 6px; font-family: inherit; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-5), var(--accent-6)); color: #fff; font-weight: 600; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0, 161, 184, 0.3); }
        .btn-secondary { background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); }
        .btn-secondary:hover { border-color: var(--accent-5); }
        .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
        .upload-zone { border: 2px dashed var(--border-color); border-radius: 8px; padding: 2rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; background: var(--bg-secondary); }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent-5); background: rgba(0, 161, 184, 0.05); }
        .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .upload-text { color: var(--text-secondary); font-size: 0.9rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.3rem; }
        .form-control { width: 100%; padding: 0.5rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: inherit; font-size: 0.9rem; }
        .form-control:focus { outline: none; border-color: var(--accent-5); }
        .result-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .result-table th, .result-table td { padding: 0.6rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        .result-table th { background: var(--bg-secondary); color: var(--accent-6); font-weight: 500; }
        .result-table td { font-family: 'JetBrains Mono', monospace; }
        .group-letter { font-weight: 700; color: var(--accent-6); }
        .chart-section { display: grid; grid-template-columns: 1fr 320px; gap: 1rem; }
        @media (max-width: 900px) { .chart-section { grid-template-columns: 1fr; } }
        .chart-container { background: #fff; border-radius: 8px; padding: 1rem; min-height: 400px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
        .options-panel { background: var(--bg-secondary); border-radius: 8px; padding: 1rem; max-height: 800px; overflow-y: auto; }
        .options-section { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
        .options-section:last-child { border-bottom: none; margin-bottom: 0; }
        .options-title { font-size: 0.9rem; font-weight: 600; color: var(--accent-6); margin-bottom: 0.75rem; }
        .option-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .option-row label { flex: 1; font-size: 0.8rem; color: var(--text-secondary); }
        .option-row input[type="number"], .option-row input[type="text"], .option-row select { width: 100px; padding: 0.35rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); font-size: 0.8rem; }
        .option-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent-5); }
        .anova-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 1rem; }
        .anova-table th, .anova-table td { padding: 0.5rem; text-align: right; border: 1px solid var(--border-color); }
        .anova-table th { background: var(--bg-secondary); color: var(--accent-6); text-align: center; }
        .anova-table td:first-child { text-align: left; font-weight: 500; }
        .significance { color: var(--error); font-weight: 700; }
        .status { padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; }
        .status.error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); }
        .status.success { background: rgba(0, 161, 184, 0.1); border: 1px solid var(--accent-5); color: var(--accent-6); }
        .status.info { background: rgba(84, 183, 198, 0.1); border: 1px solid var(--accent-4); color: var(--accent-6); }
        .hidden { display: none !important; }
        .trait-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .trait-tab { padding: 0.5rem 1rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 20px; font-size: 0.8rem; cursor: pointer; color: var(--text-secondary); }
        .trait-tab.active { background: var(--accent-5); border-color: var(--accent-5); color: #fff; }
        .trait-tab:hover:not(.active) { border-color: var(--accent-5); }
        .multi-sheet-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; margin-top: 0.5rem; background: var(--bg-primary); }
        .sheet-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-bottom: 1px solid var(--border-color); }
        .sheet-item:last-child { border-bottom: none; }
        .sheet-item input[type="checkbox"] { accent-color: var(--accent-5); }
        .sheet-item label { flex: 1; font-size: 0.85rem; cursor: pointer; }
        .color-legend { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .legend-item { display: flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; }
        .legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #999; }
        .pattern-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; font-size: 0.75rem; }
        .pattern-row span { width: 50px; color: var(--text-secondary); }
        .pattern-row select { flex: 1; padding: 0.25rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.75rem; }
        .sub-option { margin-left: 1.5rem; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌾 DMRT 분석기 v3</h1>
            <p class="subtitle">다중 형질 동시 분석 | Duncan's Multiple Range Test</p>
        </header>

        <div class="main-grid">
            <div class="left-panel">
                <div class="card">
                    <div class="card-title">📊 데이터 입력</div>
                    
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="manual">직접 입력</button>
                        <button class="tab-btn" data-tab="excel">엑셀 업로드</button>
                    </div>

                    <div id="tab-manual" class="tab-content active">
                        <div class="form-group">
                            <label>형질명</label>
                            <input type="text" id="traitName" class="form-control" value="현미천립중">
                        </div>
                        <div class="form-group">
                            <label>단위</label>
                            <input type="text" id="traitUnit" class="form-control" value="g">
                        </div>
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead><tr><th class="row-num">#</th><th>품종명</th><th>측정값</th><th></th></tr></thead>
                                <tbody id="dataBody"></tbody>
                            </table>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-secondary" onclick="addRow()">+ 행</button>
                            <button class="btn btn-secondary" onclick="addRows(5)">+5행</button>
                            <button class="btn btn-secondary" onclick="clearData()">초기화</button>
                        </div>
                    </div>

                    <div id="tab-excel" class="tab-content">
                        <div class="upload-zone" id="uploadZone">
                            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
                            <div class="upload-icon">📁</div>
                            <div class="upload-text">클릭하거나 파일을 드래그하세요</div>
                            <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:0.5rem;">xlsx, xls, csv 지원 | 다중 시트 일괄 분석</div>
                        </div>

                        <div id="sheetSelector" class="hidden">
                            <label style="color:var(--text-secondary);font-size:0.85rem;margin-top:1rem;display:block;">분석할 시트 선택</label>
                            <div class="multi-sheet-list" id="sheetList"></div>
                        </div>

                        <div class="btn-group" style="justify-content: center;">
                            <button class="btn btn-secondary" onclick="downloadTemplate()">📥 양식 다운로드</button>
                        </div>
                    </div>

                    <div class="btn-group" style="margin-top: 1.5rem;">
                        <button class="btn btn-primary" onclick="runAnalysis()" style="flex: 1;">▶ DMRT 분석 실행</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">⚙️ 분석 설정</div>
                    <div class="form-group">
                        <label>유의수준 (α)</label>
                        <select id="alphaLevel" class="form-control">
                            <option value="0.05" selected>0.05 (5%)</option>
                            <option value="0.01">0.01 (1%)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>소수점 자릿수</label>
                        <select id="decimalPlaces" class="form-control">
                            <option value="1">1자리</option>
                            <option value="2" selected>2자리</option>
                            <option value="3">3자리</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div id="statusMessage" class="status hidden"></div>

                <div id="traitTabsContainer" class="hidden">
                    <div class="trait-tabs" id="traitTabs"></div>
                </div>

                <div class="card" id="resultsCard" style="display: none;">
                    <div class="card-title">📋 분석 결과 - <span id="currentTraitName"></span></div>
                    <div style="overflow-x: auto;">
                        <table class="result-table">
                            <thead><tr><th>품종명</th><th>N</th><th>평균</th><th>표준편차</th><th>그룹</th></tr></thead>
                            <tbody id="resultBody"></tbody>
                        </table>
                    </div>
                    <table class="anova-table">
                        <thead><tr><th>변동요인</th><th>SS</th><th>df</th><th>MS</th><th>F</th><th>p</th></tr></thead>
                        <tbody id="anovaBody"></tbody>
                    </table>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="downloadAllReports()">📥 전체 엑셀 리포트</button>
                    </div>
                </div>

                <div class="card" id="chartCard" style="display: none;">
                    <div class="card-title">📈 시각화</div>
                    <div class="chart-section">
                        <div class="chart-container">
                            <canvas id="mainChart"></canvas>
                        </div>
                        <div class="options-panel">
                            <div class="options-section">
                                <div class="options-title">📐 이미지 크기</div>
                                <div class="option-row"><label>너비 (mm)</label><input type="number" id="chartWidth" value="170" min="50" max="400"></div>
                                <div class="option-row"><label>높이 (mm)</label><input type="number" id="chartHeight" value="120" min="50" max="400"></div>
                                <div class="option-row"><label>DPI</label>
                                    <select id="chartDPI"><option value="150">150</option><option value="200" selected>200</option><option value="300">300</option></select>
                                </div>
                            </div>
                            <div class="options-section">
                                <div class="options-title">📊 오차 표시</div>
                                <div class="option-row"><label>유형</label>
                                    <select id="errorType" onchange="updateChart()"><option value="sd">SD</option><option value="se">SE</option><option value="none">없음</option></select>
                                </div>
                            </div>
                            <div class="options-section">
                                <div class="options-title">🔤 폰트</div>
                                <div class="option-row"><label>영문/숫자</label>
                                    <select id="engFont" onchange="updateChart()">
                                        <option value="Arial" selected>Arial</option>
                                        <option value="Helvetica">Helvetica</option>
                                        <option value="Times New Roman">Times New Roman</option>
                                        <option value="Perpetua">Perpetua</option>
                                    </select>
                                </div>
                                <div class="option-row"><label>제목 (pt)</label><input type="number" id="titleSize" value="14" onchange="updateChart()"></div>
                                <div class="option-row"><label>축 레이블</label><input type="number" id="axisLabelSize" value="12" onchange="updateChart()"></div>
                                <div class="option-row"><label>눈금</label><input type="number" id="tickLabelSize" value="10" onchange="updateChart()"></div>
                                <div class="option-row"><label>그룹문자</label><input type="number" id="groupLabelSize" value="11" onchange="updateChart()"></div>
                            </div>
                            <div class="options-section">
                                <div class="options-title">📏 축 설정</div>
                                <div class="option-row"><label>X축</label><input type="text" id="xAxisLabel" value="품종" onchange="updateChart()"></div>
                                <div class="option-row"><label>Y축</label><input type="text" id="yAxisLabel" value="" onchange="updateChart()"></div>
                                <div class="option-row"><label>Y 최소</label><input type="number" id="yMin" placeholder="자동" step="any" onchange="updateChart()"></div>
                                <div class="option-row"><label>Y 최대</label><input type="number" id="yMax" placeholder="자동" step="any" onchange="updateChart()"></div>
                                <div class="option-row"><label>Y 간격</label><input type="number" id="yInterval" placeholder="자동" step="any" onchange="updateChart()"></div>
                            </div>
                            <div class="options-section">
                                <div class="options-title">✏️ 선 설정</div>
                                <div class="option-row"><label>막대테두리</label><input type="number" id="barBorderWidth" value="1" step="0.5" onchange="updateChart()"></div>
                                <div class="option-row"><label>오차막대</label><input type="number" id="errorBarWidth" value="1.5" step="0.5" onchange="updateChart()"></div>
                                <div class="option-row"><label>막대너비</label><input type="number" id="barSpacing" value="0.7" step="0.05" min="0.3" max="1" onchange="updateChart()"></div>
                            </div>
                            <div class="options-section">
                                <div class="options-title">🎨 색상 모드</div>
                                <div class="option-row"><label>그룹별 색상</label><input type="checkbox" id="groupColorMode" checked onchange="updateChart()"></div>
                                <div class="option-row"><label>흑백 모드</label><input type="checkbox" id="grayscaleMode" onchange="toggleGrayscale()"></div>
                                
                                <!-- 흑백 모드 옵션 -->
                                <div id="grayscaleOptions" class="hidden" style="margin-top:0.5rem; margin-left:1.5rem;">
                                    <div class="option-row"><label>흰색 배경만</label><input type="checkbox" id="whiteBackgroundOnly" onchange="updateChart()"></div>
                                </div>
                                
                                <!-- 컬러 패턴 사용 옵션 -->
                                <div id="colorPatternOption" style="margin-top:0.5rem;">
                                    <div class="option-row"><label>패턴 사용</label><input type="checkbox" id="useColorPattern" onchange="toggleColorPattern()"></div>
                                </div>
                                
                                <!-- 패턴 설정 (흑백/컬러 공용) -->
                                <div id="patternSettings" class="hidden" style="margin-top:0.75rem;">
                                    <div style="font-size:0.8rem;color:var(--accent-6);margin-bottom:0.5rem;font-weight:500;">그룹별 패턴</div>
                                    <div id="patternList"></div>
                                </div>
                                
                                <div class="color-legend" id="colorLegend"></div>
                            </div>
                            <div class="options-section">
                                <div class="options-title">👁️ 표시</div>
                                <div class="option-row"><label>제목</label><input type="checkbox" id="showTitle" checked onchange="updateChart()"></div>
                                <div class="option-row"><label>그룹문자</label><input type="checkbox" id="showGroupLetters" checked onchange="updateChart()"></div>
                                <div class="option-row"><label>평균값</label><input type="checkbox" id="showMeanValues" onchange="updateChart()"></div>
                                <div class="option-row"><label>그리드</label><input type="checkbox" id="showGrid" checked onchange="updateChart()"></div>
                            </div>
                            <button class="btn btn-primary" style="width:100%;" onclick="downloadChart()">📥 PNG 다운로드</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
// ===== 전역 변수 =====
let allResults = {};
let currentTrait = null;
let currentWorkbook = null;
let rawDataByTrait = {};
let groupPatterns = {};

// 컬러 팔레트 (연한색 → 진한색)
const COLOR_PALETTE = ['#cce3dd', '#b2d9d8', '#8dccd3', '#54b7c6', '#00a1b8', '#017f97', '#0c3026'];

// 흑백 채우기 (연한색 → 진한색)
const GRAYSCALE_FILLS = ['#ffffff', '#e0e0e0', '#c0c0c0', '#a0a0a0', '#707070', '#404040', '#000000'];

// 패턴 옵션
const PATTERN_OPTIONS = [
    { value: 'solid', label: '단색' },
    { value: 'stripe', label: '사선 /' },
    { value: 'stripe2', label: '사선 \\' },
    { value: 'hline', label: '가로선' },
    { value: 'vline', label: '세로선' },
    { value: 'grid', label: '격자' },
    { value: 'dot', label: '점' },
    { value: 'cross', label: '십자' }
];

// q값 테이블
const qTable = {
    0.05: {
        1:[0,17.97],2:[0,6.085],3:[0,4.501,4.516],4:[0,3.927,4.013,4.033],5:[0,3.635,3.749,3.797,3.814],
        6:[0,3.461,3.587,3.649,3.680,3.694],7:[0,3.344,3.477,3.548,3.588,3.611,3.622],

    const sheet = currentWorkbook.Sheets[sheetName];

    let startIdx = 0;
    if(json.length > 0 && json[0].length >= 2) {
        const h = String(json[0][0]).toLowerCase();
        if(h.includes('품종') || h.includes('variety') || h.includes('name') || isNaN(parseFloat(json[0][1]))) startIdx = 1;
    }
    for(let i = startIdx; i < json.length; i++) {
        const row = json[i];
        if(row && row.length >= 2) {
            const variety = String(row[0]).trim();
            const value = parseFloat(row[1]);
            if(variety && !isNaN(value)) data.push({ variety, value });
        }
    }
    let trait = sheetName, unit = '';
    const match = sheetName.match(/(.+?)\s*\((.+?)\)/);
    if(match) { trait = match[1]; unit = match[2]; }
    return { data, trait, unit };
}

// ===== 통계 함수 =====
const mean = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
const std = arr => { const m=mean(arr); return Math.sqrt(arr.reduce((s,v)=>s+(v-m)**2,0)/(arr.length-1)); };
const se = arr => std(arr)/Math.sqrt(arr.length);

function fCDF(f, d1, d2) {
    if(f<=0) return 0;
    const x = d2/(d2+d1*f);
    return 1 - betaInc(d2/2, d1/2, x);
}

function betaInc(a,b,x) {
    if(x===0) return 0; if(x===1) return 1;
    const bt = Math.exp(gammaLn(a+b)-gammaLn(a)-gammaLn(b)+a*Math.log(x)+b*Math.log(1-x));
    return x<(a+1)/(a+b+2) ? bt*betaCF(a,b,x)/a : 1-bt*betaCF(b,a,1-x)/b;
}

function betaCF(a,b,x) {
    let c=1, d=1-(a+b)*x/(a+1); if(Math.abs(d)<1e-30) d=1e-30; d=1/d; let h=d;
    for(let m=1; m<=100; m++) {
        let m2=2*m, aa=m*(b-m)*x/((a-1+m2)*(a+m2));
        d=1+aa*d; if(Math.abs(d)<1e-30) d=1e-30; c=1+aa/c; if(Math.abs(c)<1e-30) c=1e-30; d=1/d; h*=d*c;
        aa=-(a+m)*(a+b+m)*x/((a+m2)*(a+1+m2));
        d=1+aa*d; if(Math.abs(d)<1e-30) d=1e-30; c=1+aa/c; if(Math.abs(c)<1e-30) c=1e-30; d=1/d;
        let del=d*c; h*=del; if(Math.abs(del-1)<3e-7) break;
    }
    return h;
}

function gammaLn(x) {
    const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
    let y=x, t=x+5.5; t-=(x+0.5)*Math.log(t); let s=1.000000000190015;
    for(let j=0;j<6;j++) s+=c[j]/++y;
    return -t+Math.log(2.5066282746310005*s/x);
}

function getQValue(alpha, df, p) {
    const table = qTable[alpha]; if(!table) return 3.0;
    const dfs = Object.keys(table).map(Number).sort((a,b)=>a-b);
    let dfKey = dfs[0];
    for(const d of dfs) if(d<=df) dfKey=d; else break;
    const row = table[dfKey]; if(!row) return 3.0;
    const pIdx = Math.min(Math.max(p, 2), row.length-1);
    return row[pIdx] || 3.0;
}

// ===== DMRT 분석 =====
function runAnalysis() {
    const selectedSheets = currentWorkbook ? getSelectedSheets() : [];
    if(selectedSheets.length > 0) {
        allResults = {}; rawDataByTrait = {};
        selectedSheets.forEach(sheetName => {
            const { data, trait, unit } = parseSheetData(sheetName);
            if(data.length >= 3) {
                const result = analyzeData(data, trait, unit);
                if(result) { allResults[trait] = result; rawDataByTrait[trait] = data; }
            }
        });
        const traitNames = Object.keys(allResults);
        if(traitNames.length === 0) { showStatus('error', '유효한 데이터가 있는 시트가 없습니다.'); return; }
        createTraitTabs(traitNames);
        currentTrait = traitNames[0];
        displayResults(currentTrait);
        showStatus('success', `${traitNames.length}개 형질 분석 완료`);
    } else {
        const data = getDataFromTable();
        if(data.length < 3) { showStatus('error', '최소 3개 이상의 데이터 필요'); return; }
        const trait = document.getElementById('traitName').value || '형질';
        const unit = document.getElementById('traitUnit').value || '';
        const result = analyzeData(data, trait, unit);
        if(!result) { showStatus('error', '분석 실패'); return; }
        allResults = { [trait]: result }; rawDataByTrait = { [trait]: data };
        document.getElementById('traitTabsContainer').classList.add('hidden');
        currentTrait = trait;
        displayResults(trait);
        showStatus('success', 'DMRT 분석 완료');
    }
}

function analyzeData(data, trait, unit) {
    const groups = {};
    data.forEach(d => { if(!groups[d.variety]) groups[d.variety] = []; groups[d.variety].push(d.value); });
    const varieties = Object.keys(groups);
    if(varieties.length < 2) return null;
    const stats = varieties.map(v => ({ variety: v, values: groups[v], n: groups[v].length, mean: mean(groups[v]), sd: std(groups[v]), se: se(groups[v]) })).sort((a,b) => b.mean - a.mean);
    const grandMean = mean(data.map(d=>d.value));
    const N = data.length, k = varieties.length;
    let SSB=0, SSW=0;
    stats.forEach(s => { SSB += s.n * (s.mean-grandMean)**2; s.values.forEach(v => SSW += (v-s.mean)**2); });
    const dfB=k-1, dfW=N-k, MSB=SSB/dfB, MSW=SSW/dfW;
    const F = MSB/MSW;
    const pValue = 1-fCDF(F, dfB, dfW);
    const alpha = parseFloat(document.getElementById('alphaLevel').value);
    const groupLetters = assignDuncanGroups(stats, MSW, dfW, alpha);
    return { stats: stats.map((s,i) => ({...s, group: groupLetters[i]})), anova: { SSB, SSW, SST: SSB+SSW, dfB, dfW, dfT: N-1, MSB, MSW, F, pValue }, alpha, trait, unit };
}

function assignDuncanGroups(stats, MSW, dfW, alpha) {
    const k = stats.length;
    const hN = k/stats.reduce((s,x)=>s+1/x.n,0);
    const SE = Math.sqrt(MSW/hN);
    const crit = [];
    for(let p=2; p<=k; p++) crit.push(getQValue(alpha, dfW, p) * SE);
    const sig = [];
    for(let i=0; i<k; i++) { sig[i] = []; for(let j=0; j<k; j++) { sig[i][j] = i<j ? Math.abs(stats[i].mean-stats[j].mean) > crit[Math.min(j-i-1, crit.length-1)] : false; } }
    const letters = stats.map(() => []);
    let letter = 'a', start = 0;
    for(let i=0; i<k; i++) {
        let ok = true;
        for(let j=start; j<i; j++) if(letters[j].includes(letter) && sig[j][i]) { ok=false; break; }
        if(ok) letters[i].push(letter);
        else {
            letter = String.fromCharCode(letter.charCodeAt(0)+1); start = i; letters[i].push(letter);
            for(let j=i-1; j>=0; j--) { let add = true; for(let m=j+1; m<=i; m++) if(letters[m].includes(letter) && sig[j][m]) { add=false; break; } if(add && !sig[j][i]) letters[j].push(letter); }
        }
    }
    return letters.map(arr => arr.sort().join(''));
}

function displayResults(trait) {
    const result = allResults[trait];
    if(!result) return;
    const dec = parseInt(document.getElementById('decimalPlaces').value);
    document.getElementById('currentTraitName').textContent = trait + (result.unit ? ` (${result.unit})` : '');
    const rb = document.getElementById('resultBody');
    rb.innerHTML = result.stats.map(s => `<tr><td>${s.variety}</td><td>${s.n}</td><td>${s.mean.toFixed(dec)}</td><td>${s.sd.toFixed(dec)}</td><td class="group-letter">${s.group}</td></tr>`).join('');
    const a = result.anova;
    const pStr = a.pValue<0.0001 ? '<0.0001' : a.pValue.toFixed(4);
    const sig = a.pValue<0.01 ? '**' : a.pValue<0.05 ? '*' : '';
    document.getElementById('anovaBody').innerHTML = `<tr><td>처리간</td><td>${a.SSB.toFixed(4)}</td><td>${a.dfB}</td><td>${a.MSB.toFixed(4)}</td><td>${a.F.toFixed(4)}</td><td class="${a.pValue<0.05?'significance':''}">${pStr}${sig}</td></tr><tr><td>처리내</td><td>${a.SSW.toFixed(4)}</td><td>${a.dfW}</td><td>${a.MSW.toFixed(4)}</td><td>-</td><td>-</td></tr><tr><td>총</td><td>${a.SST.toFixed(4)}</td><td>${a.dfT}</td><td>-</td><td>-</td><td>-</td></tr>`;

}

// ===== 그룹별 색상 계산 =====
function getGroupColors(stats) {
    const uniqueGroups = [...new Set(stats.map(s => s.group))].sort();
    const numGroups = uniqueGroups.length;
    const groupColorMap = {};
    uniqueGroups.forEach((g, i) => { const colorIndex = numGroups === 1 ? 3 : Math.round(i * (COLOR_PALETTE.length - 1) / (numGroups - 1)); groupColorMap[g] = COLOR_PALETTE[colorIndex]; });
    return { groupColorMap, uniqueGroups };
}

function getGrayscaleForGroups(stats) {
    const uniqueGroups = [...new Set(stats.map(s => s.group))].sort();
    const numGroups = uniqueGroups.length;
    const whiteOnly = document.getElementById('whiteBackgroundOnly').checked;
    const groupGrayMap = {};
    uniqueGroups.forEach((g, i) => { 
        if(whiteOnly) {
            groupGrayMap[g] = '#ffffff';
        } else {
            const grayIndex = numGroups === 1 ? 3 : Math.round(i * (GRAYSCALE_FILLS.length - 1) / (numGroups - 1)); 
            groupGrayMap[g] = GRAYSCALE_FILLS[grayIndex]; 
        }
    });
    return { groupGrayMap, uniqueGroups };
}

function updateChart() {
    if(!currentTrait || !allResults[currentTrait]) return;
    const result = allResults[currentTrait];
    const canvas = document.getElementById('mainChart');
    const ctx = canvas.getContext('2d');
    const dpi = parseInt(document.getElementById('chartDPI').value);
    const wMM = parseFloat(document.getElementById('chartWidth').value) || 170;
    const hMM = parseFloat(document.getElementById('chartHeight').value) || 120;
    const w = Math.round(wMM/25.4*dpi);
    const h = Math.round(hMM/25.4*dpi);
    canvas.width = w; canvas.height = h;
    canvas.style.width = Math.min(wMM*2, 500) + 'px';
    canvas.style.height = Math.min(hMM*2, 400) + 'px';
    const scale = dpi/72;
    const dec = parseInt(document.getElementById('decimalPlaces').value);
    const data = result.stats;
    const n = data.length;
    
    // 폰트 설정
    const engFont = document.getElementById('engFont').value;
    const korFont = '"Nanum Gothic", "Noto Sans KR"';
    
    // 옵션
    const titleSz = parseFloat(document.getElementById('titleSize').value)*scale;
    const axisSz = parseFloat(document.getElementById('axisLabelSize').value)*scale;
    const tickSz = parseFloat(document.getElementById('tickLabelSize').value)*scale;
    const grpSz = parseFloat(document.getElementById('groupLabelSize').value)*scale;
    const barBdr = parseFloat(document.getElementById('barBorderWidth').value)*scale;
    const errW = parseFloat(document.getElementById('errorBarWidth').value)*scale;
    const barW = parseFloat(document.getElementById('barSpacing').value);
    const errType = document.getElementById('errorType').value;
    const useGroupColor = document.getElementById('groupColorMode').checked;
    const gray = document.getElementById('grayscaleMode').checked;
    const useColorPattern = document.getElementById('useColorPattern').checked;
    const showT = document.getElementById('showTitle').checked;
    const showG = document.getElementById('showGroupLetters').checked;
    const showM = document.getElementById('showMeanValues').checked;
    const showGr = document.getElementById('showGrid').checked;
    
    const { groupColorMap, uniqueGroups } = getGroupColors(data);
    const { groupGrayMap } = getGrayscaleForGroups(data);
    updateColorLegend(uniqueGroups, gray ? groupGrayMap : groupColorMap);
    
    const mt = showT ? titleSz*2.5 : titleSz;
    const mb = axisSz*4.5;
    const ml = axisSz*5;
    const mr = axisSz*1.5;
    const pw = w-ml-mr, ph = h-mt-mb;
    
    let yMin = parseFloat(document.getElementById('yMin').value);
    let yMax = parseFloat(document.getElementById('yMax').value);
    let yInterval = parseFloat(document.getElementById('yInterval').value);
    const dMin = Math.min(...data.map(d => d.mean - (errType==='sd'?d.sd:errType==='se'?d.se:0)));
    const dMax = Math.max(...data.map(d => d.mean + (errType==='sd'?d.sd:errType==='se'?d.se:0)));
    if(isNaN(yMin)) yMin = Math.max(0, dMin - (dMax-dMin)*0.15);
    if(isNaN(yMax)) yMax = dMax + (dMax-dMin)*0.25;
    if(isNaN(yInterval) || yInterval <= 0) yInterval = (yMax - yMin) / 5;
    
    const xPos = i => ml + (i+0.5)*pw/n;
    const yPos = v => mt + ph - (v-yMin)/(yMax-yMin)*ph;
    const bw = pw/n*barW;
    
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,w,h);
    
    if(showGr) {
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 0.5*scale;
        for(let v = yMin; v <= yMax + yInterval*0.01; v += yInterval) {
            const y = yPos(v);
            if(y >= mt && y <= mt + ph) { ctx.beginPath(); ctx.moveTo(ml,y); ctx.lineTo(w-mr,y); ctx.stroke(); }
        }
    }
    
    function drawPattern(ctx, x, y, width, height, pattern, fillColor, strokeColor, scale) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, width, height);
        ctx.clip();
        ctx.fillStyle = fillColor;
        ctx.fillRect(x, y, width, height);
        const gap = 6 * scale;
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1 * scale;
        if(pattern === 'stripe') { for(let px = x - height; px < x + width + height; px += gap) { ctx.beginPath(); ctx.moveTo(px, y + height); ctx.lineTo(px + height, y); ctx.stroke(); } }
        else if(pattern === 'stripe2') { for(let px = x - height; px < x + width + height; px += gap) { ctx.beginPath(); ctx.moveTo(px + height, y + height); ctx.lineTo(px, y); ctx.stroke(); } }
        else if(pattern === 'hline') { for(let py = y; py < y + height; py += gap) { ctx.beginPath(); ctx.moveTo(x, py); ctx.lineTo(x + width, py); ctx.stroke(); } }
        else if(pattern === 'vline') { for(let px = x; px < x + width; px += gap) { ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px, y + height); ctx.stroke(); } }
        else if(pattern === 'grid') { ctx.lineWidth = 0.5 * scale; for(let py = y; py < y + height; py += gap) { ctx.beginPath(); ctx.moveTo(x, py); ctx.lineTo(x + width, py); ctx.stroke(); } for(let px = x; px < x + width; px += gap) { ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px, y + height); ctx.stroke(); } }
        else if(pattern === 'dot') { ctx.fillStyle = strokeColor; for(let py = y + gap/2; py < y + height; py += gap) { for(let px = x + gap/2; px < x + width; px += gap) { ctx.beginPath(); ctx.arc(px, py, 1.5 * scale, 0, Math.PI * 2); ctx.fill(); } } }
        else if(pattern === 'cross') { ctx.lineWidth = 0.8 * scale; for(let py = y + gap/2; py < y + height; py += gap) { for(let px = x + gap/2; px < x + width; px += gap) { const sz = 2 * scale; ctx.beginPath(); ctx.moveTo(px - sz, py); ctx.lineTo(px + sz, py); ctx.moveTo(px, py - sz); ctx.lineTo(px, py + sz); ctx.stroke(); } } }
        ctx.restore();
    }
    
    // 색상을 더 진하게 만드는 함수
    function darkenColor(hex, factor = 0.4) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        const nr = Math.round(r * (1 - factor));
        const ng = Math.round(g * (1 - factor));
        const nb = Math.round(b * (1 - factor));
        return `#${nr.toString(16).padStart(2,'0')}${ng.toString(16).padStart(2,'0')}${nb.toString(16).padStart(2,'0')}`;
    }
    
    data.forEach((d,i) => {
        const x = xPos(i)-bw/2;
        const y = yPos(d.mean);
        const bh = yPos(yMin)-y;
        
        if(gray) {
            // 흑백 모드
            const fillColor = groupGrayMap[d.group];
            const pattern = groupPatterns[d.group] || 'solid';
            if(pattern === 'solid') { 
                ctx.fillStyle = fillColor; 
                ctx.fillRect(x, y, bw, bh); 
            } else { 
                drawPattern(ctx, x, y, bw, bh, pattern, fillColor, '#000000', scale); 
            }
        } else if(useColorPattern) {
            // 컬러 + 패턴 모드
            const baseColor = useGroupColor ? groupColorMap[d.group] : COLOR_PALETTE[i % COLOR_PALETTE.length];
            const pattern = groupPatterns[d.group] || 'solid';
            if(pattern === 'solid') {
                ctx.fillStyle = baseColor;
                ctx.fillRect(x, y, bw, bh);
            } else {
                // 배경은 밝은 색, 패턴은 진한 색
                const patternColor = darkenColor(baseColor, 0.5);
                drawPattern(ctx, x, y, bw, bh, pattern, baseColor, patternColor, scale);
            }
        } else {
            // 일반 컬러 모드 (단색)
            ctx.fillStyle = useGroupColor ? groupColorMap[d.group] : COLOR_PALETTE[i % COLOR_PALETTE.length];
            ctx.fillRect(x, y, bw, bh);
        }
        
        if(barBdr > 0) { ctx.strokeStyle = '#000'; ctx.lineWidth = barBdr; ctx.strokeRect(x, y, bw, bh); }
        if(errType !== 'none') {
            const err = errType==='sd' ? d.sd : d.se;
            const top = yPos(d.mean+err), bot = yPos(d.mean-err);
            const cx = xPos(i), cw = bw*0.25;
            ctx.strokeStyle = '#000'; ctx.lineWidth = errW;
            ctx.beginPath(); ctx.moveTo(cx,top); ctx.lineTo(cx,bot); ctx.moveTo(cx-cw,top); ctx.lineTo(cx+cw,top); ctx.moveTo(cx-cw,bot); ctx.lineTo(cx+cw,bot); ctx.stroke();
        }
        if(showG) {
            const ly = errType!=='none' ? yPos(d.mean+(errType==='sd'?d.sd:d.se))-grpSz*0.6 : y-grpSz*0.6;
            ctx.fillStyle = '#000'; ctx.font = `bold ${grpSz}px ${engFont}, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(d.group, xPos(i), ly);
        }
        if(showM) {
            const vy = showG ? (errType!=='none' ? yPos(d.mean+(errType==='sd'?d.sd:d.se))-grpSz*1.8 : y-grpSz*1.8) : (errType!=='none' ? yPos(d.mean+(errType==='sd'?d.sd:d.se))-grpSz*0.6 : y-grpSz*0.6);
            ctx.fillStyle = '#000'; ctx.font = `${tickSz*0.9}px ${engFont}, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(d.mean.toFixed(dec), xPos(i), vy);
        }
    });
    
    ctx.strokeStyle = '#000'; ctx.lineWidth = scale;
    ctx.beginPath(); ctx.moveTo(ml,mt); ctx.lineTo(ml,mt+ph); ctx.lineTo(w-mr,mt+ph); ctx.stroke();
    
    ctx.fillStyle = '#000'; ctx.font = `${tickSz}px ${engFont}, sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for(let v = yMin; v <= yMax + yInterval*0.01; v += yInterval) {
        const y = yPos(v);
        if(y >= mt - 5 && y <= mt + ph + 5) { ctx.beginPath(); ctx.moveTo(ml-4*scale,y); ctx.lineTo(ml,y); ctx.stroke(); ctx.fillText(v.toFixed(dec), ml-6*scale, y); }
    }
    
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = `${tickSz}px ${korFont}, sans-serif`;
    data.forEach((d,i) => {
        const x = xPos(i);
        const y = mt+ph+6*scale;
        if(d.variety.length > 6 && n > 5) { ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI/4); ctx.textAlign = 'right'; ctx.fillText(d.variety, 0, 0); ctx.restore(); }
        else { ctx.fillText(d.variety, x, y); }
    });
    
    ctx.font = `bold ${axisSz}px ${korFont}, ${engFont}, sans-serif`;
    const yLbl = document.getElementById('yAxisLabel').value;
    if(yLbl) { ctx.save(); ctx.translate(axisSz*1.2, mt+ph/2); ctx.rotate(-Math.PI/2); ctx.textAlign = 'center'; ctx.fillText(yLbl, 0, 0); ctx.restore(); }
    const xLbl = document.getElementById('xAxisLabel').value;
    if(xLbl) { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(xLbl, ml+pw/2, h-axisSz*0.3); }
    if(showT) { ctx.font = `bold ${titleSz}px ${korFont}, ${engFont}, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(result.trait, w/2, titleSz*0.5); }
}

function updateColorLegend(groups, colorMap) {
    const legend = document.getElementById('colorLegend');
    legend.innerHTML = groups.map(g => `<div class="legend-item"><div class="legend-color" style="background:${colorMap[g]}"></div><span>그룹 ${g}</span></div>`).join('');
}

function downloadChart() {
    const canvas = document.getElementById('mainChart');
    const link = document.createElement('a');
    link.download = `DMRT_${currentTrait}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function downloadAllReports() {
    const dec = parseInt(document.getElementById('decimalPlaces').value);
    const wb = XLSX.utils.book_new();
    Object.keys(allResults).forEach(trait => {
        const result = allResults[trait];
        const sheet = [[`DMRT 분석 - ${trait}${result.unit ? ' ('+result.unit+')' : ''}`],[`α = ${result.alpha}`],[],['품종','N','평균','SD','SE','그룹']];
        result.stats.forEach(s => { sheet.push([s.variety, s.n, +s.mean.toFixed(dec), +s.sd.toFixed(dec), +s.se.toFixed(dec), s.group]); });
        const a = result.anova;
        sheet.push([]); sheet.push(['ANOVA']); sheet.push(['요인','SS','df','MS','F','p']);
        sheet.push(['처리간',+a.SSB.toFixed(4),a.dfB,+a.MSB.toFixed(4),+a.F.toFixed(4),a.pValue<0.0001?'<0.0001':+a.pValue.toFixed(4)]);
        sheet.push(['처리내',+a.SSW.toFixed(4),a.dfW,+a.MSW.toFixed(4),'-','-']);
        sheet.push(['총',+a.SST.toFixed(4),a.dfT,'-','-','-']);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet), trait.substring(0,31));
    });
    const summary = [['형질별 DMRT 요약'],[]];
    Object.keys(allResults).forEach(trait => {
        const result = allResults[trait];
        summary.push([`${trait}${result.unit ? ' ('+result.unit+')' : ''}`]); summary.push(['품종','평균±SD','그룹']);
        result.stats.forEach(s => { summary.push([s.variety, `${s.mean.toFixed(dec)}±${s.sd.toFixed(dec)}`, s.group]); });
        summary.push([]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), '전체요약');
    XLSX.writeFile(wb, 'DMRT_전체분석결과.xlsx');
}

function showStatus(type, msg) {
    const el = document.getElementById('statusMessage');
    el.className = 'status ' + type; el.textContent = msg; el.classList.remove('hidden');
    if(type !== 'info') setTimeout(() => el.classList.add('hidden'), 5000);
}
