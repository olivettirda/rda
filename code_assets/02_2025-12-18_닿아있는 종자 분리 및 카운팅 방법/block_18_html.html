    <div id="brownRicePresets" class="preset-section">

document.querySelectorAll('input[name="seedType"]').forEach(radio => {

        const isRough = e.target.value === 'rough_rice';
        document.getElementById('roughRicePresets').style.display = isRough ? 'block' : 'none';
        document.getElementById('brownRicePresets').style.display = isRough ? 'none' : 'block';
        
        // 까락 제거 섹션 표시/숨김
        document.querySelector('.awn-section').style.display = isRough ? 'block' : 'none';
    });
});
