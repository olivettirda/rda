<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Marker Designer v1.0</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f7f6;
            --bg-card: #ffffff;
            --accent-1: #cce3dd;
            --accent-2: #b2d9d8;
            --accent-3: #8dccd3;
            --accent-4: #54b7c6;
            --accent-5: #00a1b8;
            --accent-6: #017f97;
            --accent-7: #0c3026;
            --text-primary: #1a1a1a;
            --text-secondary: #5a6a62;
            --border-color: #d0d8d4;
            --error: #ef4444;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "KoPub Dotum", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

        /* Header */
        header { text-align: center; margin-bottom: 1.5rem; padding: 1.5rem 0; }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-7), var(--accent-6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.25rem; }

        /* Main Tabs */
        .main-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .main-tab {
            padding: 0.7rem 1.2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .main-tab:hover { border-color: var(--accent-5); color: var(--accent-6); }
        .main-tab.active {
            background: linear-gradient(135deg, var(--accent-5), var(--accent-6));
            border-color: var(--accent-5);
            color: #fff;
        }

        /* Tab Content */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--accent-6);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Form Elements */
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }
        .form-control {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
        }
        .form-control:focus { outline: none; border-color: var(--accent-5); }
        textarea.form-control {
            min-height: 120px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.85rem;
            resize: vertical;
        }

        /* Radio & Checkbox */
        .radio-group, .checkbox-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .radio-item, .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
        }
        .radio-item input, .checkbox-item input { accent-color: var(--accent-5); }

        /* Inline Form */
        .form-inline {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .form-inline .form-group { margin-bottom: 0; flex: 1; min-width: 80px; }

        /* Buttons */
        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-5), var(--accent-6));
            color: #fff;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 161, 184, 0.3);
        }
        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-secondary:hover { border-color: var(--accent-5); }
        .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }

        /* Collapsible Section */
        .collapsible { margin-bottom: 1rem; }
        .collapsible-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--accent-6);
        }
        .collapsible-header:hover { border-color: var(--accent-5); }
        .collapsible-header .arrow { transition: transform 0.2s; }
        .collapsible.open .collapsible-header .arrow { transform: rotate(180deg); }
        .collapsible-body {
            display: none;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 6px 6px;
        }
        .collapsible.open .collapsible-body { display: block; }

        /* Result Area */
        .result-area { min-height: 300px; }
        .result-tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .result-tab {
            padding: 0.5rem 0.8rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px 6px 0 0;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .result-tab.active {
            background: var(--accent-5);
            border-color: var(--accent-5);
            color: #fff;
        }

        /* Marker Card */
        .marker-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .marker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .marker-type {
            font-weight: 600;
            color: var(--accent-6);
            font-size: 0.9rem;
        }
        .marker-score {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .primer-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            align-items: flex-start;
        }
        .primer-name {
            min-width: 100px;
            font-weight: 500;
            color: var(--accent-7);
        }
        .primer-seq {
            font-family: Consolas, 'Courier New', monospace;
            word-break: break-all;
            flex: 1;
        }
        .primer-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .marker-meta {
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

        /* Status Messages */
        .status {
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }
        .status.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }
        .status.info {
            background: rgba(0, 161, 184, 0.1);
            border: 1px solid var(--accent-5);
            color: var(--accent-6);
        }

        /* Single Column Layout (for tools) */
        .single-layout { max-width: 600px; margin: 0 auto; }

        /* Table */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th {
            background: var(--bg-secondary);
            padding: 0.6rem;
            text-align: left;
            font-weight: 500;
            color: var(--accent-6);
        }
        .data-table td {
            padding: 0.5rem 0.6rem;
            border-top: 1px solid var(--border-color);
        }
        .data-table tr:hover { background: var(--bg-secondary); }

        /* Utility */
        .hidden { display: none !important; }
        .mono { font-family: Consolas, 'Courier New', monospace; }
        .text-center { text-align: center; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Molecular Marker Designer v1.0</h1>
            <p class="subtitle">SNP/InDel 기반 분자마커 자동 설계 도구</p>
        </header>

        <!-- Main Tabs -->
        <div class="main-tabs">
            <button class="main-tab active" data-tab="design">신규 설계</button>
            <button class="main-tab" data-tab="convert">마커 전환</button>
            <button class="main-tab" data-tab="tm-calc">Tm 계산기</button>
            <button class="main-tab" data-tab="seq-tools">서열 도구</button>
            <button class="main-tab" data-tab="re-search">제한효소 검색</button>
        </div>

        <!-- Tab 1: 신규 설계 -->
        <div id="tab-design" class="tab-content active">
            <div class="main-layout">
                <!-- Left Panel: Input -->
                <div class="input-panel">
                    <div class="card">
                        <div class="card-title">다형성 정보</div>

                        <div class="form-group">
                            <label>다형성 타입</label>
                            <div class="radio-group">
                                <label class="radio-item">
                                    <input type="radio" name="variantType" value="SNP" checked> SNP
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="variantType" value="InDel"> InDel
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="variantType" value="SSR"> SSR/STR
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>레퍼런스 서열 (FASTA 또는 raw)</label>
                            <textarea class="form-control" id="refSeq" placeholder=">SD1_gene&#10;ATGCGATCGATCGATCG...""></textarea>
                        </div>

                        <div id="snpInputs">
                            <div class="form-inline">
                                <div class="form-group">
                                    <label>SNP 위치 (1-based)</label>
                                    <input type="number" class="form-control" id="snpPos" placeholder="379">
                                </div>
                                <div class="form-group">
                                    <label>Allele 1 (FAM)</label>
                                    <input type="text" class="form-control" id="allele1" placeholder="A" maxlength="10">
                                </div>
                                <div class="form-group">
                                    <label>Allele 2 (HEX)</label>
                                    <input type="text" class="form-control" id="allele2" placeholder="G" maxlength="10">
                                </div>
                            </div>
                        </div>

                        <div id="indelInputs" class="hidden">
                            <div class="form-inline">
                                <div class="form-group">
                                    <label>시작 위치</label>
                                    <input type="number" class="form-control" id="indelStart" placeholder="100">
                                </div>
                                <div class="form-group">
                                    <label>끝 위치</label>
                                    <input type="number" class="form-control" id="indelEnd" placeholder="104">
                                </div>
                            </div>
                            <div class="form-group mt-1">
                                <label>Alternative Allele (결실이면 '-')</label>
                                <input type="text" class="form-control" id="indelAlt" placeholder="-">
                            </div>
                        </div>

                        <div id="ssrInputs" class="hidden">
                            <div class="form-inline">
                                <div class="form-group">
                                    <label>반복 시작</label>
                                    <input type="number" class="form-control" id="ssrStart" placeholder="100">
                                </div>
                                <div class="form-group">
                                    <label>반복 끝</label>
                                    <input type="number" class="form-control" id="ssrEnd" placeholder="124">
                                </div>
                                <div class="form-group">
                                    <label>반복 단위</label>
                                    <input type="text" class="form-control" id="ssrUnit" placeholder="AT">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Design Parameters (Collapsible) -->
                    <div class="collapsible">
                        <div class="collapsible-header" onclick="toggleCollapsible(this.parentElement)">
                            <span>설계 파라미터</span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="collapsible-body">
                            <div class="form-inline mb-1">
                                <div class="form-group">
                                    <label>Target Tm (°C)</label>
                                    <input type="number" class="form-control" id="targetTm" value="60">
                                </div>
                                <div class="form-group">
                                    <label>Tm 허용 (±°C)</label>
                                    <input type="number" class="form-control" id="tmTolerance" value="3">
                                </div>
                                <div class="form-group">
                                    <label>Max Tm 차이</label>
                                    <input type="number" class="form-control" id="maxTmDiff" value="3">
                                </div>
                            </div>
                            <div class="form-inline mb-1">
                                <div class="form-group">
                                    <label>프라이머 최소 길이</label>
                                    <input type="number" class="form-control" id="minLen" value="18">
                                </div>
                                <div class="form-group">
                                    <label>최대 길이</label>
                                    <input type="number" class="form-control" id="maxLen" value="28">
                                </div>
                            </div>
                            <div class="form-inline mb-1">
                                <div class="form-group">
                                    <label>GC% 최소</label>
                                    <input type="number" class="form-control" id="minGC" value="30">
                                </div>
                                <div class="form-group">
                                    <label>GC% 최대</label>
                                    <input type="number" class="form-control" id="maxGC" value="70">
                                </div>
                            </div>
                            <div class="form-inline">
                                <div class="form-group">
                                    <label>앰플리콘 최소 (bp)</label>
                                    <input type="number" class="form-control" id="minProduct" value="80">
                                </div>
                                <div class="form-group">
                                    <label>앰플리콘 최대 (bp)</label>
                                    <input type="number" class="form-control" id="maxProduct" value="300">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Marker Type Selection -->
                    <div class="card">
                        <div class="card-title">마커 타입 선택</div>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input type="checkbox" name="markerType" value="KASP" checked> KASP
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="markerType" value="TaqMan"> TaqMan
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="markerType" value="HRM"> HRM
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="markerType" value="CAPS"> CAPS
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="markerType" value="dCAPS"> dCAPS
                            </label>
                        </div>

                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="designMarkers()">마커 설계</button>
                            <button class="btn btn-secondary" onclick="clearInputs()">초기화</button>
                        </div>
                    </div>
                </div>

                <!-- Right Panel: Results -->
                <div class="result-panel">
                    <div class="card result-area">
                        <div class="card-title">설계 결과</div>

                        <div id="resultTabs" class="result-tabs hidden">
                            <!-- Dynamically populated -->
                        </div>

                        <div id="resultContent">
                            <div class="empty-state">
                                <div class="icon">🧬</div>
                                <p>서열과 다형성 정보를 입력하고<br>"마커 설계" 버튼을 클릭하세요</p>
                            </div>
                        </div>

                        <div id="exportButtons" class="btn-group hidden">
                            <button class="btn btn-secondary" onclick="exportCSV()">CSV 내보내기</button>
                            <button class="btn btn-secondary" onclick="copyToClipboard()">클립보드 복사</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: 마커 전환 -->
        <div id="tab-convert" class="tab-content">
            <div class="main-layout">
                <div class="input-panel">
                    <div class="card">
                        <div class="card-title">기존 마커 정보</div>
                        <div class="form-group">
                            <label>마커 타입</label>
                            <select class="form-control" id="sourceMarkerType">
                                <option value="KASP">KASP</option>
                                <option value="TaqMan">TaqMan</option>
                                <option value="HRM">HRM</option>
                                <option value="CAPS">CAPS</option>
                                <option value="PCR">InDel PCR</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>프라이머/Probe 서열</label>
                            <textarea class="form-control" id="sourceMarkerSeq" placeholder="ASP1: GAAGGTGACCAAGTTCATGCT...&#10;ASP2: GAAGGTCGGAGTCAACGGATT...&#10;Common: ..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>레퍼런스 서열</label>
                            <textarea class="form-control" id="convertRefSeq" placeholder="FASTA 또는 raw 서열"></textarea>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-title">전환 대상</div>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input type="checkbox" name="targetType" value="KASP"> KASP
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="targetType" value="TaqMan"> TaqMan
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="targetType" value="HRM"> HRM
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="targetType" value="CAPS"> CAPS
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="targetType" value="dCAPS"> dCAPS
                            </label>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="convertMarker()">마커 전환</button>
                        </div>
                    </div>
                </div>
                <div class="result-panel">
                    <div class="card result-area">
                        <div class="card-title">전환 결과</div>
                        <div id="convertResult">
                            <div class="empty-state">
                                <div class="icon">🔄</div>
                                <p>기존 마커 정보를 입력하고<br>전환할 타입을 선택하세요</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 3: Tm 계산기 -->
        <div id="tab-tm-calc" class="tab-content">
            <div class="single-layout">
                <div class="card">
                    <div class="card-title">Tm 계산기 (바이오니어 규칙)</div>
                    <div class="form-group">
                        <label>DNA 서열</label>
                        <textarea class="form-control" id="tmSeq" placeholder="ATGCGATCGATCGATCG" style="min-height: 80px;"></textarea>
                    </div>
                    <div class="form-inline mb-2">
                        <div class="form-group">
                            <label>Na+ 농도 (mM)</label>
                            <input type="number" class="form-control" id="naConc" value="50">
                        </div>
                        <div class="form-group">
                            <label>Primer 농도 (nM)</label>
                            <input type="number" class="form-control" id="primerConc" value="250">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="calculateTmUI()">Tm 계산</button>

                    <div id="tmResult" class="mt-2"></div>
                </div>
            </div>
        </div>

        <!-- Tab 4: 서열 도구 -->
        <div id="tab-seq-tools" class="tab-content">
            <div class="single-layout">
                <div class="card">
                    <div class="card-title">서열 도구</div>
                    <div class="form-group">
                        <label>DNA 서열</label>
                        <textarea class="form-control" id="seqToolInput" placeholder="ATGCGATCGATCGATCG"></textarea>
                    </div>
                    <div class="btn-group mb-2">
                        <button class="btn btn-primary" onclick="getReverseComplement()">역상보 서열</button>
                        <button class="btn btn-secondary" onclick="getSeqStats()">서열 통계</button>
                    </div>
                    <div id="seqToolResult"></div>
                </div>
            </div>
        </div>

        <!-- Tab 5: 제한효소 검색 -->
        <div id="tab-re-search" class="tab-content">
            <div class="main-layout">
                <div class="input-panel">
                    <div class="card">
                        <div class="card-title">제한효소 사이트 검색</div>
                        <div class="form-group">
                            <label>DNA 서열</label>
                            <textarea class="form-control" id="reSeq" placeholder="FASTA 또는 raw 서열"></textarea>
                        </div>
                        <div class="form-group">
                            <label>효소 선택 (선택사항)</label>
                            <input type="text" class="form-control" id="reFilter" placeholder="예: EcoRI, BamHI (비워두면 모두 검색)">
                        </div>
                        <button class="btn btn-primary" onclick="searchRE()">검색</button>
                    </div>
                </div>
                <div class="result-panel">
                    <div class="card result-area">
                        <div class="card-title">검색 결과</div>
                        <div id="reResult">
                            <div class="empty-state">
                                <div class="icon">✂️</div>
                                <p>서열을 입력하고 검색하세요</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== Tab Navigation ==========
        document.querySelectorAll('.main-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active from all tabs
                document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                // Add active to clicked tab
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });

        // ========== Variant Type Toggle ==========
        document.querySelectorAll('input[name="variantType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.getElementById('snpInputs').classList.add('hidden');
                document.getElementById('indelInputs').classList.add('hidden');
                document.getElementById('ssrInputs').classList.add('hidden');

                if (e.target.value === 'SNP') {
                    document.getElementById('snpInputs').classList.remove('hidden');
                } else if (e.target.value === 'InDel') {
                    document.getElementById('indelInputs').classList.remove('hidden');
                } else if (e.target.value === 'SSR') {
                    document.getElementById('ssrInputs').classList.remove('hidden');
                }
            });
        });

        // ========== Collapsible Toggle ==========
        function toggleCollapsible(el) {
            el.classList.toggle('open');
        }

        // ========== Tm 계산 (바이오니어 규칙) ==========
        /**
         * Nearest-neighbor 파라미터 (SantaLucia 1998)
         * dH: kcal/mol, dS: cal/(mol·K)
         */
        const NN_PARAMS = {
            'AA': { dH: -7.9,  dS: -22.2 }, 'TT': { dH: -7.9,  dS: -22.2 },
            'AT': { dH: -7.2,  dS: -20.4 }, 'TA': { dH: -7.2,  dS: -21.3 },
            'CA': { dH: -8.5,  dS: -22.7 }, 'TG': { dH: -8.5,  dS: -22.7 },
            'GT': { dH: -8.4,  dS: -22.4 }, 'AC': { dH: -8.4,  dS: -22.4 },
            'CT': { dH: -7.8,  dS: -21.0 }, 'AG': { dH: -7.8,  dS: -21.0 },
            'GA': { dH: -8.2,  dS: -22.2 }, 'TC': { dH: -8.2,  dS: -22.2 },
            'CG': { dH: -10.6, dS: -27.2 }, 'GC': { dH: -9.8,  dS: -24.4 },
            'GG': { dH: -8.0,  dS: -19.9 }, 'CC': { dH: -8.0,  dS: -19.9 }
        };

        /**
         * Tm 계산 (바이오니어 규칙)
         * @param {string} seq - DNA 서열 (ACGTN)
         * @param {object} options - { naConc: mM, primerConc: nM }
         * @returns {number} Tm (°C)
         */
        function calculateTm(seq, options = {}) {
            const naConc = options.naConc || 50;          // Na+ (mM)
            const primerConc = options.primerConc || 250; // primer (nM)

            seq = seq.toUpperCase().replace(/[^ACGT]/g, '');
            const len = seq.length;

            if (len === 0) return 0;

            // 15bp 미만: Wallace rule
            if (len < 15) {
                const gc = (seq.match(/[GC]/g) || []).length;
                const at = (seq.match(/[AT]/g) || []).length;
                return 2 * at + 4 * gc;
            }

            // 15bp 이상: Nearest-neighbor method
            // Initiation
            let dH = 0.1;   // kcal/mol
            let dS = -2.8;  // cal/(mol·K)

            // Sum NN contributions
            for (let i = 0; i < len - 1; i++) {
                const dinuc = seq.substring(i, i + 2);
                if (NN_PARAMS[dinuc]) {
                    dH += NN_PARAMS[dinuc].dH;
                    dS += NN_PARAMS[dinuc].dS;
                }
            }

            // Terminal AT penalty
            if (seq[0] === 'A' || seq[0] === 'T') { dH += 2.3; dS += 4.1; }
            if (seq[len-1] === 'A' || seq[len-1] === 'T') { dH += 2.3; dS += 4.1; }

            // Salt correction (SantaLucia 1998)
            const naM = naConc / 1000;
            dS += 0.368 * (len - 1) * Math.log(naM);

            // Tm calculation
            const R = 1.987; // Gas constant cal/(mol·K)
            const primerM = primerConc * 1e-9;
            const tm = (dH * 1000) / (dS + R * Math.log(primerM / 4)) - 273.15;

            return Math.round(tm * 10) / 10;
        }

        // ========== 서열 유틸리티 함수 ==========
        /**
         * GC 함량 계산
         */
        function calculateGC(seq) {
            seq = seq.toUpperCase().replace(/[^ACGT]/g, '');
            if (seq.length === 0) return 0;
            const gc = (seq.match(/[GC]/g) || []).length;
            return Math.round((gc / seq.length) * 1000) / 10;
        }

        /**
         * 역상보 서열
         */
        function reverseComplement(seq) {
            const comp = { 'A':'T', 'T':'A', 'G':'C', 'C':'G', 'N':'N',
                           'a':'t', 't':'a', 'g':'c', 'c':'g', 'n':'n' };
            return seq.split('').reverse().map(b => comp[b] || 'N').join('');
        }

        /**
         * Poly-X 검사 (연속 동일 염기)
         */
        function hasPolyX(seq, maxLen = 4) {
            const regex = new RegExp(`([ATGC])\\1{${maxLen},}`, 'i');
            return regex.test(seq);
        }

        /**
         * 서열 정리 (FASTA 헤더 제거, 공백 제거)
         */
        function cleanSequence(seq) {
            // FASTA 헤더 제거
            const lines = seq.trim().split('\n');
            const seqLines = lines.filter(line => !line.startsWith('>'));
            return seqLines.join('').replace(/\s/g, '').toUpperCase();
        }

        /**
         * 서열 통계
         */
        function getSequenceStats(seq) {
            seq = cleanSequence(seq);
            const len = seq.length;
            if (len === 0) return null;

            const counts = { A: 0, T: 0, G: 0, C: 0, N: 0 };
            for (const base of seq) {
                if (counts.hasOwnProperty(base)) counts[base]++;
                else counts.N++;
            }

            return {
                length: len,
                counts: counts,
                gc: calculateGC(seq),
                at: Math.round(((counts.A + counts.T) / len) * 1000) / 10
            };
        }

        // ========== KASP 마커 설계 ==========
        const KASP_TAILS = {
            FAM: 'GAAGGTGACCAAGTTCATGCT',  // 21bp
            HEX: 'GAAGGTCGGAGTCAACGGATT'   // 21bp
        };

        /**
         * 기본 설계 파라미터
         */
        function getDesignParams() {
            return {
                targetTm: parseFloat(document.getElementById('targetTm').value) || 60,
                tmTolerance: parseFloat(document.getElementById('tmTolerance').value) || 3,
                maxTmDiff: parseFloat(document.getElementById('maxTmDiff').value) || 3,
                minLen: parseInt(document.getElementById('minLen').value) || 18,
                maxLen: parseInt(document.getElementById('maxLen').value) || 28,
                minGC: parseFloat(document.getElementById('minGC').value) || 30,
                maxGC: parseFloat(document.getElementById('maxGC').value) || 70,
                minProduct: parseInt(document.getElementById('minProduct').value) || 80,
                maxProduct: parseInt(document.getElementById('maxProduct').value) || 300,
                maxPolyX: 4,
                naConc: 50,
                primerConc: 250
            };
        }

        /**
         * 3' 말단 GC 클램프 검사 (마지막 5bp 중 G/C 개수)
         */
        function count3PrimeGC(seq, window = 5) {
            const end = seq.slice(-window).toUpperCase();
            return (end.match(/[GC]/g) || []).length;
        }

        /**
         * KASP SNP 마커 설계
         * @param {string} seq - 레퍼런스 서열
         * @param {number} snpPos - SNP 위치 (0-based)
         * @param {string} allele1 - Allele 1 (FAM)
         * @param {string} allele2 - Allele 2 (HEX)
         * @param {object} params - 설계 파라미터
         */
        function designKASP_SNP(seq, snpPos, allele1, allele2, params) {
            const results = [];
            const minTm = params.targetTm - params.tmTolerance;
            const maxTm = params.targetTm + params.tmTolerance;

            // Forward ASP 탐색 (SNP가 3' 말단)
            for (let len = params.minLen; len <= params.maxLen; len++) {
                const start = snpPos - len + 1;
                if (start < 0) continue;

                const aspCore = seq.substring(start, snpPos); // SNP 미포함
                const asp1Full = aspCore + allele1;
                const asp2Full = aspCore + allele2;

                const tm1 = calculateTm(asp1Full, params);
                const gc1 = calculateGC(asp1Full);

                // ASP 필터링
                if (tm1 < minTm || tm1 > maxTm) continue;
                if (gc1 < params.minGC || gc1 > params.maxGC) continue;
                if (hasPolyX(asp1Full, params.maxPolyX)) continue;

                // Common primer 탐색 (SNP 다음부터)
                for (let cLen = params.minLen; cLen <= params.maxLen; cLen++) {
                    for (let gap = 10; gap <= 50; gap += 5) { // SNP에서 떨어진 거리
                        const cStart = snpPos + 1 + gap;
                        const cEnd = cStart + cLen;
                        if (cEnd > seq.length) continue;

                        const commonFwd = seq.substring(cStart, cEnd);
                        const commonRev = reverseComplement(commonFwd);

                        const cTm = calculateTm(commonRev, params);
                        const cGc = calculateGC(commonRev);

                        // Common 필터링
                        if (cTm < minTm || cTm > maxTm) continue;
                        if (Math.abs(tm1 - cTm) > params.maxTmDiff) continue;
                        if (cGc < params.minGC || cGc > params.maxGC) continue;
                        if (hasPolyX(commonRev, params.maxPolyX)) continue;

                        const productSize = (cStart + cLen) - start;
                        if (productSize < params.minProduct || productSize > params.maxProduct) continue;

                        // 점수 계산 (낮을수록 좋음)
                        const tm2 = calculateTm(asp2Full, params);
                        const score = Math.abs(tm1 - params.targetTm) +
                                     Math.abs(cTm - params.targetTm) +
                                     Math.abs(tm1 - cTm) +
                                     Math.abs(tm1 - tm2);

                        results.push({
                            type: 'KASP-SNP',
                            asp1: {
                                name: 'ASP1_FAM',
                                sequence: KASP_TAILS.FAM + asp1Full,
                                core: asp1Full,
                                length: asp1Full.length,
                                tm: tm1,
                                gc: gc1
                            },
                            asp2: {
                                name: 'ASP2_HEX',
                                sequence: KASP_TAILS.HEX + asp2Full,
                                core: asp2Full,
                                length: asp2Full.length,
                                tm: tm2,
                                gc: calculateGC(asp2Full)
                            },
                            common: {
                                name: 'Common_Rev',
                                sequence: commonRev,
                                length: cLen,
                                tm: cTm,
                                gc: cGc
                            },
                            productSize: productSize,
                            tmDiff: Math.abs(tm1 - cTm),
                            score: Math.round(score * 100) / 100
                        });
                    }
                }
            }

            // 점수순 정렬
            results.sort((a, b) => a.score - b.score);
            return results.slice(0, 10); // Top 10
        }

        /**
         * KASP InDel 마커 설계
         * @param {string} seq - 레퍼런스 서열 (insertion allele 기준)
         * @param {number} indelStart - InDel 시작 위치 (0-based)
         * @param {number} indelEnd - InDel 끝 위치 (0-based, exclusive)
         * @param {string} altAllele - Alternative allele ('-' for deletion)
         * @param {object} params - 설계 파라미터
         */
        function designKASP_InDel(seq, indelStart, indelEnd, altAllele, params) {
            const results = [];
            const minTm = params.targetTm - params.tmTolerance;
            const maxTm = params.targetTm + params.tmTolerance;
            const indelLen = indelEnd - indelStart;
            const refAllele = seq.substring(indelStart, indelEnd);

            // 전략: InDel 3' 경계에 ASP 3' 말단 위치
            for (let len = params.minLen; len <= params.maxLen; len++) {
                // ASP1: Reference allele (InDel 포함)
                const asp1End = indelEnd;
                const asp1Start = asp1End - len;
                if (asp1Start < 0) continue;

                const asp1Core = seq.substring(asp1Start, asp1End);
                const tm1 = calculateTm(asp1Core, params);
                const gc1 = calculateGC(asp1Core);

                if (tm1 < minTm || tm1 > maxTm) continue;
                if (gc1 < params.minGC || gc1 > params.maxGC) continue;
                if (hasPolyX(asp1Core, params.maxPolyX)) continue;

                // ASP2: Alternative allele
                let asp2Core;
                if (altAllele === '-' || altAllele === '') {
                    // Deletion: InDel 부분 건너뛰기
                    const preIndel = seq.substring(asp1Start, indelStart);
                    const neededFromPost = len - preIndel.length;
                    const postIndel = seq.substring(indelEnd, indelEnd + neededFromPost);
                    asp2Core = preIndel + postIndel;
                } else {
                    // Alternative sequence
                    const preIndel = seq.substring(asp1Start, indelStart);
                    asp2Core = preIndel + altAllele;
                    if (asp2Core.length < len) {
                        const needed = len - asp2Core.length;
                        asp2Core += seq.substring(indelEnd, indelEnd + needed);
                    } else if (asp2Core.length > len) {
                        asp2Core = asp2Core.substring(0, len);
                    }
                }

                if (asp2Core.length < params.minLen) continue;

                const tm2 = calculateTm(asp2Core, params);
                const gc2 = calculateGC(asp2Core);

                if (tm2 < minTm || tm2 > maxTm) continue;
                if (Math.abs(tm1 - tm2) > params.maxTmDiff) continue;

                // Common primer
                for (let cLen = params.minLen; cLen <= params.maxLen; cLen++) {
                    for (let gap = 10; gap <= 50; gap += 5) {
                        const cStart = indelEnd + gap;
                        const cEnd = cStart + cLen;
                        if (cEnd > seq.length) continue;

                        const commonFwd = seq.substring(cStart, cEnd);
                        const commonRev = reverseComplement(commonFwd);
                        const cTm = calculateTm(commonRev, params);
                        const cGc = calculateGC(commonRev);

                        if (cTm < minTm || cTm > maxTm) continue;
                        if (Math.abs(tm1 - cTm) > params.maxTmDiff) continue;
                        if (cGc < params.minGC || cGc > params.maxGC) continue;
                        if (hasPolyX(commonRev, params.maxPolyX)) continue;

                        const productSize = cEnd - asp1Start;
                        if (productSize < params.minProduct || productSize > params.maxProduct) continue;

                        const score = Math.abs(tm1 - params.targetTm) +
                                     Math.abs(tm2 - params.targetTm) +
                                     Math.abs(cTm - params.targetTm) +
                                     Math.abs(tm1 - cTm);

                        results.push({
                            type: 'KASP-InDel',
                            indelSize: indelLen,
                            asp1: {
                                name: 'ASP1_FAM (Ref)',
                                sequence: KASP_TAILS.FAM + asp1Core,
                                core: asp1Core,
                                length: asp1Core.length,
                                tm: tm1,
                                gc: gc1
                            },
                            asp2: {
                                name: 'ASP2_HEX (Alt)',
                                sequence: KASP_TAILS.HEX + asp2Core,
                                core: asp2Core,
                                length: asp2Core.length,
                                tm: tm2,
                                gc: gc2
                            },
                            common: {
                                name: 'Common_Rev',
                                sequence: commonRev,
                                length: cLen,
                                tm: cTm,
                                gc: cGc
                            },
                            productSize: productSize,
                            tmDiff: Math.abs(tm1 - cTm),
                            score: Math.round(score * 100) / 100
                        });
                    }
                }
            }

            results.sort((a, b) => a.score - b.score);
            return results.slice(0, 10);
        }

        /**
         * InDel PCR 마커 설계 (크기 차이로 구분)
         */
        function designInDelPCR(seq, indelStart, indelEnd, params) {
            const results = [];
            const minTm = params.targetTm - params.tmTolerance;
            const maxTm = params.targetTm + params.tmTolerance;
            const indelSize = indelEnd - indelStart;

            if (indelSize < 3) {
                return { error: 'InDel 크기가 너무 작습니다 (최소 3bp 권장). KASP-InDel을 사용하세요.' };
            }

            const indelCenter = Math.floor((indelStart + indelEnd) / 2);

            for (let productSize = params.minProduct; productSize <= params.maxProduct; productSize += 20) {
                const halfSize = Math.floor(productSize / 2);

                for (let fLen = params.minLen; fLen <= params.maxLen; fLen++) {
                    const fStart = indelCenter - halfSize;
                    if (fStart < 0) continue;

                    const fwdSeq = seq.substring(fStart, fStart + fLen);
                    const fTm = calculateTm(fwdSeq, params);
                    const fGc = calculateGC(fwdSeq);

                    if (fTm < minTm || fTm > maxTm) continue;
                    if (fGc < params.minGC || fGc > params.maxGC) continue;

                    for (let rLen = params.minLen; rLen <= params.maxLen; rLen++) {
                        const rEnd = indelCenter + halfSize;
                        if (rEnd > seq.length) continue;

                        const revFwd = seq.substring(rEnd - rLen, rEnd);
                        const revSeq = reverseComplement(revFwd);
                        const rTm = calculateTm(revSeq, params);
                        const rGc = calculateGC(revSeq);

                        if (rTm < minTm || rTm > maxTm) continue;
                        if (Math.abs(fTm - rTm) > params.maxTmDiff) continue;
                        if (rGc < params.minGC || rGc > params.maxGC) continue;

                        const actualProductSize = rEnd - fStart;
                        const band1 = actualProductSize;
                        const band2 = actualProductSize - indelSize;

                        const score = Math.abs(fTm - rTm) + Math.abs(fTm - params.targetTm);

                        results.push({
                            type: 'InDel-PCR',
                            forward: {
                                name: 'Forward',
                                sequence: fwdSeq,
                                length: fLen,
                                tm: fTm,
                                gc: fGc
                            },
                            reverse: {
                                name: 'Reverse',
                                sequence: revSeq,
                                length: rLen,
                                tm: rTm,
                                gc: rGc
                            },
                            indelSize: indelSize,
                            band1: { name: 'Reference', size: band1 },
                            band2: { name: 'Alternative', size: band2 },
                            productSize: actualProductSize,
                            tmDiff: Math.abs(fTm - rTm),
                            score: Math.round(score * 100) / 100
                        });
                    }
                }
            }

            results.sort((a, b) => a.score - b.score);
            return results.slice(0, 10);
        }

        /**
         * InDel PCR 결과 HTML 생성
         */
        function formatInDelPCRResult(markers) {
            if (markers.error) {
                return `<div class="status error">${markers.error}</div>`;
            }
            if (markers.length === 0) {
                return '<div class="status info">조건에 맞는 InDel PCR 마커를 찾을 수 없습니다.</div>';
            }

            let html = '';
            markers.forEach((m, idx) => {
                html += `
                    <div class="marker-card">
                        <div class="marker-header">
                            <span class="marker-type">${m.type} #${idx + 1}</span>
                            <span class="marker-score">Score: ${m.score}</span>
                        </div>
                        <div class="primer-row">
                            <span class="primer-name">Forward:</span>
                            <span class="primer-seq">${m.forward.sequence}</span>
                        </div>
                        <div class="primer-row">
                            <span class="primer-info" style="margin-left:100px;">${m.forward.length}bp | Tm: ${m.forward.tm}°C | GC: ${m.forward.gc}%</span>
                        </div>
                        <div class="primer-row">
                            <span class="primer-name">Reverse:</span>
                            <span class="primer-seq">${m.reverse.sequence}</span>
                        </div>
                        <div class="primer-row">
                            <span class="primer-info" style="margin-left:100px;">${m.reverse.length}bp | Tm: ${m.reverse.tm}°C | GC: ${m.reverse.gc}%</span>
                        </div>
                        <div class="marker-meta">
                            InDel: ${m.indelSize}bp | ${m.band1.name}: ${m.band1.size}bp | ${m.band2.name}: ${m.band2.size}bp
                        </div>
                    </div>
                `;
            });
            return html;
        }

        // ========== TaqMan 마커 설계 ==========
        /**
         * TaqMan 마커 설계
         * Probe Tm = Primer Tm + 8~10°C
         * Probe 길이: 18-28bp
         * SNP은 Probe 중앙에 위치
         * 5' 말단 G 회피 (quenching)
         */
        function designTaqMan(seq, snpPos, allele1, allele2, params) {
            const results = [];
            const minTm = params.targetTm - params.tmTolerance;
            const maxTm = params.targetTm + params.tmTolerance;
            const probeTmTarget = params.targetTm + 10;

            // Probe 설계 (SNP 중앙 배치)
            for (let pLen = 18; pLen <= 28; pLen++) {
                const halfLen = Math.floor(pLen / 2);
                const pStart = snpPos - halfLen;
                const pEnd = pStart + pLen;

                if (pStart < 0 || pEnd > seq.length) continue;

                const probeSeq = seq.substring(pStart, pEnd);
                const probeTm = calculateTm(probeSeq, params);
                const probeGc = calculateGC(probeSeq);

                // Probe Tm 검증 (프라이머보다 높아야 함)
                if (probeTm < probeTmTarget - 5 || probeTm > probeTmTarget + 5) continue;

                // 5' G 회피
                if (probeSeq[0] === 'G') continue;

                // GC 함량 체크
                if (probeGc < 30 || probeGc > 80) continue;

                // Forward primer (probe 앞)
                for (let fLen = params.minLen; fLen <= params.maxLen; fLen++) {
                    const fEnd = pStart - 3; // Probe에서 최소 3bp 떨어짐
                    const fStart = fEnd - fLen;
                    if (fStart < 0) continue;

                    const fwdSeq = seq.substring(fStart, fEnd);
                    const fTm = calculateTm(fwdSeq, params);
                    const fGc = calculateGC(fwdSeq);

                    if (fTm < minTm || fTm > maxTm) continue;
                    if (fGc < params.minGC || fGc > params.maxGC) continue;
                    if (hasPolyX(fwdSeq, params.maxPolyX)) continue;

                    // Reverse primer (probe 뒤)
                    for (let rLen = params.minLen; rLen <= params.maxLen; rLen++) {
                        const rStart = pEnd + 3;
                        const rEnd = rStart + rLen;
                        if (rEnd > seq.length) continue;

                        const revFwd = seq.substring(rStart, rEnd);
                        const revSeq = reverseComplement(revFwd);
                        const rTm = calculateTm(revSeq, params);
                        const rGc = calculateGC(revSeq);

                        if (rTm < minTm || rTm > maxTm) continue;
                        if (Math.abs(fTm - rTm) > params.maxTmDiff) continue;
                        if (rGc < params.minGC || rGc > params.maxGC) continue;
                        if (hasPolyX(revSeq, params.maxPolyX)) continue;

                        const productSize = rEnd - fStart;
                        if (productSize < 60 || productSize > 150) continue; // TaqMan optimal

                        // Probe에 각 allele 적용
                        const snpPosInProbe = snpPos - pStart;
                        const probe1 = probeSeq.substring(0, snpPosInProbe) + allele1 + probeSeq.substring(snpPosInProbe + 1);
                        const probe2 = probeSeq.substring(0, snpPosInProbe) + allele2 + probeSeq.substring(snpPosInProbe + 1);

                        const score = Math.abs(fTm - rTm) +
                                     Math.abs(fTm - params.targetTm) +
                                     Math.abs(probeTm - probeTmTarget);

                        results.push({
                            type: 'TaqMan',
                            forward: {
                                name: 'Forward',
                                sequence: fwdSeq,
                                length: fLen,
                                tm: fTm,
                                gc: fGc
                            },
                            reverse: {
                                name: 'Reverse',
                                sequence: revSeq,
                                length: rLen,
                                tm: rTm,
                                gc: rGc
                            },
                            probe1: {
                                name: `Probe_FAM (${allele1})`,
                                sequence: `[FAM]${probe1}[BHQ1]`,
                                core: probe1,
                                length: pLen,
                                tm: calculateTm(probe1, params),
                                gc: calculateGC(probe1)
                            },
                            probe2: {
                                name: `Probe_VIC (${allele2})`,
                                sequence: `[VIC]${probe2}[BHQ1]`,
                                core: probe2,
                                length: pLen,
                                tm: calculateTm(probe2, params),
                                gc: calculateGC(probe2)
                            },
                            productSize: productSize,
                            tmDiff: Math.abs(fTm - rTm),
                            score: Math.round(score * 100) / 100
                        });
                    }
                }
            }

            results.sort((a, b) => a.score - b.score);
            return results.slice(0, 10);
        }

        // ========== HRM 마커 설계 ==========
        /**
         * PCR 산물 Tm 계산 (간이)
         * 긴 서열용: Tm = 81.5 + 16.6*log[Na+] + 41*(GC/N) - 500/N
         */
        function calculateProductTm(seq) {
            seq = seq.toUpperCase().replace(/[^ACGT]/g, '');
            const gc = (seq.match(/[GC]/g) || []).length;
            const len = seq.length;
            if (len === 0) return 0;
            return Math.round((81.5 + 16.6 * Math.log10(0.05) + 41 * (gc / len) - 500 / len) * 10) / 10;
        }

        /**
         * HRM 마커 설계
         * 작은 앰플리콘 (60-150bp), SNP 중앙 배치
         */
        function designHRM(seq, snpPos, allele1, allele2, params) {
            const results = [];
            const minTm = params.targetTm - params.tmTolerance;
            const maxTm = params.targetTm + params.tmTolerance;

            // 앰플리콘 크기 범위
            for (let ampSize = 60; ampSize <= 150; ampSize += 10) {
                const halfSize = Math.floor(ampSize / 2);

                for (let fLen = params.minLen; fLen <= params.maxLen; fLen++) {
                    const fStart = snpPos - halfSize;
                    if (fStart < 0) continue;

                    const fwdSeq = seq.substring(fStart, fStart + fLen);
                    const fTm = calculateTm(fwdSeq, params);
                    const fGc = calculateGC(fwdSeq);

                    if (fTm < minTm || fTm > maxTm) continue;
                    if (fGc < params.minGC || fGc > params.maxGC) continue;
                    if (hasPolyX(fwdSeq, params.maxPolyX)) continue;

                    for (let rLen = params.minLen; rLen <= params.maxLen; rLen++) {
                        const rEnd = snpPos + halfSize;
                        const rStart = rEnd - rLen;
                        if (rEnd > seq.length || rStart < snpPos) continue;

                        const revFwd = seq.substring(rStart, rEnd);
                        const revSeq = reverseComplement(revFwd);
                        const rTm = calculateTm(revSeq, params);
                        const rGc = calculateGC(revSeq);

                        if (rTm < minTm || rTm > maxTm) continue;
                        if (Math.abs(fTm - rTm) > params.maxTmDiff) continue;
                        if (rGc < params.minGC || rGc > params.maxGC) continue;
                        if (hasPolyX(revSeq, params.maxPolyX)) continue;

                        const productSize = rEnd - fStart;
                        if (productSize < 60 || productSize > 150) continue;

                        // 앰플리콘 서열 및 Tm 차이 계산
                        const ampSeq1 = seq.substring(fStart, snpPos) + allele1 + seq.substring(snpPos + 1, rEnd);
                        const ampSeq2 = seq.substring(fStart, snpPos) + allele2 + seq.substring(snpPos + 1, rEnd);

                        const ampTm1 = calculateProductTm(ampSeq1);
                        const ampTm2 = calculateProductTm(ampSeq2);
                        const meltDiff = Math.abs(ampTm1 - ampTm2);

                        // 높은 meltDiff가 좋음 (구분 용이)
                        const score = -meltDiff + Math.abs(fTm - rTm) + Math.abs(fTm - params.targetTm);

                        results.push({
                            type: 'HRM',
                            forward: {
                                name: 'Forward',
                                sequence: fwdSeq,
                                length: fLen,
                                tm: fTm,
                                gc: fGc
                            },
                            reverse: {
                                name: 'Reverse',
                                sequence: revSeq,
                                length: rLen,
                                tm: rTm,
                                gc: rGc
                            },
                            productSize: productSize,
                            amplicon1: { allele: allele1, tm: ampTm1 },
                            amplicon2: { allele: allele2, tm: ampTm2 },
                            meltingDiff: meltDiff,
                            tmDiff: Math.abs(fTm - rTm),
                            score: Math.round(score * 100) / 100
                        });
                    }
                }
            }

            results.sort((a, b) => a.score - b.score);
            return results.slice(0, 10);
        }

        // 설계 결과 저장 (내보내기용)
        let currentResults = { kasp: [], taqman: [], hrm: [], caps: [], dcaps: [] };

        // ========== UI 함수 ==========
        function designMarkers() {
            const seq = cleanSequence(document.getElementById('refSeq').value);
            const variantType = document.querySelector('input[name="variantType"]:checked').value;
            const params = getDesignParams();

            // 입력 검증
            if (seq.length === 0) {
                document.getElementById('resultContent').innerHTML =
                    '<div class="status error">레퍼런스 서열을 입력하세요.</div>';
                return;
            }

            // 선택된 마커 타입
            const selectedTypes = Array.from(document.querySelectorAll('input[name="markerType"]:checked'))
                                       .map(cb => cb.value);

            if (selectedTypes.length === 0) {
                document.getElementById('resultContent').innerHTML =
                    '<div class="status error">최소 하나의 마커 타입을 선택하세요.</div>';
                return;
            }

            let resultsHTML = '';
            currentResults = { kasp: [], taqman: [], hrm: [], caps: [], dcaps: [] };

            if (variantType === 'SNP') {
                const snpPos = parseInt(document.getElementById('snpPos').value) - 1; // 1-based → 0-based
                const allele1 = document.getElementById('allele1').value.toUpperCase().trim();
                const allele2 = document.getElementById('allele2').value.toUpperCase().trim();

                if (isNaN(snpPos) || snpPos < 0 || snpPos >= seq.length) {
                    document.getElementById('resultContent').innerHTML =
                        '<div class="status error">유효한 SNP 위치를 입력하세요 (1-based).</div>';
                    return;
                }
                if (!allele1 || !allele2) {
                    document.getElementById('resultContent').innerHTML =
                        '<div class="status error">Allele 1과 Allele 2를 입력하세요.</div>';
                    return;
                }

                // KASP 설계
                if (selectedTypes.includes('KASP')) {
                    const kaspResults = designKASP_SNP(seq, snpPos, allele1, allele2, params);
                    currentResults.kasp = kaspResults;
                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">KASP 마커 (${kaspResults.length}개)</h3>`;
                    resultsHTML += formatKASPResult(kaspResults);
                }

                // TaqMan 설계
                if (selectedTypes.includes('TaqMan')) {
                    const taqmanResults = designTaqMan(seq, snpPos, allele1, allele2, params);
                    currentResults.taqman = taqmanResults;
                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">TaqMan 마커 (${taqmanResults.length}개)</h3>`;
                    resultsHTML += formatTaqManResult(taqmanResults);
                }

                // HRM 설계
                if (selectedTypes.includes('HRM')) {
                    const hrmResults = designHRM(seq, snpPos, allele1, allele2, params);
                    currentResults.hrm = hrmResults;
                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">HRM 마커 (${hrmResults.length}개)</h3>`;
                    resultsHTML += formatHRMResult(hrmResults);
                }
                if (selectedTypes.includes('CAPS')) {
                    resultsHTML += '<div class="status info" style="margin-top:1rem;">CAPS 마커는 다음 단계에서 구현됩니다.</div>';
                }
                if (selectedTypes.includes('dCAPS')) {
                    resultsHTML += '<div class="status info" style="margin-top:1rem;">dCAPS 마커는 다음 단계에서 구현됩니다.</div>';
                }

            } else if (variantType === 'InDel') {
                const indelStart = parseInt(document.getElementById('indelStart').value) - 1; // 1-based → 0-based
                const indelEnd = parseInt(document.getElementById('indelEnd').value); // 1-based end → 0-based exclusive
                const altAllele = document.getElementById('indelAlt').value.trim();

                if (isNaN(indelStart) || isNaN(indelEnd) || indelStart < 0 || indelEnd > seq.length || indelStart >= indelEnd) {
                    document.getElementById('resultContent').innerHTML =
                        '<div class="status error">유효한 InDel 위치를 입력하세요 (1-based).</div>';
                    return;
                }

                const indelSize = indelEnd - indelStart;
                resultsHTML += `<div class="status info" style="margin-bottom:1rem;">InDel 크기: ${indelSize}bp | Reference: ${seq.substring(indelStart, indelEnd)}</div>`;

                // KASP-InDel
                if (selectedTypes.includes('KASP')) {
                    const kaspResults = designKASP_InDel(seq, indelStart, indelEnd, altAllele, params);
                    currentResults.kasp = kaspResults;
                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">KASP-InDel 마커 (${kaspResults.length}개)</h3>`;
                    resultsHTML += formatKASPResult(kaspResults);
                }

                // InDel PCR (3bp 이상이면 자동 추가)
                if (indelSize >= 3) {
                    const pcrResults = designInDelPCR(seq, indelStart, indelEnd, params);
                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">InDel PCR 마커</h3>`;
                    resultsHTML += formatInDelPCRResult(pcrResults);
                }

                // 다른 마커 타입
                if (selectedTypes.includes('TaqMan')) {
                    resultsHTML += '<div class="status info" style="margin-top:1rem;">TaqMan은 SNP 전용입니다.</div>';
                }
                if (selectedTypes.includes('HRM')) {
                    resultsHTML += '<div class="status info" style="margin-top:1rem;">HRM은 SNP 전용입니다.</div>';
                }

            } else if (variantType === 'SSR') {
                resultsHTML = '<div class="status info">SSR 마커 설계는 다음 단계에서 구현됩니다.</div>';
            }

            document.getElementById('resultContent').innerHTML = resultsHTML;

            // 결과가 있으면 내보내기 버튼 표시
            if (currentResults.kasp.length > 0) {
                document.getElementById('exportButtons').classList.remove('hidden');
            }
        }
