            unique.sort((a, b) => a.score - b.score);
            return unique.slice(0, 10);
        }

        /**
         * dCAPS 결과 HTML 생성
         */
        function formatDCAPSResult(markers) {
            if (markers.length === 0) {
                return '<div class="status info">조건에 맞는 dCAPS 마커를 찾을 수 없습니다.</div>';
            }

            let html = '';
            markers.forEach((m, idx) => {
                // Mismatch 위치 하이라이트
                const seq = m.forward.sequence;
                const mmPos = m.mismatch.position - 1;
                const highlightedSeq = seq.substring(0, mmPos) +
                    `<span style="color:var(--error);font-weight:bold;text-decoration:underline;">${seq[mmPos]}</span>` +
                    seq.substring(mmPos + 1);

                html += `
                    <div class="marker-card">
                        <div class="marker-header">
                            <span class="marker-type">${m.type} #${idx + 1} - ${m.enzyme}</span>

                        </div>

                return;

            let resultsHTML = '';

            if (variantType === 'SNP') {
                const snpPos = parseInt(document.getElementById('snpPos').value) - 1; // 1-based → 0-based
                const allele1 = document.getElementById('allele1').value.toUpperCase().trim();
                const allele2 = document.getElementById('allele2').value.toUpperCase().trim();

                if (isNaN(snpPos) || snpPos < 0 || snpPos >= seq.length) {
                    document.getElementById('resultContent').innerHTML =
                        '<div class="status error">유효한 SNP 위치를 입력하세요 (1-based).</div>';
                    return;
                }

                    document.getElementById('resultContent').innerHTML =
                        '<div class="status error">Allele 1과 Allele 2를 입력하세요.</div>';
                    return;
                }

                // KASP 설계
                if (selectedTypes.includes('KASP')) {
                    const kaspResults = designKASP_SNP(seq, snpPos, allele1, allele2, params);
                    currentResults.kasp = kaspResults;
                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">KASP 마커 (${kaspResults.length}개)</h3>`;
                    resultsHTML += formatKASPResult(kaspResults);

                // TaqMan 설계
                if (selectedTypes.includes('TaqMan')) {
                    const taqmanResults = designTaqMan(seq, snpPos, allele1, allele2, params);
                    currentResults.taqman = taqmanResults;
                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">TaqMan 마커 (${taqmanResults.length}개)</h3>`;
                    resultsHTML += formatTaqManResult(taqmanResults);
                }

                // HRM 설계
                if (selectedTypes.includes('HRM')) {
                    const hrmResults = designHRM(seq, snpPos, allele1, allele2, params);
                    currentResults.hrm = hrmResults;
                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">HRM 마커 (${hrmResults.length}개)</h3>`;
                    resultsHTML += formatHRMResult(hrmResults);
                }
                // CAPS 설계
                if (selectedTypes.includes('CAPS')) {
                    const capsResults = designCAPS(seq, snpPos, allele1, allele2, params);
                    currentResults.caps = capsResults;
                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">CAPS 마커 (${capsResults.length}개)</h3>`;
                    resultsHTML += formatCAPSResult(capsResults);
                }

                // dCAPS 설계
                if (selectedTypes.includes('dCAPS')) {
                    const dcapsResults = designDCAPS(seq, snpPos, allele1, allele2, params);

                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">dCAPS 마커 (${dcapsResults.length}개)</h3>`;
                    resultsHTML += formatDCAPSResult(dcapsResults);
                }

            } else if (variantType === 'InDel') {
                const indelStart = parseInt(document.getElementById('indelStart').value) - 1; // 1-based → 0-based
                const indelEnd = parseInt(document.getElementById('indelEnd').value); // 1-based end → 0-based exclusive
                const altAllele = document.getElementById('indelAlt').value.trim();

                if (isNaN(indelStart) || isNaN(indelEnd) || indelStart < 0 || indelEnd > seq.length || indelStart >= indelEnd) {
                    document.getElementById('resultContent').innerHTML =
                        '<div class="status error">유효한 InDel 위치를 입력하세요 (1-based).</div>';

                const indelSize = indelEnd - indelStart;

                    resultsHTML += formatKASPResult(kaspResults);

                // InDel PCR (3bp 이상이면 자동 추가)
                if (indelSize >= 3) {

                    resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">InDel PCR 마커</h3>`;

            }

            document.getElementById('resultContent').innerHTML = resultsHTML;

            // 결과가 있으면 내보내기 버튼 표시

        function clearInputs() {

        function convertMarker() {
            const sourceType = document.getElementById('sourceMarkerType').value;
            const sourceSeqText = document.getElementById('sourceMarkerSeq').value.trim();
            const refSeqRaw = document.getElementById('convertRefSeq').value.trim();

            if (!sourceSeqText || !refSeqRaw) {
                document.getElementById('convertResult').innerHTML =
                    '<div class="status error">기존 마커 정보와 레퍼런스 서열을 모두 입력하세요.</div>';
                return;
            }

            // 레퍼런스 서열 파싱
            const refSeq = cleanSequence(refSeqRaw.replace(/^>.*\n/gm, ''));

            // 타겟 타입 체크
            const targetTypes = Array.from(document.querySelectorAll('input[name="targetType"]:checked'))
                .map(cb => cb.value);

            if (targetTypes.length === 0) {
                document.getElementById('convertResult').innerHTML =
                    '<div class="status error">전환할 마커 타입을 선택하세요.</div>';
                return;
            }

            // 소스 마커에서 프라이머 파싱
            const parsed = parseSourceMarker(sourceType, sourceSeqText);
            if (!parsed.success) {
                document.getElementById('convertResult').innerHTML =
                    `<div class="status error">${parsed.error}</div>`;
                return;
            }

            // 레퍼런스에서 SNP 위치 찾기
            const located = locateVariantFromPrimers(parsed, refSeq);
            if (!located.success) {
                document.getElementById('convertResult').innerHTML =
                    `<div class="status error">${located.error}</div>`;
                return;
            }

            const { snpPos, allele1, allele2 } = located;

            // 디자인 파라미터 (기본값)
            const params = {
                minLen: 18,
                maxLen: 25,
                optTm: 62,
                minTm: 58,
                maxTm: 65,
                minGC: 35,
                maxGC: 65,
                minProductSize: 80,
                maxProductSize: 200
            };

            // 타겟 타입별 마커 설계
            let resultsHTML = `<div class="status success">SNP 위치: ${snpPos + 1} (${allele1}/${allele2}) - 전환 마커 설계 완료</div>`;

            for (const targetType of targetTypes) {
                let markers = [];
                let formatFn;

                switch (targetType) {
                    case 'KASP':
                        markers = designKASP_SNP(refSeq, snpPos, allele1, allele2, params);
                        formatFn = formatKASPResult;
                        break;
                    case 'TaqMan':
                        markers = designTaqMan(refSeq, snpPos, allele1, allele2, params);
                        formatFn = formatTaqManResult;
                        break;
                    case 'HRM':
                        markers = designHRM(refSeq, snpPos, allele1, allele2, params);
                        formatFn = formatHRMResult;
                        break;
                    case 'CAPS':
                        markers = designCAPS(refSeq, snpPos, allele1, allele2, params);
                        formatFn = formatCAPSResult;
                        break;
                    case 'dCAPS':
                        markers = designDCAPS(refSeq, snpPos, allele1, allele2, params);
                        formatFn = formatDCAPSResult;
                        break;
                }

                resultsHTML += `<h3 style="margin: 1rem 0 0.5rem; color: var(--accent-6);">${targetType} 마커 (${markers.length}개)</h3>`;
                if (markers.length > 0) {
                    resultsHTML += formatFn(markers);
                } else {
                    resultsHTML += '<div class="status info">적합한 마커를 찾지 못했습니다.</div>';
                }
            }

            document.getElementById('convertResult').innerHTML = resultsHTML;
        }

        /**
         * 소스 마커에서 프라이머 정보 파싱
         */
        function parseSourceMarker(sourceType, seqText) {
            const lines = seqText.split('\n').map(l => l.trim()).filter(l => l);
            const primers = {};

            // KASP 테일 제거
            const KASP_TAIL_FAM = 'GAAGGTGACCAAGTTCATGCT';
            const KASP_TAIL_HEX = 'GAAGGTCGGAGTCAACGGATT';

            for (const line of lines) {
                // "프라이머명: 서열" 또는 "프라이머명 서열" 형식 파싱
                const match = line.match(/^(ASP1|ASP2|Allele1|Allele2|Common|Forward|Reverse|Fwd|Rev|F|R|Probe|Probe1|Probe2)[:\s]+([A-Za-z]+)/i);
                if (match) {
                    let name = match[1].toUpperCase();
                    let seq = cleanSequence(match[2]);

                    // KASP 테일 제거
                    if (seq.startsWith(KASP_TAIL_FAM)) {
                        seq = seq.substring(KASP_TAIL_FAM.length);
                    } else if (seq.startsWith(KASP_TAIL_HEX)) {
                        seq = seq.substring(KASP_TAIL_HEX.length);
                    }

                    // 이름 정규화
                    if (['ASP1', 'ALLELE1'].includes(name)) name = 'ASP1';
                    else if (['ASP2', 'ALLELE2'].includes(name)) name = 'ASP2';
                    else if (['FORWARD', 'FWD', 'F'].includes(name)) name = 'FORWARD';
                    else if (['REVERSE', 'REV', 'R'].includes(name)) name = 'REVERSE';

                    primers[name] = seq;
                }
            }

            // 프라이머 검증
            if (sourceType === 'KASP') {
                if (!primers.ASP1 || !primers.ASP2 || !primers.COMMON) {
                    return { success: false, error: 'KASP 마커는 ASP1, ASP2, Common 프라이머가 필요합니다.' };
                }
            } else if (['HRM', 'CAPS', 'PCR'].includes(sourceType)) {
                if (!primers.FORWARD || !primers.REVERSE) {
                    if (!primers.ASP1) {
                        return { success: false, error: 'Forward/Reverse 프라이머가 필요합니다.' };
                    }
                    // ASP1을 Forward로 사용 (일부 포맷 호환)
                    primers.FORWARD = primers.ASP1;
                    primers.REVERSE = primers.COMMON || primers.ASP2;
                }
            }

            return { success: true, primers, sourceType };
        }

        /**
         * 프라이머를 레퍼런스에 매핑하여 SNP 위치 찾기
         */
        function locateVariantFromPrimers(parsed, refSeq) {
            const { primers, sourceType } = parsed;
            const refUpper = refSeq.toUpperCase();

            if (sourceType === 'KASP') {
                // KASP: ASP1, ASP2의 3' 끝이 SNP 위치
                const asp1 = primers.ASP1.toUpperCase();
                const asp2 = primers.ASP2.toUpperCase();
                const common = primers.COMMON.toUpperCase();

                // ASP1/ASP2는 SNP를 3' 끝에 포함
                // SNP 없는 부분으로 위치 검색
                const asp1Core = asp1.slice(0, -1); // SNP 염기 제외
                const asp2Core = asp2.slice(0, -1);

                // Forward strand에서 검색
                let pos = refUpper.indexOf(asp1Core);
                if (pos !== -1) {
                    const snpPos = pos + asp1Core.length;
                    const allele1 = asp1.slice(-1);
                    const allele2 = asp2.slice(-1);
                    return { success: true, snpPos, allele1, allele2 };
                }

                // Reverse strand에서 검색
                const asp1CoreRC = reverseComplement(asp1Core);
                pos = refUpper.indexOf(asp1CoreRC);
                if (pos !== -1) {
                    const snpPos = pos - 1;
                    const allele1 = reverseComplement(asp1.slice(-1));
                    const allele2 = reverseComplement(asp2.slice(-1));
                    return { success: true, snpPos, allele1, allele2 };
                }

                return { success: false, error: 'ASP 프라이머를 레퍼런스 서열에서 찾을 수 없습니다.' };
            }

            // HRM, CAPS 등: Forward/Reverse 프라이머로 앰플리콘 영역 결정 후 SNP 찾기
            const fwd = primers.FORWARD.toUpperCase();
            const rev = primers.REVERSE.toUpperCase();
            const revRC = reverseComplement(rev);

            let fwdPos = refUpper.indexOf(fwd);
            let revPos = refUpper.indexOf(revRC);

            if (fwdPos === -1 || revPos === -1) {
                // Reverse strand 시도
                const fwdRC = reverseComplement(fwd);
                fwdPos = refUpper.indexOf(rev);
                revPos = refUpper.indexOf(fwdRC);
            }

            if (fwdPos === -1 || revPos === -1) {
                return { success: false, error: '프라이머를 레퍼런스 서열에서 찾을 수 없습니다.' };
            }

            const ampStart = Math.min(fwdPos, revPos);
            const ampEnd = Math.max(fwdPos, revPos) + fwd.length;

            // 앰플리콘 중앙 부근을 SNP 위치로 추정 (실제로는 사용자가 지정해야 함)
            // 우선 앰플리콘 중앙으로 설정
            const snpPos = Math.floor((ampStart + ampEnd) / 2);

            return {
                success: true,
                snpPos,
                allele1: refSeq[snpPos],
                allele2: '?',
                warning: 'SNP 위치가 앰플리콘 중앙으로 추정되었습니다. 정확한 allele 정보를 확인하세요.'
            };
        }

        /**
         * Tm 계산기 UI
         */
        function calculateTmUI() {
            const seq = document.getElementById('tmSeq').value.trim();
            const naConc = parseFloat(document.getElementById('naConc').value) || 50;
            const primerConc = parseFloat(document.getElementById('primerConc').value) || 250;

            const cleanSeq = cleanSequence(seq);

            if (cleanSeq.length === 0) {
                document.getElementById('tmResult').innerHTML =
                    '<div class="status error">서열을 입력하세요.</div>';
                return;
            }

            const tm = calculateTm(cleanSeq, { naConc, primerConc });
            const gc = calculateGC(cleanSeq);
            const method = cleanSeq.length < 15 ? 'Wallace rule' : 'Nearest-neighbor';

            document.getElementById('tmResult').innerHTML = `
                <div class="card" style="margin-top: 1rem;">
                    <table class="data-table">
                        <tr><th colspan="2">계산 결과</th></tr>
                        <tr><td>서열 길이</td><td class="mono">${cleanSeq.length} bp</td></tr>
                        <tr><td>Tm</td><td class="mono" style="font-weight:bold; color:var(--accent-6);">${tm} °C</td></tr>
                        <tr><td>GC 함량</td><td class="mono">${gc} %</td></tr>
                        <tr><td>계산 방법</td><td>${method}</td></tr>
                        <tr><td>Na+ 농도</td><td class="mono">${naConc} mM</td></tr>
                        <tr><td>Primer 농도</td><td class="mono">${primerConc} nM</td></tr>
                    </table>
                </div>
            `;
        }

        /**
         * 역상보 서열 UI
         */
        function getReverseComplement() {
            const seq = document.getElementById('seqToolInput').value.trim();
            const cleanSeq = cleanSequence(seq);

            if (cleanSeq.length === 0) {
                document.getElementById('seqToolResult').innerHTML =
                    '<div class="status error">서열을 입력하세요.</div>';
                return;
            }

            const rc = reverseComplement(cleanSeq);

            document.getElementById('seqToolResult').innerHTML = `
                <div class="card" style="margin-top: 1rem;">
                    <div class="card-title">역상보 서열 (Reverse Complement)</div>
                    <div class="form-group">
                        <label>원본 (5' → 3')</label>
                        <textarea class="form-control mono" readonly style="min-height:60px;">${cleanSeq}</textarea>
                    </div>
                    <div class="form-group">
                        <label>역상보 (5' → 3')</label>
                        <textarea class="form-control mono" readonly style="min-height:60px;">${rc}</textarea>
                    </div>
                    <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${rc}')">역상보 서열 복사</button>
                </div>
            `;
        }

        /**
         * 서열 통계 UI
         */
        function getSeqStats() {
            const seq = document.getElementById('seqToolInput').value.trim();
            const cleanSeq = cleanSequence(seq);

            if (cleanSeq.length === 0) {
                document.getElementById('seqToolResult').innerHTML =
                    '<div class="status error">서열을 입력하세요.</div>';
                return;
            }

            const stats = getSequenceStats(cleanSeq);
            const tm = calculateTm(cleanSeq);
            const polyX = hasPolyX(cleanSeq, 4);

            document.getElementById('seqToolResult').innerHTML = `
                <div class="card" style="margin-top: 1rem;">
                    <div class="card-title">서열 통계</div>
                    <table class="data-table">
                        <tr><td>서열 길이</td><td class="mono">${stats.length} bp</td></tr>
                        <tr><td>GC 함량</td><td class="mono">${stats.gc} %</td></tr>
                        <tr><td>AT 함량</td><td class="mono">${stats.at} %</td></tr>
                        <tr><td>Tm (50mM Na+)</td><td class="mono">${tm} °C</td></tr>
                        <tr><td>Poly-X (≥5bp)</td><td>${polyX ? '<span style="color:var(--error);">있음</span>' : '<span style="color:var(--success);">없음</span>'}</td></tr>
                    </table>
                    <table class="data-table mt-2">
                        <tr><th>A</th><th>T</th><th>G</th><th>C</th><th>N</th></tr>
                        <tr class="mono">
                            <td>${stats.counts.A}</td>
                            <td>${stats.counts.T}</td>
                            <td>${stats.counts.G}</td>
                            <td>${stats.counts.C}</td>
                            <td>${stats.counts.N}</td>
                        </tr>
                    </table>
                </div>
            `;
        }

        function searchRE() {
            const seqRaw = document.getElementById('reSeq').value.trim();
            const filterText = document.getElementById('reFilter').value.trim();

            if (!seqRaw) {
                document.getElementById('reResult').innerHTML =
                    '<div class="status error">DNA 서열을 입력하세요.</div>';
                return;
            }

            const seq = cleanSequence(seqRaw.replace(/^>.*\n/gm, '')).toUpperCase();

            if (seq.length < 4) {
                document.getElementById('reResult').innerHTML =
                    '<div class="status error">서열이 너무 짧습니다 (최소 4bp).</div>';
                return;
            }

            // 필터할 효소 목록
            let enzymeFilter = null;
            if (filterText) {
                enzymeFilter = filterText.split(/[,\s]+/).map(e => e.trim().toUpperCase()).filter(e => e);
            }

            // 모든 효소에 대해 검색
            const results = [];

            for (const [enzyme, info] of Object.entries(RESTRICTION_ENZYMES)) {
                // 필터 적용
                if (enzymeFilter && !enzymeFilter.includes(enzyme.toUpperCase())) {
                    continue;
                }

                const sites = findREsites(seq, info.site);

                if (sites.length > 0) {
                    results.push({
                        enzyme,
                        site: info.site,
                        cut: info.cut,
                        positions: sites,
                        count: sites.length
                    });
                }
            }

            // 결과 정렬 (발견 횟수 순)
            results.sort((a, b) => a.count - b.count || a.enzyme.localeCompare(b.enzyme));

            // 결과 출력
            let html = `<div class="status success">서열 길이: ${seq.length}bp - ${results.length}종 효소의 인식 부위 발견</div>`;

            if (results.length === 0) {
                html += '<div class="status info">인식 부위를 찾지 못했습니다.</div>';
            } else {
                html += `<div class="table-container"><table>
                    <thead>
                        <tr>
                            <th>효소</th>
                            <th>인식서열</th>
                            <th>절단위치</th>
                            <th>발견수</th>
                            <th>위치 (1-based)</th>
                        </tr>
                    </thead>
                    <tbody>`;

                for (const r of results) {
                    // 인식서열에 절단 위치 표시
                    const siteWithCut = r.site.slice(0, r.cut) + '|' + r.site.slice(r.cut);

                    // 위치 목록 (최대 10개까지 표시)
                    let posText = r.positions.slice(0, 10).map(p => p + 1).join(', ');
                    if (r.positions.length > 10) {
                        posText += ` ... (+${r.positions.length - 10}개)`;
                    }

                    html += `<tr>
                        <td><strong>${r.enzyme}</strong></td>
                        <td><code>${siteWithCut}</code></td>
                        <td>${r.cut}</td>
                        <td>${r.count}</td>
                        <td style="font-size: 0.85rem;">${posText}</td>
                    </tr>`;
                }

                html += '</tbody></table></div>';

                // 요약 통계
                const uniqueCutters = results.filter(r => r.count === 1);
                html += `<div style="margin-top: 1rem; padding: 0.75rem; background: var(--bg-secondary); border-radius: 4px;">
                    <strong>요약:</strong> 총 ${results.length}종 효소,
                    유일 절단 효소(Unique cutter): ${uniqueCutters.length}종
                    ${uniqueCutters.length > 0 ? '(' + uniqueCutters.map(r => r.enzyme).join(', ') + ')' : ''}
                </div>`;
            }

            document.getElementById('reResult').innerHTML = html;
        }

        /**
         * 서열에서 제한효소 인식 부위 찾기
         */
        function findREsites(seq, site) {
            const positions = [];
            const patterns = expandIUPAC(site);

            for (const pattern of patterns) {
                let pos = 0;
                while ((pos = seq.indexOf(pattern, pos)) !== -1) {
                    if (!positions.includes(pos)) {
                        positions.push(pos);
                    }
                    pos++;
                }
            }

            // Reverse complement에서도 검색 (palindrome이 아닌 경우)
            const siteRC = reverseComplement(site);
            if (siteRC !== site) {
                const patternsRC = expandIUPAC(siteRC);
                for (const pattern of patternsRC) {
                    let pos = 0;
                    while ((pos = seq.indexOf(pattern, pos)) !== -1) {
                        if (!positions.includes(pos)) {
                            positions.push(pos);
                        }
                        pos++;
                    }
                }
            }

            return positions.sort((a, b) => a - b);
        }

        /**
         * 결과를 CSV 형식으로 변환
         */
        function resultsToCSV() {
            let csv = 'Marker Type,Name,Sequence,Core Sequence,Length,Tm,GC%,Product Size,Score\n';

            // KASP 마커
            currentResults.kasp.forEach((m, idx) => {
                csv += `${m.type},ASP1_FAM,"${m.asp1.sequence}","${m.asp1.core}",${m.asp1.length},${m.asp1.tm},${m.asp1.gc},${m.productSize},${m.score}\n`;
                csv += `${m.type},ASP2_HEX,"${m.asp2.sequence}","${m.asp2.core}",${m.asp2.length},${m.asp2.tm},${m.asp2.gc},,\n`;
                csv += `${m.type},Common,"${m.common.sequence}",,${m.common.length},${m.common.tm},${m.common.gc},,\n`;
            });

            // TaqMan 마커
            currentResults.taqman.forEach((m, idx) => {
                csv += `${m.type},Forward,"${m.forward.sequence}",,${m.forward.length},${m.forward.tm},${m.forward.gc},${m.productSize},${m.score}\n`;
                csv += `${m.type},Reverse,"${m.reverse.sequence}",,${m.reverse.length},${m.reverse.tm},${m.reverse.gc},,\n`;
                csv += `${m.type},Probe_FAM,"${m.probe1.sequence}","${m.probe1.core}",${m.probe1.length},${m.probe1.tm},${m.probe1.gc},,\n`;
                csv += `${m.type},Probe_VIC,"${m.probe2.sequence}","${m.probe2.core}",${m.probe2.length},${m.probe2.tm},${m.probe2.gc},,\n`;
            });

            // HRM 마커
            currentResults.hrm.forEach((m, idx) => {
                csv += `${m.type},Forward,"${m.forward.sequence}",,${m.forward.length},${m.forward.tm},${m.forward.gc},${m.productSize},${m.score}\n`;
                csv += `${m.type},Reverse,"${m.reverse.sequence}",,${m.reverse.length},${m.reverse.tm},${m.reverse.gc},,\n`;
            });

            return csv;
        }

        /**
         * CSV 파일 다운로드
         */
        function exportCSV() {
            const csv = resultsToCSV();

            if (csv.split('\n').length <= 1) {
                alert('내보낼 결과가 없습니다.');
                return;
            }

            // BOM 추가 (한글 지원)
            const bom = '\uFEFF';
            const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = `marker_design_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        /**
         * 결과를 클립보드에 복사 (탭 구분)
         */
        function copyToClipboard() {
            let text = 'Marker Type\tName\tSequence\tCore\tLength\tTm\tGC%\tProduct\tScore\n';

            currentResults.kasp.forEach((m, idx) => {
                text += `${m.type}\tASP1_FAM\t${m.asp1.sequence}\t${m.asp1.core}\t${m.asp1.length}\t${m.asp1.tm}\t${m.asp1.gc}\t${m.productSize}\t${m.score}\n`;
                text += `${m.type}\tASP2_HEX\t${m.asp2.sequence}\t${m.asp2.core}\t${m.asp2.length}\t${m.asp2.tm}\t${m.asp2.gc}\t\t\n`;
                text += `${m.type}\tCommon\t${m.common.sequence}\t\t${m.common.length}\t${m.common.tm}\t${m.common.gc}\t\t\n`;
            });

            currentResults.taqman.forEach((m, idx) => {
                text += `${m.type}\tForward\t${m.forward.sequence}\t\t${m.forward.length}\t${m.forward.tm}\t${m.forward.gc}\t${m.productSize}\t${m.score}\n`;
                text += `${m.type}\tReverse\t${m.reverse.sequence}\t\t${m.reverse.length}\t${m.reverse.tm}\t${m.reverse.gc}\t\t\n`;
                text += `${m.type}\tProbe_FAM\t${m.probe1.sequence}\t${m.probe1.core}\t${m.probe1.length}\t${m.probe1.tm}\t${m.probe1.gc}\t\t\n`;
                text += `${m.type}\tProbe_VIC\t${m.probe2.sequence}\t${m.probe2.core}\t${m.probe2.length}\t${m.probe2.tm}\t${m.probe2.gc}\t\t\n`;
            });

            currentResults.hrm.forEach((m, idx) => {
                text += `${m.type}\tForward\t${m.forward.sequence}\t\t${m.forward.length}\t${m.forward.tm}\t${m.forward.gc}\t${m.productSize}\t${m.score}\n`;
                text += `${m.type}\tReverse\t${m.reverse.sequence}\t\t${m.reverse.length}\t${m.reverse.tm}\t${m.reverse.gc}\t\t\n`;
            });

            if (text.split('\n').length <= 1) {
                alert('복사할 결과가 없습니다.');
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                alert('클립보드에 복사되었습니다. Excel에 붙여넣기 하세요.');
            }).catch(err => {
                console.error('클립보드 복사 실패:', err);
                alert('클립보드 복사에 실패했습니다.');
            });
        }
    </script>
