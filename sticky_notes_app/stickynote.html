        // 노트에 핀 추가 (1초 롱 프레스)
        function addPinToNote(noteEl) {
            // 기존 핀 제거
            const existingPin = noteEl.querySelector('.note-pin');
            if (existingPin) return;

            const pin = document.createElement('div');
            pin.className = 'note-pin';
            pin.innerHTML = '<img src="assets/pin.png" alt="핀">';

            const notePaper = noteEl.querySelector('.note-paper');
            notePaper.appendChild(pin);

            // 핀 드래그 이벤트
            pin.addEventListener('mousedown', (e) => handlePinDragStart(e, noteEl));
            pin.addEventListener('touchstart', (e) => handlePinDragStart(e, noteEl), { passive: false });

            noteEl.classList.add('show-pin');
        }

        // 핀 드래그 시작
        function handlePinDragStart(e, noteEl) {
            e.preventDefault();
            e.stopPropagation();

            console.log('핀 드래그 시작:', noteEl.dataset.id);
            isDraggingPin = true;
            activePin = noteEl;
            noteEl.classList.add('grouping');

            document.addEventListener('mousemove', handlePinDrag);
            document.addEventListener('mouseup', handlePinDragEnd);
            document.addEventListener('touchmove', handlePinDrag, { passive: false });
            document.addEventListener('touchend', handlePinDragEnd);
        }

        // 핀 드래그 중
        function handlePinDrag(e) {
            if (!isDraggingPin || !activePin) return;
            e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // 임시 연결선 그리기
            drawTempLine(activePin, clientX, clientY);

            // 드래그 중인 위치의 노트 찾기
            const targetNote = document.elementFromPoint(clientX, clientY)?.closest('.sticky-note');
            document.querySelectorAll('.sticky-note').forEach(n => n.classList.remove('group-target'));
            if (targetNote && targetNote !== activePin) {
                targetNote.classList.add('group-target');
            }
        }

        // 핀 드래그 종료
        function handlePinDragEnd(e) {
            if (!isDraggingPin) return;

            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

            // 놓은 위치의 노트 찾기
            const targetNote = document.elementFromPoint(clientX, clientY)?.closest('.sticky-note');

            if (targetNote && targetNote !== activePin) {
                connectNotes(activePin.dataset.id, targetNote.dataset.id);
            }

            // 임시 선 제거
            if (tempConnectionLine) {
                tempConnectionLine.remove();
                tempConnectionLine = null;
            }

            // 클래스 정리
            document.querySelectorAll('.sticky-note').forEach(n => {
                n.classList.remove('grouping', 'group-target');
            });

            isDraggingPin = false;
            activePin = null;

            document.removeEventListener('mousemove', handlePinDrag);
            document.removeEventListener('mouseup', handlePinDragEnd);
            document.removeEventListener('touchmove', handlePinDrag);
            document.removeEventListener('touchend', handlePinDragEnd);
        }

        // 임시 연결선 그리기
        function drawTempLine(fromNote, toX, toY) {
            if (!connectionSvg) return;

            const fromRect = fromNote.getBoundingClientRect();
            const fromCenterX = fromRect.left + fromRect.width / 2;
            const fromCenterY = fromRect.top + fromRect.height / 2;

            if (!tempConnectionLine) {
                tempConnectionLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                tempConnectionLine.setAttribute('class', 'connection-line temp');
                tempConnectionLine.setAttribute('stroke', '#8b4a4a');
                tempConnectionLine.setAttribute('stroke-width', '2');
                tempConnectionLine.setAttribute('fill', 'none');
                connectionSvg.appendChild(tempConnectionLine);
            }

            const d = `M ${fromCenterX} ${fromCenterY} L ${toX} ${toY}`;
            tempConnectionLine.setAttribute('d', d);
        }

        // 두 노트 연결
        function connectNotes(fromId, toId) {
            const fromNote = document.querySelector(`.sticky-note[data-id="${fromId}"]`);
            const toNote = document.querySelector(`.sticky-note[data-id="${toId}"]`);

            if (!fromNote || !toNote) return;

            console.log('노트 연결:', fromId, '->', toId);

            // 이미 연결되어 있는지 확인
            const existingConnection = groupConnections.find(c =>
                (c.from === fromId && c.to === toId) || (c.from === toId && c.to === fromId)
            );

            if (existingConnection) {
                showToast('이미 연결된 노트입니다');
                return;
            }

            // 자기 자신과 연결 방지
            if (fromId === toId) {
                showToast('같은 노트는 연결할 수 없습니다');
                return;
            }

            // 연결 추가
            groupConnections.push({ from: fromId, to: toId, groupId: null });

            // 연결선 그리기
            drawConnection(fromNote, toNote);

            // 그룹 생성 제안
            suggestGroupCreation(fromId, toId);

            saveGroupsToStorage();
        }

        // 연결선 그리기
        function drawConnection(fromNote, toNote) {
            if (!connectionSvg) return;

            const fromRect = fromNote.getBoundingClientRect();
            const toRect = toNote.getBoundingClientRect();

            const fromX = fromRect.left + fromRect.width / 2;
            const fromY = fromRect.top + fromRect.height / 2;
            const toX = toRect.left + toRect.width / 2;
            const toY = toRect.top + toRect.height / 2;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('class', 'connection-line');
            path.setAttribute('d', `M ${fromX} ${fromY} L ${toX} ${toY}`);
            path.dataset.from = fromNote.dataset.id;
            path.dataset.to = toNote.dataset.id;

            connectionSvg.appendChild(path);
        }

        // 모든 연결선 다시 그리기
        function redrawAllConnections() {
            if (!connectionSvg) return;

            // 기존 연결선 제거
            connectionSvg.querySelectorAll('.connection-line').forEach(line => line.remove());

            // 연결선 다시 그리기
            groupConnections.forEach(conn => {
                const fromNote = document.querySelector(`.sticky-note[data-id="${conn.from}"]`);
                const toNote = document.querySelector(`.sticky-note[data-id="${conn.to}"]`);
                if (fromNote && toNote) {
                    drawConnection(fromNote, toNote);
                }
            });
        }

        // 그룹 생성 제안
        function suggestGroupCreation(fromId, toId) {
            // 연결된 노트들 찾기
            const connectedNotes = findConnectedNotes(fromId);

            if (connectedNotes.length >= 2) {
                const createGroup = confirm(`${connectedNotes.length}개의 노트가 연결되었습니다.\n그룹으로 만드시겠습니까?`);

                if (createGroup) {
                    const groupName = prompt('그룹 이름을 입력하세요:', '새 그룹');
                    if (groupName) {
                        createGroupFromNotes(groupName, connectedNotes);
                    }
                }
            }
        }

        // 연결된 모든 노트 찾기 (BFS)
        function findConnectedNotes(startId) {
            const visited = new Set();
            const queue = [startId];

            while (queue.length > 0) {
                const currentId = queue.shift();
                visited.add(currentId);

                // 이 노트와 연결된 다른 노트들 찾기
                groupConnections.forEach(conn => {
                    if (conn.from === currentId && !visited.has(conn.to)) {
                        queue.push(conn.to);
                    }
                    if (conn.to === currentId && !visited.has(conn.from)) {
                        queue.push(conn.from);
                    }
                });
            }

            return Array.from(visited);
        }

        // 노트들로 그룹 생성
        function createGroupFromNotes(name, noteIds) {
            const groupId = 'group_' + Date.now();
            const newGroup = {
                id: groupId,
                name: name,
                noteIds: noteIds,
                collapsed: false
            };

            noteGroups.push(newGroup);

            // 연결들에 그룹 ID 할당
            groupConnections.forEach(conn => {
                if (noteIds.includes(conn.from) && noteIds.includes(conn.to)) {
                    conn.groupId = groupId;
                }
            });

            console.log('그룹 생성됨:', newGroup);
            showToast(`"${name}" 그룹이 생성되었습니다`);

            saveGroupsToStorage();
            renderGroupList();
        }

        // 빈 그룹 생성
        function createEmptyGroup() {
            const groupName = prompt('그룹 이름을 입력하세요:', '새 그룹');
            if (!groupName) return;

            const groupId = 'group_' + Date.now();
            const newGroup = {
                id: groupId,
                name: groupName,
                noteIds: [],
                collapsed: false
            };

            noteGroups.push(newGroup);
            console.log('빈 그룹 생성됨:', newGroup);
            showToast(`"${groupName}" 그룹이 생성되었습니다`);

            saveGroupsToStorage();
            renderGroupList();
        }

        // 그룹 목록 렌더링
        function renderGroupList() {
            const groupsList = document.getElementById('groupsList');
            if (!groupsList) return;

            groupsList.innerHTML = '';

            if (noteGroups.length === 0) {
                groupsList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px; font-size: 13px;">생성된 그룹이 없습니다</p>';
                return;
            }

            noteGroups.forEach(group => {
                const groupItem = document.createElement('div');
                groupItem.className = 'group-item';
                groupItem.innerHTML = `
                    <img src="assets/folder.png" alt="그룹">
                    <span class="group-item-name">${group.name}</span>
                    <span class="group-item-count">${group.noteIds.length}</span>
                    <button class="group-item-delete" data-group-id="${group.id}">×</button>
                `;

                // 그룹 클릭 시 해당 노트들로 이동
                groupItem.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('group-item-delete')) {
                        focusGroupNotes(group.noteIds);
                    }
                });

                // 삭제 버튼
                const deleteBtn = groupItem.querySelector('.group-item-delete');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteGroup(group.id);
                });

                groupsList.appendChild(groupItem);
            });
        }

        // 그룹 노트들에 포커스
        function focusGroupNotes(noteIds) {
            if (noteIds.length === 0) return;

            // 첫 번째 노트로 스크롤
            const firstNote = document.querySelector(`.sticky-note[data-id="${noteIds[0]}"]`);
            if (firstNote) {
                firstNote.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 그룹 삭제
        function deleteGroup(groupId) {
            if (!confirm('이 그룹을 삭제하시겠습니까?\n(노트는 삭제되지 않습니다)')) return;

            // 그룹 제거
            noteGroups = noteGroups.filter(g => g.id !== groupId);

            // 연결들의 그룹 ID 제거
            groupConnections.forEach(conn => {
                if (conn.groupId === groupId) {
                    conn.groupId = null;
                }
            });

            saveGroupsToStorage();
            renderGroupList();
            showToast('그룹이 삭제되었습니다');
        }

        // 로컬스토리지에 그룹 데이터 저장
        function saveGroupsToStorage() {
            localStorage.setItem('sticky_notes_groups', JSON.stringify(noteGroups));
            localStorage.setItem('sticky_notes_connections', JSON.stringify(groupConnections));
        }

        // 로컬스토리지에서 그룹 데이터 로드
        function loadGroupsFromStorage() {
            try {
                const savedGroups = localStorage.getItem('sticky_notes_groups');
                const savedConnections = localStorage.getItem('sticky_notes_connections');

                if (savedGroups) {
                    noteGroups = JSON.parse(savedGroups);
                }
                if (savedConnections) {
                    groupConnections = JSON.parse(savedConnections);
                }

                console.log('그룹 데이터 로드됨:', noteGroups.length, '개 그룹,', groupConnections.length, '개 연결');
            } catch (e) {
                console.error('그룹 데이터 로드 실패:', e);
            }
        }

        // ============================================
        // 프로필 및 도움말 버튼
        // ============================================
        const profileBtn = document.getElementById('profileBtn');
        const helpBtn = document.getElementById('helpBtn');

        if (profileBtn) {
            profileBtn.addEventListener('click', () => {
                userMenu.classList.remove('show');
                alert('프로필 설정은 추후 업데이트 예정입니다.\n\n현재 사용자 정보:\n' +
                      '이름: ' + (currentUser?.user_metadata?.display_name || '게스트') + '\n' +
                      '소속: ' + (currentUser?.user_metadata?.organization || '-'));
            });
        }

        if (helpBtn) {
            helpBtn.addEventListener('click', () => {
                userMenu.classList.remove('show');
                alert('스티키 노트 사용법\n\n' +
                      '1. + 버튼으로 새 메모 추가\n' +
                      '2. 메모를 1초간 길게 눌러 핀 표시\n' +
                      '3. 핀을 드래그하여 다른 메모와 연결\n' +
                      '4. 그룹 버튼(📁)으로 그룹 관리\n' +
                      '5. 메모를 드래그하여 이동\n' +
                      '6. 우측 하단 핸들로 크기 조절');
            });
        }

        // 초기화
        init();
    </script>
