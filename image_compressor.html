<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이미지 크기 조절기 - Image Resizer</title>
    <link rel="icon" type="image/x-icon" href="ssallogo.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            /* 표준 색상 (DESIGN_SYSTEM.md 기반) */
            --primary-dark: #0c3026;
            --primary-main: #017f97;
            --primary-light: #e8f4f8;
            --accent: #00a1b8;

            /* 배경 */
            --bg-page: #cce3dd;
            --bg-card: #ffffff;

            /* 텍스트 */
            --text-primary: #212529;
            --text-secondary: #6c757d;

            /* 테두리 */
            --border-default: #dee2e6;

            /* 상태 색상 */
            --success: #28a745;
            --warning: #ffc107;
            --error: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: #0c3026;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        header p {
            color: #017f97;
            font-size: 1rem;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .upload-area {
            border: 3px dashed #54b7c6;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #cce3dd;
        }

        .upload-area:hover,
        .upload-area.dragover {
            background: #b2d9d8;
            border-color: #017f97;
            transform: scale(1.01);
        }

        .upload-area .icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .upload-area h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .upload-area p {
            color: #666;
            font-size: 0.9rem;
        }

        .upload-btn {
            display: inline-block;
            background: linear-gradient(135deg, #0c3026 0%, #017f97 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            margin-top: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(1, 127, 151, 0.4);
        }

        #fileInput {
            display: none;
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .setting-item {
            background: #cce3dd;
            padding: 15px;
            border-radius: 12px;
        }

        .setting-item label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .setting-item input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0c3026 0%, #017f97 100%);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .setting-item select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        .setting-item .value {
            text-align: center;
            color: #017f97;
            font-weight: 700;
            font-size: 1.2rem;
            margin-top: 8px;
        }

        .image-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .image-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #cce3dd;
            border-radius: 12px;
            margin-bottom: 10px;
            gap: 15px;
        }

        .image-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .image-info {
            flex: 1;
            min-width: 0;
        }

        .image-info .name {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
        }

        .image-info .size {
            font-size: 0.8rem;
            color: #666;
            margin-top: 4px;
        }

        .image-info .size .original {
            text-decoration: line-through;
            color: #999;
        }

        .image-info .size .compressed {
            color: #4CAF50;
            font-weight: 600;
        }

        .image-info .size .ratio {
            color: #017f97;
            font-weight: 600;
        }

        .image-item .remove-btn {
            background: #ff5252;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .image-item .download-btn {
            background: #4CAF50;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0c3026 0%, #017f97 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(1, 127, 151, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00a1b8 0%, #54b7c6 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 161, 184, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #0c3026 0%, #333 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(12, 48, 38, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #cce3dd;
            border-radius: 12px;
        }

        .stat-item .label {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
        }

        .stat-item .value.green {
            color: #4CAF50;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(135deg, #0c3026 0%, #017f97 100%);
            transition: width 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            color: #017f97;
            margin-top: 30px;
            font-size: 0.9rem;
        }

        /* 모바일 반응형 */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 15px;
                border-radius: 15px;
            }

            .upload-area {
                padding: 30px 15px;
            }

            .upload-area .icon {
                font-size: 3rem;
            }

            .settings {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .image-item {
                flex-wrap: wrap;
            }

            .image-item img {
                width: 50px;
                height: 50px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* 스크롤바 스타일 */
        .image-list::-webkit-scrollbar {
            width: 8px;
        }

        .image-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .image-list::-webkit-scrollbar-thumb {
            background: #017f97;
            border-radius: 4px;
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-item {
            animation: fadeIn 0.3s ease;
        }

        .processing {
            position: relative;
            overflow: hidden;
        }

        .processing::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📸 이미지 크기 조절기</h1>
            <p>이미지 크기와 용량을 쉽고 빠르게 조절하세요</p>
        </header>

        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="icon">📁</div>
                <h3>이미지를 드래그하거나 클릭하세요</h3>
                <p>JPG, PNG, WEBP 지원 | 여러 파일 동시 선택 가능</p>
                <div class="upload-btn">파일 선택</div>
            </div>
            <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp">
        </div>

        <div class="card">
            <h3 style="margin-bottom: 15px; color: #333;">⚙️ 압축 설정</h3>
            <div class="settings">
                <div class="setting-item">
                    <label>압축 품질</label>
                    <input type="range" id="quality" min="10" max="100" value="70">
                    <div class="value" id="qualityValue">70%</div>
                </div>
                <div class="setting-item">
                    <label>최대 너비 (px)</label>
                    <input type="range" id="maxWidth" min="100" max="4000" value="1920" step="100">
                    <div class="value" id="maxWidthValue">1920px</div>
                </div>
                <div class="setting-item">
                    <label>출력 형식</label>
                    <select id="outputFormat">
                        <option value="jpeg">JPEG (권장)</option>
                        <option value="png">PNG</option>
                        <option value="webp">WebP (최신)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card" id="resultsCard" style="display: none;">
            <h3 style="margin-bottom: 15px; color: #333;">📊 압축 결과</h3>

            <div class="stats">
                <div class="stat-item">
                    <div class="label">총 파일 수</div>
                    <div class="value" id="totalFiles">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">원본 크기</div>
                    <div class="value" id="originalSize">0 MB</div>
                </div>
                <div class="stat-item">
                    <div class="label">압축 후 크기</div>
                    <div class="value green" id="compressedSize">0 MB</div>
                </div>
            </div>

            <div class="progress-bar" id="progressBar">
                <div class="fill" id="progressFill"></div>
            </div>

            <div class="image-list" id="imageList">
                <div class="empty-state">
                    <div class="icon">🖼️</div>
                    <p>이미지를 업로드하면 여기에 표시됩니다</p>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="compressBtn" disabled>
                    <span>🗜️</span> 압축 시작
                </button>
                <button class="btn btn-success" id="downloadZipBtn" disabled>
                    <span>📦</span> ZIP 다운로드
                </button>
                <button class="btn btn-success" id="downloadFolderBtn" disabled style="display: none;">
                    <span>📁</span> 폴더에 저장
                </button>
                <button class="btn btn-danger" id="clearAllBtn" disabled>
                    <span>🗑️</span> 전체 삭제
                </button>
            </div>
        </div>

        <footer>
            <p>모든 처리는 브라우저에서 진행됩니다. 서버에 업로드되지 않습니다.</p>
        </footer>
    </div>

    <script>
        // 상태 관리
        let images = [];
        let compressedImages = [];

        // DOM 요소
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const quality = document.getElementById('quality');
        const qualityValue = document.getElementById('qualityValue');
        const maxWidth = document.getElementById('maxWidth');
        const maxWidthValue = document.getElementById('maxWidthValue');
        const outputFormat = document.getElementById('outputFormat');
        const resultsCard = document.getElementById('resultsCard');
        const imageList = document.getElementById('imageList');
        const compressBtn = document.getElementById('compressBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const downloadFolderBtn = document.getElementById('downloadFolderBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');

        // File System Access API 지원 확인
        if ('showDirectoryPicker' in window) {
            downloadFolderBtn.style.display = 'inline-flex';
        }
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        // 파일 크기 포맷
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 압축률 계산
        function calculateRatio(original, compressed) {
            const ratio = ((original - compressed) / original * 100).toFixed(1);
            return ratio > 0 ? `-${ratio}%` : `+${Math.abs(ratio)}%`;
        }

        // 업로드 영역 이벤트
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // 설정 슬라이더 이벤트
        quality.addEventListener('input', () => {
            qualityValue.textContent = quality.value + '%';
        });

        maxWidth.addEventListener('input', () => {
            maxWidthValue.textContent = maxWidth.value + 'px';
        });

        // 파일 처리
        function handleFiles(files) {
            const validFiles = Array.from(files).filter(file =>
                file.type.match(/image\/(jpeg|png|webp)/)
            );

            if (validFiles.length === 0) {
                alert('지원하지 않는 파일 형식입니다.\nJPG, PNG, WEBP 파일만 업로드 가능합니다.');
                return;
            }

            validFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    images.push({
                        id: Date.now() + Math.random(),
                        name: file.name,
                        originalSize: file.size,
                        dataUrl: e.target.result,
                        compressed: null,
                        compressedSize: 0
                    });
                    updateUI();
                };
                reader.readAsDataURL(file);
            });
        }

        // UI 업데이트
        function updateUI() {
            resultsCard.style.display = images.length > 0 ? 'block' : 'none';

            // 통계 업데이트
            document.getElementById('totalFiles').textContent = images.length;
            const totalOriginal = images.reduce((sum, img) => sum + img.originalSize, 0);
            const totalCompressed = images.reduce((sum, img) => sum + img.compressedSize, 0);
            document.getElementById('originalSize').textContent = formatSize(totalOriginal);
            document.getElementById('compressedSize').textContent = formatSize(totalCompressed);

            // 버튼 상태
            compressBtn.disabled = images.length === 0;
            const hasCompressed = images.some(img => img.compressed);
            downloadZipBtn.disabled = !hasCompressed;
            downloadFolderBtn.disabled = !hasCompressed;
            clearAllBtn.disabled = images.length === 0;

            // 이미지 리스트 렌더링
            if (images.length === 0) {
                imageList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🖼️</div>
                        <p>이미지를 업로드하면 여기에 표시됩니다</p>
                    </div>
                `;
                return;
            }

            imageList.innerHTML = images.map(img => `
                <div class="image-item" data-id="${img.id}">
                    <img src="${img.compressed || img.dataUrl}" alt="${img.name}">
                    <div class="image-info">
                        <div class="name">${img.name}</div>
                        <div class="size">
                            <span class="${img.compressed ? 'original' : ''}">${formatSize(img.originalSize)}</span>
                            ${img.compressed ? `
                                → <span class="compressed">${formatSize(img.compressedSize)}</span>
                                <span class="ratio">(${calculateRatio(img.originalSize, img.compressedSize)})</span>
                            ` : ''}
                        </div>
                    </div>
                    ${img.compressed ? `
                        <button class="download-btn" onclick="downloadSingle('${img.id}')">⬇</button>
                    ` : ''}
                    <button class="remove-btn" onclick="removeImage('${img.id}')">×</button>
                </div>
            `).join('');
        }

        // 이미지 삭제
        window.removeImage = function(id) {
            images = images.filter(img => img.id != id);
            updateUI();
        };

        // 개별 다운로드
        window.downloadSingle = function(id) {
            const img = images.find(i => i.id == id);
            if (img && img.compressed) {
                downloadImage(img.compressed, img.name);
            }
        };

        // 이미지 압축
        async function compressImage(imageData, quality, maxWidth, format) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    // 최대 너비 조정
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);

                    const mimeType = `image/${format}`;
                    const dataUrl = canvas.toDataURL(mimeType, quality / 100);

                    resolve(dataUrl);
                };
                img.src = imageData;
            });
        }

        // 압축 시작
        compressBtn.addEventListener('click', async () => {
            const qualityVal = parseInt(quality.value);
            const maxWidthVal = parseInt(maxWidth.value);
            const format = outputFormat.value;

            progressBar.classList.add('show');
            compressBtn.disabled = true;
            compressBtn.innerHTML = '<span>⏳</span> 압축 중...';

            for (let i = 0; i < images.length; i++) {
                const img = images[i];
                const compressed = await compressImage(img.dataUrl, qualityVal, maxWidthVal, format);

                // Base64를 Blob으로 변환하여 크기 계산
                const base64Data = compressed.split(',')[1];
                const compressedSize = Math.round((base64Data.length * 3) / 4);

                img.compressed = compressed;
                img.compressedSize = compressedSize;

                // 확장자 업데이트
                const ext = format === 'jpeg' ? 'jpg' : format;
                img.name = img.name.replace(/\.[^.]+$/, `.${ext}`);

                // 진행률 업데이트
                const progress = ((i + 1) / images.length) * 100;
                progressFill.style.width = progress + '%';

                updateUI();
            }

            progressBar.classList.remove('show');
            compressBtn.disabled = false;
            compressBtn.innerHTML = '<span>🗜️</span> 압축 시작';
        });

        // 날짜/시간 폴더명 생성
        function getDateTimeFolderName() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `compressed_${year}${month}${day}_${hours}${minutes}${seconds}`;
        }

        // Base64를 Blob으로 변환
        function dataUrlToBlob(dataUrl) {
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        // ZIP 다운로드
        downloadZipBtn.addEventListener('click', async () => {
            const compressedImages = images.filter(img => img.compressed);
            if (compressedImages.length === 0) return;

            downloadZipBtn.disabled = true;
            downloadZipBtn.innerHTML = '<span>⏳</span> ZIP 생성 중...';

            try {
                const zip = new JSZip();
                const folderName = getDateTimeFolderName();
                const folder = zip.folder(folderName);

                compressedImages.forEach(img => {
                    const blob = dataUrlToBlob(img.compressed);
                    folder.file(img.name, blob);
                });

                const content = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `${folderName}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            } catch (error) {
                alert('ZIP 파일 생성 중 오류가 발생했습니다.');
                console.error(error);
            }

            downloadZipBtn.disabled = false;
            downloadZipBtn.innerHTML = '<span>📦</span> ZIP 다운로드';
        });

        // 폴더에 저장 (File System Access API)
        downloadFolderBtn.addEventListener('click', async () => {
            const compressedImages = images.filter(img => img.compressed);
            if (compressedImages.length === 0) return;

            try {
                // 폴더 선택
                const dirHandle = await window.showDirectoryPicker();
                const folderName = getDateTimeFolderName();
                const subDirHandle = await dirHandle.getDirectoryHandle(folderName, { create: true });

                downloadFolderBtn.disabled = true;
                downloadFolderBtn.innerHTML = '<span>⏳</span> 저장 중...';

                for (const img of compressedImages) {
                    const blob = dataUrlToBlob(img.compressed);
                    const fileHandle = await subDirHandle.getFileHandle(img.name, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                }

                alert(`${compressedImages.length}개 파일이 "${folderName}" 폴더에 저장되었습니다.`);
            } catch (error) {
                if (error.name !== 'AbortError') {
                    alert('폴더 저장 중 오류가 발생했습니다.');
                    console.error(error);
                }
            }

            downloadFolderBtn.disabled = false;
            downloadFolderBtn.innerHTML = '<span>📁</span> 폴더에 저장';
        });

        // 파일 다운로드 헬퍼
        function downloadImage(dataUrl, filename) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 전체 삭제
        clearAllBtn.addEventListener('click', () => {
            if (confirm('모든 이미지를 삭제하시겠습니까?')) {
                images = [];
                updateUI();
            }
        });

        // 페이지 나가기 경고
        window.addEventListener('beforeunload', (e) => {
            if (images.length > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
