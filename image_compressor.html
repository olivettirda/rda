<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이미지 변환기 - Image Converter</title>
    <link rel="icon" type="image/png" href="files/ssallogo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/psd.js@3.4.0/dist/psd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: #cce3dd;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: #0c3026;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        header p {
            color: #017f97;
            font-size: 1rem;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .card-title {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-area {
            border: 3px dashed #54b7c6;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #cce3dd;
        }

        .upload-area:hover,
        .upload-area.dragover {
            background: #b2d9d8;
            border-color: #017f97;
            transform: scale(1.01);
        }

        .upload-area .icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .upload-area h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .upload-area p {
            color: #666;
            font-size: 0.9rem;
        }

        .format-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }

        .format-tag {
            background: rgba(1, 127, 151, 0.15);
            color: #017f97;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .upload-btn {
            display: inline-block;
            background: linear-gradient(135deg, #0c3026 0%, #017f97 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            margin-top: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(1, 127, 151, 0.4);
        }

        #fileInput {
            display: none;
        }

        /* 탭 네비게이션 */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            background: #cce3dd;
            padding: 5px;
            border-radius: 12px;
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #017f97;
        }

        .tab.active {
            background: white;
            color: #017f97;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .setting-item {
            background: #cce3dd;
            padding: 15px;
            border-radius: 12px;
        }

        .setting-item label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .setting-item input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0c3026 0%, #017f97 100%);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .setting-item select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        .setting-item .value {
            text-align: center;
            color: #017f97;
            font-weight: 700;
            font-size: 1.2rem;
            margin-top: 8px;
        }

        /* ICO 사이즈 선택 */
        .ico-sizes {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            padding: 15px;
            background: #f0f7f5;
            border-radius: 10px;
        }

        .ico-sizes.show {
            display: flex;
        }

        .ico-sizes label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            border: 2px solid #e0e0e0;
            transition: all 0.2s;
        }

        .ico-sizes label:hover {
            border-color: #017f97;
        }

        .ico-sizes input:checked + span {
            color: #017f97;
            font-weight: 600;
        }

        .ico-sizes label:has(input:checked) {
            border-color: #017f97;
            background: #e8f4f8;
        }

        .ico-sizes input {
            accent-color: #017f97;
        }

        /* 투명 여백 옵션 */
        .padding-option {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f0f7f5;
            border-radius: 10px;
        }

        .padding-option.show {
            display: block;
        }

        .padding-option label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .padding-option input {
            accent-color: #017f97;
            width: 18px;
            height: 18px;
        }

        .image-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .image-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #cce3dd;
            border-radius: 12px;
            margin-bottom: 10px;
            gap: 15px;
        }

        .image-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 8px;
            background: repeating-conic-gradient(#ccc 0% 25%, white 0% 50%) 50% / 10px 10px;
        }

        .image-info {
            flex: 1;
            min-width: 0;
        }

        .image-info .name {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
        }

        .image-info .size {
            font-size: 0.8rem;
            color: #666;
            margin-top: 4px;
        }

        .image-info .size .original {
            text-decoration: line-through;
            color: #999;
        }

        .image-info .size .compressed {
            color: #4CAF50;
            font-weight: 600;
        }

        .image-info .size .ratio {
            color: #017f97;
            font-weight: 600;
        }

        .image-info .dimensions {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }

        .image-item .remove-btn {
            background: #ff5252;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .image-item .download-btn {
            background: #4CAF50;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0c3026 0%, #017f97 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(1, 127, 151, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00a1b8 0%, #54b7c6 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 161, 184, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #0c3026 0%, #333 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(12, 48, 38, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #cce3dd;
            border-radius: 12px;
        }

        .stat-item .label {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
        }

        .stat-item .value.green {
            color: #4CAF50;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(135deg, #0c3026 0%, #017f97 100%);
            transition: width 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            color: #017f97;
            margin-top: 30px;
            font-size: 0.9rem;
        }

        /* 모바일 반응형 */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 15px;
                border-radius: 15px;
            }

            .upload-area {
                padding: 30px 15px;
            }

            .upload-area .icon {
                font-size: 3rem;
            }

            .settings {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .image-item {
                flex-wrap: wrap;
            }

            .image-item img {
                width: 50px;
                height: 50px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .tabs {
                flex-direction: column;
            }
        }

        /* 스크롤바 스타일 */
        .image-list::-webkit-scrollbar {
            width: 8px;
        }

        .image-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .image-list::-webkit-scrollbar-thumb {
            background: #017f97;
            border-radius: 4px;
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-item {
            animation: fadeIn 0.3s ease;
        }

        .processing {
            position: relative;
            overflow: hidden;
        }

        .processing::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% { left: 100%; }
        }

        /* 알림 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.error {
            background: #dc3545;
        }

        .toast.success {
            background: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖼️ 이미지 변환기</h1>
            <p>이미지 포맷 변환, 크기 조절, ICO 생성을 한 번에</p>
        </header>

        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="icon">📁</div>
                <h3>이미지를 드래그하거나 클릭하세요</h3>
                <p>여러 파일 동시 선택 가능</p>
                <div class="format-tags">
                    <span class="format-tag">JPG</span>
                    <span class="format-tag">PNG</span>
                    <span class="format-tag">WEBP</span>
                    <span class="format-tag">GIF</span>
                    <span class="format-tag">BMP</span>
                    <span class="format-tag">SVG</span>
                    <span class="format-tag">PSD</span>
                    <span class="format-tag">ICO</span>
                    <span class="format-tag">TIFF</span>
                </div>
                <div class="upload-btn">파일 선택</div>
            </div>
            <input type="file" id="fileInput" multiple accept="image/*,.psd,.ai,.svg">
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" data-tab="resize">📐 크기/압축</button>
                <button class="tab" data-tab="convert">🔄 포맷 변환</button>
                <button class="tab" data-tab="ico">⭐ ICO 생성</button>
            </div>

            <!-- 크기/압축 탭 -->
            <div class="tab-content active" id="resize-tab">
                <div class="settings">
                    <div class="setting-item">
                        <label>압축 품질</label>
                        <input type="range" id="quality" min="10" max="100" value="85">
                        <div class="value" id="qualityValue">85%</div>
                    </div>
                    <div class="setting-item">
                        <label>최대 너비 (px)</label>
                        <input type="range" id="maxWidth" min="100" max="4000" value="1920" step="100">
                        <div class="value" id="maxWidthValue">1920px</div>
                    </div>
                    <div class="setting-item">
                        <label>출력 형식</label>
                        <select id="outputFormat">
                            <option value="original">원본 유지</option>
                            <option value="jpeg">JPEG</option>
                            <option value="png">PNG</option>
                            <option value="webp">WebP</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 포맷 변환 탭 -->
            <div class="tab-content" id="convert-tab">
                <div class="settings">
                    <div class="setting-item">
                        <label>변환할 포맷</label>
                        <select id="convertFormat">
                            <option value="jpeg">JPEG (.jpg)</option>
                            <option value="png">PNG (.png)</option>
                            <option value="webp">WebP (.webp)</option>
                            <option value="gif">GIF (.gif)</option>
                            <option value="bmp">BMP (.bmp)</option>
                            <option value="ico">ICO (.ico) - 단일 사이즈</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>품질 (JPEG/WebP)</label>
                        <input type="range" id="convertQuality" min="10" max="100" value="90">
                        <div class="value" id="convertQualityValue">90%</div>
                    </div>
                </div>
            </div>

            <!-- ICO 생성 탭 -->
            <div class="tab-content" id="ico-tab">
                <div class="settings">
                    <div class="setting-item" style="grid-column: 1 / -1;">
                        <label>ICO 사이즈 선택 (다중 선택 가능)</label>
                        <div class="ico-sizes show" style="display: flex;">
                            <label><input type="checkbox" name="icoSize" value="16" checked><span>16×16 (파비콘)</span></label>
                            <label><input type="checkbox" name="icoSize" value="32" checked><span>32×32 (파비콘)</span></label>
                            <label><input type="checkbox" name="icoSize" value="48" checked><span>48×48</span></label>
                            <label><input type="checkbox" name="icoSize" value="64"><span>64×64</span></label>
                            <label><input type="checkbox" name="icoSize" value="128"><span>128×128</span></label>
                            <label><input type="checkbox" name="icoSize" value="256"><span>256×256</span></label>
                        </div>
                    </div>
                </div>
                <div class="padding-option show" style="display: block;">
                    <label>
                        <input type="checkbox" id="addPadding" checked>
                        <span>비율이 1:1이 아닌 이미지에 투명 여백 추가 (정사각형으로 만들기)</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="card" id="resultsCard" style="display: none;">
            <h3 class="card-title">📊 처리 결과</h3>

            <div class="stats">
                <div class="stat-item">
                    <div class="label">총 파일 수</div>
                    <div class="value" id="totalFiles">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">원본 크기</div>
                    <div class="value" id="originalSize">0 MB</div>
                </div>
                <div class="stat-item">
                    <div class="label">변환 후 크기</div>
                    <div class="value green" id="compressedSize">0 MB</div>
                </div>
            </div>

            <div class="progress-bar" id="progressBar">
                <div class="fill" id="progressFill"></div>
            </div>

            <div class="image-list" id="imageList">
                <div class="empty-state">
                    <div class="icon">🖼️</div>
                    <p>이미지를 업로드하면 여기에 표시됩니다</p>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="processBtn" disabled>
                    <span>⚡</span> 변환 시작
                </button>
                <button class="btn btn-success" id="downloadZipBtn" disabled>
                    <span>📦</span> ZIP 다운로드
                </button>
                <button class="btn btn-success" id="downloadFolderBtn" disabled style="display: none;">
                    <span>📁</span> 폴더에 저장
                </button>
                <button class="btn btn-danger" id="clearAllBtn" disabled>
                    <span>🗑️</span> 전체 삭제
                </button>
            </div>
        </div>

        <footer>
            <p>모든 처리는 브라우저에서 진행됩니다. 서버에 업로드되지 않습니다.</p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 상태 관리
        let images = [];
        let currentTab = 'resize';

        // DOM 요소
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const quality = document.getElementById('quality');
        const qualityValue = document.getElementById('qualityValue');
        const maxWidth = document.getElementById('maxWidth');
        const maxWidthValue = document.getElementById('maxWidthValue');
        const outputFormat = document.getElementById('outputFormat');
        const convertFormat = document.getElementById('convertFormat');
        const convertQuality = document.getElementById('convertQuality');
        const convertQualityValue = document.getElementById('convertQualityValue');
        const resultsCard = document.getElementById('resultsCard');
        const imageList = document.getElementById('imageList');
        const processBtn = document.getElementById('processBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const downloadFolderBtn = document.getElementById('downloadFolderBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const addPadding = document.getElementById('addPadding');

        // File System Access API 지원 확인
        if ('showDirectoryPicker' in window) {
            downloadFolderBtn.style.display = 'inline-flex';
        }

        // 토스트 알림
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 파일 크기 포맷
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 압축률 계산
        function calculateRatio(original, compressed) {
            if (original === 0) return '0%';
            const ratio = ((original - compressed) / original * 100).toFixed(1);
            return ratio > 0 ? `-${ratio}%` : `+${Math.abs(ratio)}%`;
        }

        // 탭 전환
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                document.getElementById(currentTab + '-tab').classList.add('active');
                console.log('탭 전환:', currentTab);
            });
        });

        // 업로드 영역 이벤트
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // 설정 슬라이더 이벤트
        quality.addEventListener('input', () => {
            qualityValue.textContent = quality.value + '%';
        });

        maxWidth.addEventListener('input', () => {
            maxWidthValue.textContent = maxWidth.value + 'px';
        });

        convertQuality.addEventListener('input', () => {
            convertQualityValue.textContent = convertQuality.value + '%';
        });

        // PSD 파일 처리
        async function handlePSD(file) {
            console.log('PSD 파일 처리 시작:', file.name);
            try {
                const arrayBuffer = await file.arrayBuffer();
                const psd = await PSD.fromDroppedFile(file);
                await psd.parse();
                const png = psd.image.toPng();
                console.log('PSD 파싱 완료');
                return png.src;
            } catch (error) {
                console.error('PSD 파싱 에러:', error);
                showToast('PSD 파일 처리 실패: ' + file.name, 'error');
                return null;
            }
        }

        // SVG 파일 처리
        async function handleSVG(file) {
            console.log('SVG 파일 처리 시작:', file.name);
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const svgText = e.target.result;
                    const blob = new Blob([svgText], { type: 'image/svg+xml' });
                    const url = URL.createObjectURL(blob);

                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        // SVG 크기 추출 또는 기본값
                        let width = img.width || 1000;
                        let height = img.height || 1000;

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = () => {
                        console.error('SVG 렌더링 실패');
                        resolve(null);
                    };
                    img.src = url;
                };
                reader.readAsText(file);
            });
        }

        // ICO 파일 처리 (첫 번째 이미지만 추출)
        async function handleICO(file) {
            console.log('ICO 파일 처리 시작:', file.name);
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = () => resolve(null);
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 파일 처리
        async function handleFiles(files) {
            console.log('파일 처리 시작:', files.length, '개');
            const validExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp', '.svg', '.psd', '.ico', '.tiff', '.tif'];

            for (const file of files) {
                const ext = '.' + file.name.split('.').pop().toLowerCase();
                const isValid = validExtensions.includes(ext) || file.type.startsWith('image/');

                if (!isValid) {
                    console.log('지원하지 않는 형식:', file.name);
                    showToast(`지원하지 않는 형식: ${file.name}`, 'error');
                    continue;
                }

                let dataUrl = null;
                let width = 0, height = 0;

                // PSD 파일 처리
                if (ext === '.psd') {
                    dataUrl = await handlePSD(file);
                }
                // SVG 파일 처리
                else if (ext === '.svg') {
                    dataUrl = await handleSVG(file);
                }
                // ICO 파일 처리
                else if (ext === '.ico') {
                    dataUrl = await handleICO(file);
                }
                // 일반 이미지 처리
                else {
                    dataUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                if (!dataUrl) continue;

                // 이미지 크기 가져오기
                const dimensions = await new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve({ width: img.width, height: img.height });
                    img.onerror = () => resolve({ width: 0, height: 0 });
                    img.src = dataUrl;
                });

                images.push({
                    id: Date.now() + Math.random(),
                    name: file.name,
                    originalSize: file.size,
                    dataUrl: dataUrl,
                    width: dimensions.width,
                    height: dimensions.height,
                    processed: null,
                    processedSize: 0,
                    processedName: null
                });

                console.log('이미지 추가:', file.name, dimensions.width + 'x' + dimensions.height);
                updateUI();
            }
        }

        // UI 업데이트
        function updateUI() {
            resultsCard.style.display = images.length > 0 ? 'block' : 'none';

            // 통계 업데이트
            document.getElementById('totalFiles').textContent = images.length;
            const totalOriginal = images.reduce((sum, img) => sum + img.originalSize, 0);
            const totalProcessed = images.reduce((sum, img) => sum + img.processedSize, 0);
            document.getElementById('originalSize').textContent = formatSize(totalOriginal);
            document.getElementById('compressedSize').textContent = formatSize(totalProcessed);

            // 버튼 상태
            processBtn.disabled = images.length === 0;
            const hasProcessed = images.some(img => img.processed);
            downloadZipBtn.disabled = !hasProcessed;
            downloadFolderBtn.disabled = !hasProcessed;
            clearAllBtn.disabled = images.length === 0;

            // 이미지 리스트 렌더링
            if (images.length === 0) {
                imageList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🖼️</div>
                        <p>이미지를 업로드하면 여기에 표시됩니다</p>
                    </div>
                `;
                return;
            }

            imageList.innerHTML = images.map(img => `
                <div class="image-item" data-id="${img.id}">
                    <img src="${img.processed || img.dataUrl}" alt="${img.name}">
                    <div class="image-info">
                        <div class="name">${img.processedName || img.name}</div>
                        <div class="dimensions">${img.width} × ${img.height}px</div>
                        <div class="size">
                            <span class="${img.processed ? 'original' : ''}">${formatSize(img.originalSize)}</span>
                            ${img.processed ? `
                                → <span class="compressed">${formatSize(img.processedSize)}</span>
                                <span class="ratio">(${calculateRatio(img.originalSize, img.processedSize)})</span>
                            ` : ''}
                        </div>
                    </div>
                    ${img.processed ? `
                        <button class="download-btn" onclick="downloadSingle('${img.id}')">⬇</button>
                    ` : ''}
                    <button class="remove-btn" onclick="removeImage('${img.id}')">×</button>
                </div>
            `).join('');
        }

        // 이미지 삭제
        window.removeImage = function(id) {
            images = images.filter(img => img.id != id);
            updateUI();
        };

        // 개별 다운로드
        window.downloadSingle = function(id) {
            const img = images.find(i => i.id == id);
            if (img && img.processed) {
                if (img.processedBlob) {
                    // ICO 등 Blob 데이터
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(img.processedBlob);
                    link.download = img.processedName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                } else {
                    downloadImage(img.processed, img.processedName);
                }
            }
        };

        // 이미지를 정사각형으로 만들기 (투명 여백 추가)
        function makeSquare(imageData, targetSize) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = targetSize;
                    canvas.height = targetSize;
                    const ctx = canvas.getContext('2d');

                    // 투명 배경
                    ctx.clearRect(0, 0, targetSize, targetSize);

                    // 비율 유지하며 중앙 배치
                    const scale = Math.min(targetSize / img.width, targetSize / img.height);
                    const newWidth = img.width * scale;
                    const newHeight = img.height * scale;
                    const x = (targetSize - newWidth) / 2;
                    const y = (targetSize - newHeight) / 2;

                    ctx.drawImage(img, x, y, newWidth, newHeight);
                    resolve(canvas);
                };
                img.src = imageData;
            });
        }

        // 이미지 리사이즈/압축
        async function processResize(imageData, qualityVal, maxWidthVal, format, originalFormat) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    // 최대 너비 조정
                    if (width > maxWidthVal) {
                        height = (height * maxWidthVal) / width;
                        width = maxWidthVal;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');

                    // 투명 배경 지원 여부
                    const outputFmt = format === 'original' ? originalFormat : format;
                    if (outputFmt === 'jpeg') {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, width, height);
                    }

                    ctx.drawImage(img, 0, 0, width, height);

                    const mimeType = `image/${outputFmt === 'jpg' ? 'jpeg' : outputFmt}`;
                    const dataUrl = canvas.toDataURL(mimeType, qualityVal / 100);

                    resolve(dataUrl);
                };
                img.src = imageData;
            });
        }

        // 포맷 변환
        async function processConvert(imageData, format, qualityVal) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;

                    const ctx = canvas.getContext('2d');

                    // JPEG는 투명 배경 지원 안 함
                    if (format === 'jpeg' || format === 'bmp') {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, img.width, img.height);
                    }

                    ctx.drawImage(img, 0, 0);

                    let mimeType, dataUrl;

                    if (format === 'bmp') {
                        // BMP는 Canvas API가 지원하지 않으므로 PNG로 대체
                        mimeType = 'image/png';
                        dataUrl = canvas.toDataURL(mimeType);
                    } else if (format === 'ico') {
                        // 단일 사이즈 ICO
                        mimeType = 'image/png';
                        dataUrl = canvas.toDataURL(mimeType);
                    } else {
                        mimeType = `image/${format}`;
                        dataUrl = canvas.toDataURL(mimeType, qualityVal / 100);
                    }

                    resolve(dataUrl);
                };
                img.src = imageData;
            });
        }

        // ICO 파일 생성 (멀티사이즈)
        async function createICO(imageData, sizes, usePadding) {
            console.log('ICO 생성 시작, 사이즈:', sizes, '패딩:', usePadding);

            const pngDataArray = [];

            for (const size of sizes) {
                let canvas;

                if (usePadding) {
                    canvas = await makeSquare(imageData, size);
                } else {
                    canvas = await new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            const c = document.createElement('canvas');
                            c.width = size;
                            c.height = size;
                            const ctx = c.getContext('2d');
                            ctx.drawImage(img, 0, 0, size, size);
                            resolve(c);
                        };
                        img.src = imageData;
                    });
                }

                // PNG 데이터 추출
                const pngDataUrl = canvas.toDataURL('image/png');
                const base64 = pngDataUrl.split(',')[1];
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                pngDataArray.push({ size, data: bytes });
            }

            // ICO 파일 구조 생성
            const icoData = buildICO(pngDataArray);
            console.log('ICO 생성 완료, 크기:', icoData.byteLength);
            return new Blob([icoData], { type: 'image/x-icon' });
        }

        // ICO 파일 바이너리 구조 생성
        function buildICO(images) {
            // ICONDIR 헤더 (6 bytes)
            // ICONDIRENTRY (16 bytes each)
            // Image data

            const headerSize = 6;
            const entrySize = 16;
            const numImages = images.length;

            // 전체 크기 계산
            let totalSize = headerSize + (entrySize * numImages);
            const imageOffsets = [];

            for (const img of images) {
                imageOffsets.push(totalSize);
                totalSize += img.data.length;
            }

            const buffer = new ArrayBuffer(totalSize);
            const view = new DataView(buffer);
            const uint8 = new Uint8Array(buffer);

            // ICONDIR
            view.setUint16(0, 0, true);        // Reserved
            view.setUint16(2, 1, true);        // Type (1 = ICO)
            view.setUint16(4, numImages, true); // Number of images

            // ICONDIRENTRY for each image
            let offset = headerSize;
            for (let i = 0; i < images.length; i++) {
                const img = images[i];
                const size = img.size >= 256 ? 0 : img.size;

                view.setUint8(offset, size);           // Width
                view.setUint8(offset + 1, size);       // Height
                view.setUint8(offset + 2, 0);          // Color palette
                view.setUint8(offset + 3, 0);          // Reserved
                view.setUint16(offset + 4, 1, true);   // Color planes
                view.setUint16(offset + 6, 32, true);  // Bits per pixel
                view.setUint32(offset + 8, img.data.length, true);  // Image size
                view.setUint32(offset + 12, imageOffsets[i], true); // Image offset

                offset += entrySize;
            }

            // Image data
            for (let i = 0; i < images.length; i++) {
                uint8.set(images[i].data, imageOffsets[i]);
            }

            return buffer;
        }

        // 원본 포맷 추출
        function getOriginalFormat(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const formatMap = {
                'jpg': 'jpeg',
                'jpeg': 'jpeg',
                'png': 'png',
                'webp': 'webp',
                'gif': 'gif',
                'bmp': 'png',
                'svg': 'png',
                'psd': 'png',
                'ico': 'png',
                'tiff': 'png',
                'tif': 'png'
            };
            return formatMap[ext] || 'png';
        }

        // 처리 시작
        processBtn.addEventListener('click', async () => {
            console.log('처리 시작, 모드:', currentTab);

            progressBar.classList.add('show');
            processBtn.disabled = true;
            processBtn.innerHTML = '<span>⏳</span> 처리 중...';

            try {
                for (let i = 0; i < images.length; i++) {
                    const img = images[i];
                    console.log('처리 중:', img.name);

                    let processedData = null;
                    let processedBlob = null;
                    let newName = img.name;

                    if (currentTab === 'resize') {
                        // 크기/압축 모드
                        const qualityVal = parseInt(quality.value);
                        const maxWidthVal = parseInt(maxWidth.value);
                        const format = outputFormat.value;
                        const originalFormat = getOriginalFormat(img.name);

                        processedData = await processResize(img.dataUrl, qualityVal, maxWidthVal, format, originalFormat);

                        if (format !== 'original') {
                            const ext = format === 'jpeg' ? 'jpg' : format;
                            newName = img.name.replace(/\.[^.]+$/, `.${ext}`);
                        }
                    }
                    else if (currentTab === 'convert') {
                        // 포맷 변환 모드
                        const format = convertFormat.value;
                        const qualityVal = parseInt(convertQuality.value);

                        processedData = await processConvert(img.dataUrl, format, qualityVal);

                        const ext = format === 'jpeg' ? 'jpg' : format;
                        newName = img.name.replace(/\.[^.]+$/, `.${ext}`);
                    }
                    else if (currentTab === 'ico') {
                        // ICO 생성 모드
                        const checkedSizes = Array.from(document.querySelectorAll('input[name="icoSize"]:checked'))
                            .map(cb => parseInt(cb.value))
                            .sort((a, b) => a - b);

                        if (checkedSizes.length === 0) {
                            showToast('ICO 사이즈를 하나 이상 선택해주세요', 'error');
                            continue;
                        }

                        const usePadding = addPadding.checked;
                        processedBlob = await createICO(img.dataUrl, checkedSizes, usePadding);
                        processedData = URL.createObjectURL(processedBlob);
                        newName = img.name.replace(/\.[^.]+$/, '.ico');
                    }

                    // 결과 저장
                    img.processed = processedData;
                    img.processedName = newName;
                    img.processedBlob = processedBlob;

                    if (processedBlob) {
                        img.processedSize = processedBlob.size;
                    } else {
                        // Base64 크기 계산
                        const base64Data = processedData.split(',')[1];
                        img.processedSize = Math.round((base64Data.length * 3) / 4);
                    }

                    // 진행률 업데이트
                    const progress = ((i + 1) / images.length) * 100;
                    progressFill.style.width = progress + '%';

                    updateUI();
                }

                showToast('변환 완료!', 'success');
            } catch (error) {
                console.error('처리 에러:', error);
                showToast('처리 중 오류 발생', 'error');
            }

            progressBar.classList.remove('show');
            processBtn.disabled = false;
            processBtn.innerHTML = '<span>⚡</span> 변환 시작';
        });

        // 날짜/시간 폴더명 생성
        function getDateTimeFolderName() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `converted_${year}${month}${day}_${hours}${minutes}${seconds}`;
        }

        // Base64를 Blob으로 변환
        function dataUrlToBlob(dataUrl) {
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        // ZIP 다운로드
        downloadZipBtn.addEventListener('click', async () => {
            const processedImages = images.filter(img => img.processed);
            if (processedImages.length === 0) return;

            downloadZipBtn.disabled = true;
            downloadZipBtn.innerHTML = '<span>⏳</span> ZIP 생성 중...';

            try {
                const zip = new JSZip();
                const folderName = getDateTimeFolderName();
                const folder = zip.folder(folderName);

                processedImages.forEach(img => {
                    let blob;
                    if (img.processedBlob) {
                        blob = img.processedBlob;
                    } else {
                        blob = dataUrlToBlob(img.processed);
                    }
                    folder.file(img.processedName, blob);
                });

                const content = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `${folderName}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

                showToast('ZIP 다운로드 완료!', 'success');
            } catch (error) {
                showToast('ZIP 생성 중 오류', 'error');
                console.error('ZIP 에러:', error);
            }

            downloadZipBtn.disabled = false;
            downloadZipBtn.innerHTML = '<span>📦</span> ZIP 다운로드';
        });

        // 폴더에 저장 (File System Access API)
        downloadFolderBtn.addEventListener('click', async () => {
            const processedImages = images.filter(img => img.processed);
            if (processedImages.length === 0) return;

            try {
                const dirHandle = await window.showDirectoryPicker();
                const folderName = getDateTimeFolderName();
                const subDirHandle = await dirHandle.getDirectoryHandle(folderName, { create: true });

                downloadFolderBtn.disabled = true;
                downloadFolderBtn.innerHTML = '<span>⏳</span> 저장 중...';

                for (const img of processedImages) {
                    let blob;
                    if (img.processedBlob) {
                        blob = img.processedBlob;
                    } else {
                        blob = dataUrlToBlob(img.processed);
                    }
                    const fileHandle = await subDirHandle.getFileHandle(img.processedName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                }

                showToast(`${processedImages.length}개 파일 저장 완료!`, 'success');
            } catch (error) {
                if (error.name !== 'AbortError') {
                    showToast('폴더 저장 중 오류', 'error');
                    console.error('폴더 저장 에러:', error);
                }
            }

            downloadFolderBtn.disabled = false;
            downloadFolderBtn.innerHTML = '<span>📁</span> 폴더에 저장';
        });

        // 파일 다운로드 헬퍼
        function downloadImage(dataUrl, filename) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 전체 삭제
        clearAllBtn.addEventListener('click', () => {
            if (confirm('모든 이미지를 삭제하시겠습니까?')) {
                images = [];
                updateUI();
                showToast('모든 이미지 삭제됨', 'success');
            }
        });

        // 페이지 나가기 경고
        window.addEventListener('beforeunload', (e) => {
            if (images.length > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        console.log('이미지 변환기 초기화 완료');
    </script>
