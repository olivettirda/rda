<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 농업 조사 통합 도구 (개선판)</title>
    
    <!-- 파비콘 및 앱 아이콘 설정 -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/olivettirda/rda/refs/heads/main/ssallogo.png">
    <link rel="shortcut icon" type="image/png" href="https://raw.githubusercontent.com/olivettirda/rda/refs/heads/main/ssallogo.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/olivettirda/rda/refs/heads/main/ssallogo.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Malgun Gothic", -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .nav-tabs {
            background: #f8f9fa;
            display: flex;
            border-bottom: 3px solid #667eea;
        }
        .nav-tab {
            flex: 1;
            padding: 18px 25px;
            background: none;
            border: none;
            color: #666;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .nav-tab.active {
            color: #667eea;
            background: white;
        }
        .tab-content {
            display: none;
            padding: 30px;
        }
        .tab-content.active { display: block; }
        .panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .panel-title {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-info { background: #17a2b8; color: white; }
        
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .stats-table th {
            background: #667eea;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }
        .stats-table td {
            padding: 8px;
            text-align: center;
            border: 1px solid #ddd;
            font-size: 13px;
        }
        .stats-table tr:nth-child(even) { background: #f8f9fa; }
        
        .anova-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        .anova-table th {
            background: #f8f9fa;
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
            font-size: 14px;
        }
        .anova-table td {
            padding: 10px;
            border: 1px solid #ddd;
            font-size: 13px;
        }
        .significant { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌾 농업 조사 통합 도구</h1>
            <p>품종 목록 생성, 생육조사, 데이터 분석, 통계 처리를 한 곳에서</p>
        </div>
        
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab(event, 'list')">📝 품종 목록</button>
            <button class="nav-tab" onclick="switchTab(event, 'survey')">📊 생육조사</button>
            <button class="nav-tab" onclick="switchTab(event, 'analysis')">📈 데이터 분석</button>
            <button class="nav-tab" onclick="switchTab(event, 'statistics')">📉 통계 처리</button>
        </div>
        
        <div id="listTab" class="tab-content active">
            <p>품종 목록 생성 기능</p>
        </div>
        
        <div id="surveyTab" class="tab-content">
            <p>생육조사 양식 생성 기능</p>
        </div>
        
        <div id="analysisTab" class="tab-content">
            <p>데이터 분석 기능</p>
        </div>
        
        <div id="statisticsTab" class="tab-content">
            <p>통계 처리 기능</p>
        </div>
    </div>

<script>
// 전역 변수
let currentTab = "list";
let statsData = null;

// 탭 전환
function switchTab(event, tab) {
    currentTab = tab;
    document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    event.target.classList.add("active");
    document.getElementById(tab + "Tab").classList.add("active");
}

// 표준편차 계산 (n-1로 나누는 표본 표준편차)
function calculateStd(values) {
    if (values.length <= 1) return 0;
    const mean = values.reduce((a, b) => a + b, 0) / values.length;
    const variance = values.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / (values.length - 1);
    return Math.sqrt(variance);
}

// 엑셀 열 문자 변환 함수
function getExcelColumnLetter(columnNumber) {
    let columnLetter = "";
    while (columnNumber > 0) {
        let remainder = (columnNumber - 1) % 26;
        columnLetter = String.fromCharCode(65 + remainder) + columnLetter;
        columnNumber = Math.floor((columnNumber - 1) / 26);
    }
    return columnLetter;
}

console.log("농업 조사 통합 도구 로드 완료");
</script>
</body>
</html>
